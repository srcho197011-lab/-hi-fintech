/* ── 실시간 시뮬레이션: 신규 진단→세그먼트 이동 + 섹션별 건강케어 소비 스트림 ── */
const SIM_SECTIONS = [
  { key: "checkup", label: "건강검진", go: "checkup", c: "#2563EB", min: 80000, max: 600000, mrate: 0.10, w: 10 },
  { key: "supp", label: "영양제", go: "shop", c: "#16A34A", min: 12000, max: 95000, mrate: 0.25, w: 22 },
  { key: "diet", label: "건강식단", go: "shop", c: "#F59E0B", min: 40000, max: 160000, mrate: 0.20, w: 14 },
  { key: "device", label: "의료기기", go: "shop", c: "#0EA5E9", min: 30000, max: 420000, mrate: 0.18, w: 8 },
  { key: "pharm", label: "약국·의약외품", go: "hospital", c: "#0891B2", min: 2500, max: 32000, mrate: 0.25, w: 16 },
  { key: "homecare", label: "재가·돌봄", go: "homecare", c: "#DB2777", min: 180000, max: 1500000, mrate: 0.12, w: 6 },
  { key: "insurance", label: "보험료", go: "insurance", c: "#7C3AED", min: 20000, max: 130000, mrate: 0.15, w: 12 },
];
function _rr(a, b) { return a + Math.random() * (b - a); }
function _wsec() { const tot = SIM_SECTIONS.reduce((s, x) => s + x.w, 0); let r = Math.random() * tot; for (const s of SIM_SECTIONS) { r -= s.w; if (r <= 0) return s; } return SIM_SECTIONS[0]; }

function OntoLiveSim({ cohort, agg, onGo }) {
  const base = { high: (agg.byRisk[4] || 0) + (agg.byRisk[5] || 0), gap: agg.gapN, needy: agg.needyN };
  const [running, setRunning] = useState(true);
  const [speed, setSpeed] = useState(2);
  const [tick, setTick] = useState(0);
  const [events, setEvents] = useState([]);
  const ZERO = { dx: 0, buys: 0, spend: 0, accr: 0, don: 0, ops: 0, sec: {}, secN: {}, seg: { high: 0, gap: 0, needy: 0 } };
  const [st, setSt] = useState(ZERO);
  const stRef = useRef(ZERO);
  const idRef = useRef(0);
  useEffect(() => {
    if (!running) return;
    const iv = setInterval(() => {
      const s = { ...stRef.current, sec: { ...stRef.current.sec }, secN: { ...stRef.current.secN }, seg: { ...stRef.current.seg } };
      const newEvents = [];
      const nEv = 1 + (Math.random() < 0.6 ? 1 : 0);
      for (let e = 0; e < nEv; e++) {
        const m = cohort[Math.floor(Math.random() * cohort.length)];
        if (Math.random() < 0.34) { // 신규 진단
          const pool = (typeof _DEPT_DZ !== "undefined" && _DEPT_DZ[m.deptKey]) || ["이상지질혈증"];
          const cand = pool.filter((d) => !m.diseases.includes(d));
          const dz = cand.length ? cand[Math.floor(Math.random() * cand.length)] : pool[0];
          s.dx++;
          const moves = [];
          if ((m.risk >= 4) || (m.risk === 3 && Math.random() < 0.6)) { s.seg.high++; moves.push("고위험군"); }
          const needCov = (typeof DISEASE_INSURANCE !== "undefined" && DISEASE_INSURANCE[dz]) || [];
          if (needCov.some((c) => !m.coverages.includes(c)) && Math.random() < 0.55) { s.seg.gap++; moves.push("보장공백"); }
          if (m.income === "저" && Math.random() < 0.35) { s.seg.needy++; moves.push("치료비 사각지대"); }
          newEvents.push({ id: ++idRef.current, type: "dx", c: "#F472B6", who: `${m.name} (${m.id})`, text: `${m.deptLabel} · ${dz} 신규 진단`, move: moves.length ? "→ " + moves.join("·") + " 세그먼트 이동" : "위험도 재평가" });
        } else { // 건강케어 소비
          const sec = _wsec();
          const price = Math.round(_rr(sec.min, sec.max) / 1000) * 1000;
          const margin = Math.round(price * sec.mrate);
          const accr = Math.round(margin * 0.5), don = Math.round(margin * 0.3), ops = margin - accr - don;
          s.buys++; s.spend += price; s.accr += accr; s.don += don; s.ops += ops;
          s.sec[sec.key] = (s.sec[sec.key] || 0) + price; s.secN[sec.key] = (s.secN[sec.key] || 0) + 1;
          newEvents.push({ id: ++idRef.current, type: "buy", c: sec.c, who: `${m.name} (${m.id})`, text: `${sec.label} 소비 ${ontWon(price)}`, move: `적립 ${accr.toLocaleString()} · 나눔 ${don.toLocaleString()} · 운영 ${ops.toLocaleString()}` });
        }
      }
      stRef.current = s;
      setSt(s);
      setEvents((prev) => [...newEvents.reverse(), ...prev].slice(0, 22));
      setTick((t) => t + 1);
    }, Math.max(350, 1400 / speed));
    return () => clearInterval(iv);
  }, [running, speed, cohort]);
  const reset = () => { stRef.current = { dx: 0, buys: 0, spend: 0, accr: 0, don: 0, ops: 0, sec: {}, secN: {}, seg: { high: 0, gap: 0, needy: 0 } }; setEvents([]); setTick(0); setSt(stRef.current); };
  const secMax = Math.max(1, ...SIM_SECTIONS.map((s) => st.sec[s.key] || 0));
  const segCards = [["고위험군", base.high, st.seg.high, "#EF4444"], ["보장공백", base.gap, st.seg.gap, "#A78BFA"], ["치료비 사각지대", base.needy, st.seg.needy, "#E11D48"]];
  return (<>
    <div className="ontsimbar">
      <div className={`ontsimstate ${running ? "on" : ""}`}><span className="dot" /> {running ? "LIVE 실행 중" : "일시정지"} <em>· tick {tick.toLocaleString()}</em></div>
      <div className="ontsimctl">
        <button onClick={() => setRunning((v) => !v)} className="pri">{running ? <><Pause size={14} /> 일시정지</> : <><Play size={14} /> 재생</>}</button>
        {[1, 2, 4].map((sp) => <button key={sp} className={speed === sp ? "on" : ""} onClick={() => setSpeed(sp)}>{sp}x</button>)}
        <button onClick={reset}><RotateCcw size={14} /> 리셋</button>
      </div>
    </div>

    <div className="ontkpis" style={{ gridTemplateColumns: "repeat(5,1fr)" }}>
      {[["신규 진단", st.dx.toLocaleString() + "건", "#F472B6"], ["건강케어 소비", ontWon(st.spend), "#22D3EE"], ["적립(50%)", ontWon(st.accr), "#16A34A"], ["나눔(30%)", ontWon(st.don), "#E11D48"], ["운영(20%)", ontWon(st.ops), "#94A3B8"]].map(([k, v, c], i) => (
        <div className="ontkpi" key={i}><div className="ontkpi-v" style={{ color: c }}>{v}</div><div className="ontkpi-k">{k}</div></div>
      ))}
    </div>

    <div className="ontgrid2">
      <div className="ontpanel">
        <div className="ontph"><Zap size={15} color="#22D3EE" /> 섹션별 건강케어 소비 <span>· 실시간 누적 · {st.buys.toLocaleString()}건</span></div>
        {SIM_SECTIONS.map((s) => <OntBar key={s.key} label={`${s.label} (${(st.secN[s.key] || 0).toLocaleString()}건)`} value={st.sec[s.key] || 0} max={secMax} color={s.c} sub="" />)}
        <div className="ontsimsplit"><span>판매마진 분배</span><b style={{ color: "#16A34A" }}>적립 50%</b><b style={{ color: "#E11D48" }}>나눔 30%</b><b style={{ color: "#94A3B8" }}>운영 20%</b></div>
      </div>
      <div className="ontpanel">
        <div className="ontph"><TrendingUp size={15} color="#EF4444" /> 자동 세그먼트 이동 <span>· 신규 진단 반영</span></div>
        <div className="ontsegcards">{segCards.map(([t, b, dlt, c]) => (
          <div className="ontsegcard" key={t}><div className="ontsegcard-t">{t}</div><div className="ontsegcard-n" style={{ color: c }}>{(b + dlt).toLocaleString()}<span>명</span></div>{dlt > 0 && <div className="ontsegcard-d" style={{ color: c }}>▲ +{dlt} 이동</div>}</div>
        ))}</div>
        <div className="ontph" style={{ marginTop: 14 }}><Bell size={15} color="#FBBF24" /> 라이브 이벤트 스트림</div>
        <div className="ontfeed">
          {events.length === 0 && <div className="ontempty">시뮬레이션 이벤트를 기다리는 중…</div>}
          {events.map((ev) => (
            <div className={`ontfeed-i ${ev.type}`} key={ev.id}>
              <span className="ontfeed-ic" style={{ background: ev.c + "22", color: ev.c }}>{ev.type === "dx" ? <HeartPulse size={13} /> : <Zap size={13} />}</span>
              <div className="ontfeed-b"><div className="ontfeed-t"><b>{ev.who}</b> {ev.text}</div><div className="ontfeed-s">{ev.move}</div></div>
              <span className="ontfeed-tag" style={{ color: ev.c }}>{ev.type === "dx" ? "진단" : "소비"}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
    <div className="chnote" style={{ marginTop: 12 }}>※ 실시간 시뮬레이션은 <b>파일럿 시연</b>입니다. 매 틱마다 신규 진단·건강케어 소비 이벤트가 발생하고, 진단 결과에 따라 회원이 <b>고위험군·보장공백·치료비 사각지대</b> 세그먼트로 자동 이동합니다. 소비 판매마진은 <b>적립 50%·나눔 30%·운영 20%</b>로 분배됩니다(건강금융지갑 구조 연동).</div>
  </>);
}

function WpBadge({ st, small }) {

    <span style={{ display: "inline-flex", alignItems: "center", gap: 5, background: s.bg, color: s.color, fontWeight: 800, fontSize: small ? 11 : 12, padding: small ? "2px 8px" : "3px 10px", borderRadius: 999, whiteSpace: "nowrap" }}>

/* 굵게(**..**) 라이트 파서 */
function WpRich({ x }) {
  const parts = String(x).split(/(\*\*[^*]+\*\*)/g);
  return <>{parts.map((p, i) => p.startsWith("**") && p.endsWith("**") ? <b key={i} style={{ color: "#0F1F45" }}>{p.slice(2, -2)}</b> : <span key={i}>{p}</span>)}</>;
}

/* 본문 블록 렌더 */
function WpBlock({ b }) {
  if (b.t === "h") return <div style={{ fontSize: 16, fontWeight: 900, color: "#12203F", margin: "18px 0 8px", letterSpacing: -0.2 }}>{b.x}</div>;
  if (b.t === "p") return <p style={{ fontSize: 14, lineHeight: 1.8, color: "#374151", margin: "0 0 10px" }}><WpRich x={b.x} /></p>;

    <ul style={{ margin: "0 0 12px", paddingLeft: 4, listStyle: "none" }}>

    </ul>
  );
  if (b.t === "note") return (
    <div style={{ background: "linear-gradient(135deg,#EFF6FF,#F0FDFA)", border: "1px solid #BFDBFE", borderLeft: "4px solid #2563EB", borderRadius: 12, padding: "13px 16px", margin: "12px 0", fontSize: 13.5, lineHeight: 1.75, color: "#1E3A5F" }}>

      </table>
    </div>
  );
  if (b.t === "legal") return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, margin: "14px 0" }}>
      <div style={{ background: "#ECFDF5", border: "1px solid #A7F3D0", borderRadius: 12, padding: "12px 14px" }}>
        <div style={{ fontWeight: 900, color: "#047857", fontSize: 13, marginBottom: 8 }}>✅ 현행법상 가능</div>

      </div>
      <div style={{ background: "#FFF7ED", border: "1px solid #FED7AA", borderRadius: 12, padding: "12px 14px" }}>
        <div style={{ fontWeight: 900, color: "#C2410C", fontSize: 13, marginBottom: 8 }}>⚖️ 법·제도 개선 필요</div>
        {b.reform.map((it, i) => <div key={i} style={{ fontSize: 12.5, color: "#9A3412", lineHeight: 1.6, marginBottom: 5, display: "flex", gap: 6 }}><span>·</span><span>{it}</span></div>)}

/* ── 근거자료실(Evidence Library) — 법령·통계·표준 검색 ── */
function WpRefLibrary({ onGoChapter }) {
  const [q, setQ] = useState("");
  const [cat, setCat] = useState("all");
  const stats = React.useMemo(() => wpRefStats(), []);
  const results = React.useMemo(() => wpSearchRefs(q, cat), [q, cat]);
  const catList = [["all", "전체", stats.total]].concat(Object.keys(WP_REF_CATS).map((k) => [k, WP_REF_CATS[k].label, (stats.byCat.find((b) => b.k === k) || {}).n || 0]));

  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ background: "#F8FAFC", border: "1px solid #E5E9F0", borderRadius: 14, padding: "16px 18px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
          <div style={{ fontSize: 15, fontWeight: 900, color: "#0F1F45" }}>🔎 근거자료실 · 법령 · 통계 · 표준</div>
          <div style={{ fontSize: 12, color: "#6B7280", fontWeight: 700 }}>전체 {stats.total}건 · 검증완료 <b style={{ color: "#16A34A" }}>{stats.done}</b>건</div>
        </div>

        {/* 검색 입력 */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#fff", border: "1px solid #D8DEEA", borderRadius: 10, padding: "9px 13px" }}>
          <Search size={16} color="#94A3B8" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="법령·기관·키워드 검색 (예: 마이데이터, FHIR, GDPR, 보장률)" style={{ border: "none", outline: "none", flex: 1, fontSize: 13.5, color: "#334155", background: "transparent" }} />
          {q ? <span onClick={() => setQ("")} style={{ cursor: "pointer", color: "#94A3B8", fontSize: 16 }}>×</span> : null}
        </div>

        {/* 카테고리 필터 */}
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
          {catList.map(([k, label, n]) => {
            const c = WP_REF_CATS[k];
            const on = cat === k;
            return <span key={k} onClick={() => setCat(k)} style={{ cursor: "pointer", fontSize: 12, fontWeight: 800, padding: "5px 12px", borderRadius: 999, background: on ? (c ? c.color : "#1D4ED8") : (c ? c.bg : "#EEF2F7"), color: on ? "#fff" : (c ? c.color : "#475569"), border: "1px solid " + (on ? "transparent" : "#E5E9F0") }}>{label} {n}</span>;
          })}
        </div>
      </div>

      {/* 결과 목록 */}
      <div style={{ marginTop: 12 }}>
        {results.length === 0 ? (
          <div style={{ textAlign: "center", padding: "40px", color: "#94A3B8", fontSize: 14 }}>검색 결과가 없습니다.</div>
        ) : results.map((r) => {
          const c = WP_REF_CATS[r.cat] || WP_REF_CATS.cite;
          return (
            <div key={r.id} style={{ background: "#fff", border: "1px solid #E5E9F0", borderRadius: 12, padding: "13px 16px", marginBottom: 8 }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                <span style={{ flexShrink: 0, fontSize: 11, fontWeight: 900, color: c.color, background: c.bg, padding: "3px 9px", borderRadius: 7 }}>{c.label}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 800, color: "#12203F", lineHeight: 1.5 }}>{r.title}</div>
                  <div style={{ fontSize: 12, color: "#6B7280", marginTop: 3 }}>{r.org}{r.year ? ` · ${r.year}` : ""}{r.note ? <span style={{ color: r.status === "done" ? "#16A34A" : "#F59E0B" }}> · {r.status === "done" ? "검증완료" : r.note}</span> : ""}</div>
                  {r.tags && r.tags.length ? <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: 6 }}>{r.tags.map((t, i) => <span key={i} style={{ fontSize: 10.5, color: "#64748B", background: "#F1F5F9", padding: "2px 7px", borderRadius: 6 }}>#{t}</span>)}</div> : null}
                </div>
                <div style={{ flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 }}>
                  {r.ch && r.ch.length ? <span onClick={() => onGoChapter && onGoChapter(r.ch[0])} title={`제${r.ch[0]}장으로 이동`} style={{ cursor: "pointer", fontSize: 11, fontWeight: 800, color: "#1D4ED8", background: "#EFF6FF", padding: "3px 8px", borderRadius: 6 }}>제{r.ch[0]}장</span> : null}
                  {r.url ? <a href={r.url} target="_blank" rel="noreferrer" style={{ fontSize: 11, fontWeight: 700, color: "#0F8A74", textDecoration: "none" }}>원문 ↗</a> : null}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="chnote" style={{ marginTop: 12 }}>※ 근거자료실은 <b>장별 인용출처(검증완료)</b>와 <b>핵심 법령·표준 카탈로그</b>를 함께 검색합니다. 카탈로그 항목은 해당 장 작성 시 원문·최신개정을 검증해 <b>검증완료</b>로 승격됩니다. 법령 원문은 국가법령정보센터, 통계는 발행기관 원자료를 우선합니다.</div>
    </div>
  );
}

/* ====================== 재무회계 온톨로지 시스템 (K-IFRS) ======================
   섹션별 거래(제품판매·입점수수료·EMR/SaaS·보험중개·광고)를 실시간 분개(journal)로 인식하고,
   K-IFRS 손익계산서(매출→매출원가→매출총이익→판관비→영업이익→기타손익→법인세전이익→법인세→당기순이익)와
   부채(토큰적립금=계약부채, 기부금준비금, 매입채무)를 실시간 집계하는 회계 시뮬레이션 대시보드. */

const FIN_TAX = 0.22; // 법인세율(지방세 포함 근사)
const finWon = (n) => { n = Math.round(n); const s = n < 0 ? "-" : ""; n = Math.abs(n); if (n >= 100000000) return s + (n / 100000000).toFixed(2) + "억"; if (n >= 10000) return s + Math.round(n / 10000).toLocaleString() + "만"; return s + n.toLocaleString(); };
const finRr = (a, b) => a + Math.random() * (b - a);
// 매출 유형(수익 계정) — IFRS 15 수익
const FIN_REVTYPES = [
  { k: "product", label: "제품판매 매출", src: "건강쇼핑(GMV)", c: "#34D399", w: 38, min: 15000, max: 320000 },
  { k: "checkup", label: "검진 연계 수수료", src: "건강검진센터", c: "#22D3EE", w: 20, min: 15000, max: 30000 },
  { k: "service", label: "헬스케어 서비스 수수료", src: "상담·홈케어·재활·PT", c: "#2DD4BF", w: 12, min: 8000, max: 40000 },

/* ====================== 마케팅 온톨로지 시스템 ======================
   운영(코호트)·재무(손익) 데이터를 실시간 분석 → 매출 증감 원인 진단 → 마케팅 방안 자동 결정 →
   채널별(유튜브·SNS·검색·기관) 맞춤 광고 집행 + AI 크리에이티브(광고영상·시안) 자동 제작 +
   실시간 AI 마케팅 에이전트 실행. */

const mktWon = (n) => { n = Math.round(n); const s = n < 0 ? "-" : ""; n = Math.abs(n); if (n >= 100000000) return s + (n / 100000000).toFixed(1) + "억"; if (n >= 10000) return s + Math.round(n / 10000).toLocaleString() + "만"; return s + n.toLocaleString(); };
const mktRr = (a, b) => a + Math.random() * (b - a);

  if (/천만/.test(scale)) return 8000000;

  return 10000000;
}

  const gmv = buyers * 200000;

function socialImpact() {
  const agg = (typeof pilotAgg === "function") ? pilotAgg() : { n: 100000, needyN: 8200, gapN: 21000, households: 42000, totalCost: 0 };
  // 재무회계 모델 연동 — 제품마진 → 적립50%·나눔30%·운영20%(+유기동물). 1차연도(10만 회원, 파일럿 규모) 기준.
  const fs = (typeof finSocial === "function") ? finSocial(0) : { margin: 655500000, earn: 327750000, give: 196650000, ops: 131100000, animal: 8193750, beneficiaries: 771 };
  const earn = fs.earn, give = fs.give, ops = fs.ops, animal = fs.animal, marginTotal = fs.margin;
  const activeRate = 0.45;
  const activeN = Math.round(agg.n * activeRate);
  const beneficiaries = fs.beneficiaries;            // 치료비 수혜자 = 나눔 ÷ 1인 지원액
  const socialValue = give + Math.round(earn * 0.6) + animal; // 사회적 편익 근사
  const sroi = Math.round(socialValue / ops * 10) / 10;
  return { agg, participants: agg.n, activeN, activeRate, earn, give, ops, animal, marginTotal, beneficiaries, needyN: agg.needyN, gapN: agg.gapN, households: agg.households, socialValue, sroi };
}

/* SEI 종합지수 게이지(원형) */
function SocGauge({ score, grade, size = 128 }) {
  const r = size / 2 - 10, C = 2 * Math.PI * r, off = C * (1 - score / 100);
  return (
    <div className="socgauge" style={{ width: size, height: size }}>
      <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", height: "100%" }}>
        <defs><linearGradient id="socgauge-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#34D399" /><stop offset=".5" stopColor="#22D3EE" /><stop offset="1" stopColor="#FB7185" /></linearGradient></defs>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(255,255,255,.15)" strokeWidth="9" />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="url(#socgauge-g)" strokeWidth="9" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={off} transform={`rotate(-90 ${size / 2} ${size / 2})`} />
      </svg>
      <div className="socgauge-c"><b>{score}</b><span>/ 100</span><em>{grade}</em></div>
    </div>
  );
}

    const dv = _cnKbFind(typeof DEVICE_KB !== "undefined" ? DEVICE_KB : null, s.label); if (dv && !seen.device.has(dv._k)) { seen.device.add(dv._k); reco.device.push(Object.assign({ from: s.label }, dv)); }
    const dt = _cnKbFind(typeof DIET_KB !== "undefined" ? DIET_KB : null, s.label); if (dt && !seen.diet.has(dt._k)) { seen.diet.add(dt._k); reco.diet.push(Object.assign({ from: s.label }, dt)); }
  }
  const groups = ["checkup", "dept", "nutrition", "device", "diet"];
  const coverage = groups.filter((g) => reco[g].length).length;
  const last14 = events.filter((e) => e.daysAgo <= 14).length;
  const total = events.length;
  const recoCount = groups.reduce((n, g) => n + reco[g].length, 0);
  return { member: m, events, signals, reco, stats: { total, last14, coverage, recoCount, topTopic: signals[0] ? signals[0].label : "-" }, maxScore: signals[0] ? signals[0].score : 1 };
}

/* 장별 인용출처 + 카탈로그를 하나의 검색 대상으로 병합 */
function wpAllRefs() {
  const fromCh = [];
  WHITEPAPER.forEach((c) => (c.sources || []).forEach((s, i) => fromCh.push({
    id: `ch${c.no}-${i}`, cat: s.cat || "cite", title: s.title, org: s.org || "", year: s.year || "",
    url: s.url || "", tags: s.tags || [], ch: [c.no], note: s.note || "",
    status: (s.note || "").includes("검증완료") ? "done" : "todo",
  })));
  return [...fromCh, ...WP_REFS];
}

/* 키워드·카테고리 검색 */
function wpSearchRefs(q, cat) {
  const t = String(q || "").trim().toLowerCase();
  return wpAllRefs().filter((r) => {
    if (cat && cat !== "all" && r.cat !== cat) return false;
    if (!t) return true;
    const hay = [r.title, r.org, r.note, (r.tags || []).join(" ")].join(" ").toLowerCase();
    return hay.includes(t);
  });
}

/* 진행률 집계 */
function wpProgress() {
  const total = WHITEPAPER.length;
  const done = WHITEPAPER.filter((c) => c.status === "done").length;
  const inprog = WHITEPAPER.filter((c) => c.status === "draft" || c.status === "review" || c.status === "research").length;
  const pctSum = WHITEPAPER.reduce((s, c) => s + (WP_STATUS[c.status] ? WP_STATUS[c.status].pct : 0), 0);
  return { total, done, inprog, planned: total - done - inprog, pct: Math.round(pctSum / total) };
}

/* ====================== 건강쇼핑 — 영양제 상품 데이터셋 + 건강적립금 모듈 ======================
   출처: 브랜드 공식몰 / 네이버쇼핑·쿠팡 최저가(수집 예시 시점 2026-07-01). 가격은 변동되며 표시가는 수집 시점 기준.
   ⚠️ 기능성 문구는 식약처 인정 기능성 '요약·재작성'(원문 복제 아님). 이미지는 재호스팅하지 않고 출처 링크 참조.
   실제 상용 판매에는 각 브랜드 제휴 또는 네이버/쿠팡 오픈마켓·제휴 API 연동이 필요함.

   건강적립금 규칙:  공급가 = P×SUPPLY_RATE(0.5) · 마진 = P−공급가 · 적립금 = 마진×MARGIN_REWARD_RATE(0.5) = P×0.25 (원 단위 내림) */
const SHOP_REWARD_CFG = { supplyRate: 0.50, marginRewardRate: 0.50 };
function healthReward(price, cfg) {
  const c = cfg || SHOP_REWARD_CFG;
  const p = Math.max(0, Math.floor(Number(price) || 0));
  const supply = Math.floor(p * c.supplyRate);
  const margin = p - supply;
  const reward = Math.floor(margin * c.marginRewardRate);
  return { supply, margin, reward, rate: p ? reward / p : 0 };
}
/* 단위 테스트(콘솔): runShopRewardTests() — 예시값 검증 */
function runShopRewardTests() {
  const cases = [[30000, 7500], [19900, 4975], [45000, 11250], [0, 0]];
  const out = cases.map(([p, exp]) => { const got = healthReward(p).reward; return { price: p, expected: exp, got, ok: got === exp }; });
  const pass = out.every((x) => x.ok);
  try { console.log("[shopReward test]", pass ? "PASS" : "FAIL", out); } catch (e) {}
  return { pass, out };
}

  const cur = demoRegistered();
  const emails = new Set(cur.map((m) => m.email));
  let added = 0, skipped = 0;
  (demoMembers || []).forEach((m) => { if (emails.has(m.email)) { skipped++; } else { cur.push(m); emails.add(m.email); added++; } });
  try { localStorage.setItem(DEMO_KEY, JSON.stringify(cur)); } catch (e) {}
  return { added, skipped, total: cur.length };
}
function demoListAll() { const r = demoRegistered(); return r.length ? r : (demoMembers || []); }
function demoFindByEmail(email) { const e = (email || "").trim().toLowerCase(); return demoListAll().find((m) => m.email.toLowerCase() === e); }
function demoAuthenticate(email, pw) { const m = demoFindByEmail(email); return (m && pw === "Demo@1234") ? m : null; }

function demoNotify() { try { window.dispatchEvent(new Event("demochange")); } catch (e) {} }

function AuthSignup() {
  const [step, setStep] = useState(1);
  // 실명확인
  const [name, setName] = useState("");
  const [birth, setBirth] = useState("");
  const [gender, setGender] = useState("");
  const [carrier, setCarrier] = useState("");
  const [phone, setPhone] = useState("");
  const [code, setCode] = useState("");
  const [sentCode, setSentCode] = useState(null);
  const [verified, setVerified] = useState(false);
  // 계정
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [agree, setAgree] = useState(false);
  const [err, setErr] = useState("");

  const phoneDigits = phone.replace(/\D/g, "");
  const idOk = name.trim() && /^\d{6}$/.test(birth) && /^[1-4]$/.test(gender) && carrier && /^\d{10,11}$/.test(phoneDigits);
  const sendCode = () => {
    setErr("");
    if (!idOk) { setErr("이름·주민번호 앞 6자리·성별·통신사·휴대폰번호를 정확히 입력해 주세요."); return; }
    const c = String(100000 + (parseInt(phoneDigits.slice(-6) || "0", 10) % 900000)).slice(0, 6);
    setSentCode(c); setVerified(false); setCode("");
  };
  const verify = () => {
    setErr("");
    if (!sentCode) { setErr("먼저 인증번호를 받아 주세요."); return; }
    if (code.trim() !== sentCode) { setErr("인증번호가 일치하지 않습니다."); return; }
    setVerified(true);
  };
  const next = () => { setErr(""); if (!verified) { setErr("실명확인(본인인증)을 완료해 주세요."); return; } setStep(2); };
  const finish = (e) => {
    if (e) e.preventDefault();
    setErr("");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setErr("올바른 이메일 형식을 입력해 주세요."); return; }
    if (pw.length < 8) { setErr("비밀번호는 8자 이상이어야 합니다."); return; }
    if (pw !== pw2) { setErr("비밀번호가 일치하지 않습니다."); return; }
    if (!agree) { setErr("서비스 이용약관·개인정보 처리방침에 동의해 주세요."); return; }
    if ((typeof demoFindByEmail === "function" && demoFindByEmail(email)) || userFindByEmail(email)) { setErr("이미 가입된 이메일입니다."); return; }
    const prof = demoMakeProfile(name.trim(), email.trim(), birth, gender);
    prof.password = pw;
    userRegister(prof);
    authSet({ name: prof.name, email: prof.email, realVerified: true });
    demoSetSession(prof);
  };

  return (
    <div className="authform">
      <div className="authsteps">
        <span className={`astep ${step === 1 ? "on" : verified ? "done" : ""}`}>1 실명확인</span>
        <span className="astepline" />
        <span className={`astep ${step === 2 ? "on" : ""}`}>2 계정 생성</span>
      </div>

      {step === 1 && (<>
        <label className="authfield"><span className="authlabel">이름(실명)</span>
          <input className="authinput" value={name} onChange={(e) => setName(e.target.value)} placeholder="홍길동" /></label>
        <div className="authfield"><span className="authlabel">주민등록번호</span>
          <div className="authrrn">
            <input className="authinput" value={birth} onChange={(e) => setBirth(e.target.value.replace(/\D/g, "").slice(0, 6))} placeholder="앞 6자리(생년월일)" inputMode="numeric" />
            <span className="authdash">–</span>
            <input className="authinput authg" value={gender} onChange={(e) => setGender(e.target.value.replace(/\D/g, "").slice(0, 1))} placeholder="0" inputMode="numeric" maxLength={1} />
            <span className="authmask">● ● ● ● ● ●</span>
          </div>
        </div>
        <div className="authrow2">
          <label className="authfield"><span className="authlabel">통신사</span>
            <select className="authinput" value={carrier} onChange={(e) => setCarrier(e.target.value)}>
              <option value="">선택</option><option>SKT</option><option>KT</option><option>LG U+</option><option>알뜰폰</option>
            </select></label>
          <label className="authfield"><span className="authlabel">휴대폰번호</span>
            <input className="authinput" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="010-1234-5678" inputMode="tel" /></label>
        </div>
        <button type="button" className="authbtn authghost" onClick={sendCode} disabled={verified}>인증번호 받기</button>
        {sentCode && (
          <div className="authcode">
            <div className="authcodemsg">인증번호가 발송되었습니다. <b className="democode">체험 환경 — 인증번호: {sentCode}</b><button type="button" className="authautofill" onClick={() => setCode(sentCode)}>자동입력</button></div>
            <div className="authquick">
              <input className="authinput" value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 6))} placeholder="인증번호 6자리" inputMode="numeric" disabled={verified} />
              <button type="button" className="authbtn authsmall" onClick={verify} disabled={verified}>확인</button>
            </div>
          </div>
        )}
        {verified && <div className="authok">✓ 실명확인이 완료되었습니다 ({name}님)</div>}
        {err && <div className="autherr">{err}</div>}
        <button type="button" className="authbtn authprimary" onClick={next}>다음 단계</button>
      </>)}

      {step === 2 && (<form onSubmit={finish}>
        <div className="authverified">✓ {name}님 실명확인 완료</div>
        <label className="authfield"><span className="authlabel">이메일</span>
          <input className="authinput" type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" autoComplete="username" /></label>
        <label className="authfield"><span className="authlabel">비밀번호(8자 이상)</span>
          <input className="authinput" type="password" value={pw} onChange={(e) => setPw(e.target.value)} placeholder="비밀번호" autoComplete="new-password" /></label>
        <label className="authfield"><span className="authlabel">비밀번호 확인</span>
          <input className="authinput" type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} placeholder="비밀번호 재입력" autoComplete="new-password" /></label>
        <label className="authagree"><input type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} /> 서비스 이용약관 및 개인정보 처리방침에 동의합니다.</label>
        {err && <div className="autherr">{err}</div>}
        <div className="authrow2">
          <button type="button" className="authbtn authghost" onClick={() => { setErr(""); setStep(1); }}>이전</button>
          <button type="submit" className="authbtn authprimary">가입 완료</button>
        </div>
      </form>)}
    </div>
  );
}

/* ====================== 검진 리포트 보관함 (건강관리 → 검진 리포트) ====================== */
/* 외부 검진 시스템(age.healthketch.com)에서 발행한 리포트를 고객 동의 후 업로드·보관.
   백엔드 없는 예시이므로 파일은 base64로 브라우저 localStorage에만 저장(회원별 키). */
function ReportVault({ user }) {
  const key = "hifin_reports_" + ((user && user.email) || "default");
  const load = () => { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; } };
  const [list, setList] = useState(load);
  const [agree, setAgree] = useState(false);
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const who = (user && user.name) || "조성래";

  const save = (l) => {
    try { localStorage.setItem(key, JSON.stringify(l)); } catch (e) { setMsg({ t: "저장 공간이 부족합니다. 기존 리포트를 삭제하거나 더 작은 파일을 올려주세요.", e: true }); return false; }
    setList(l); return true;
  };
  const onPick = (e) => {
    setMsg(null);
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 3 * 1024 * 1024) { setMsg({ t: "3MB 이하 파일만 업로드할 수 있습니다 (브라우저 로컬 저장 제한).", e: true }); e.target.value = ""; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const item = { id: "r" + new Date().getTime(), name: f.name, type: f.type || "", size: f.size, dataUrl: reader.result, date: new Date().toLocaleString("ko-KR") };
      if (save([item, ...list])) setMsg({ t: "검진 리포트가 업로드되었습니다.", e: false });
    };
    reader.onerror = () => setMsg({ t: "파일을 읽지 못했습니다. 다시 시도해 주세요.", e: true });
    reader.readAsDataURL(f);
    e.target.value = "";
  };
  const del = (id) => { setMsg(null); save(list.filter((r) => r.id !== id)); };
  const open = (r) => {
    const w = window.open("", "_blank");
    if (!w) { setMsg({ t: "팝업이 차단되었습니다. 팝업 허용 후 다시 시도해 주세요.", e: true }); return; }
    if ((r.type || "").indexOf("image") === 0) w.document.write('<title>' + r.name + '</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="' + r.dataUrl + '" style="max-width:100%;max-height:100vh"></body>');

  return (

      <div className="rvnote"><ShieldCheck size={16} color="#16A34A" style={{ flexShrink: 0, marginTop: 1 }} />

      <label className="rvagree"><input type="checkbox" checked={agree} onChange={(e) => setAgree(e.target.checked)} /> 고객 본인의 동의를 받아 리포트를 등록합니다.</label>

      <div className="rvup">
        <input ref={fileRef} type="file" accept="application/pdf,image/*" style={{ display: "none" }} onChange={onPick} />
        <button className="rvbtn pri" disabled={!agree} onClick={() => fileRef.current && fileRef.current.click()}><Plus size={16} /> 리포트 업로드 (PDF·이미지)</button>
        <a className="rvbtn ghost" href="https://www.healthketch.com/outside/event/checkup-analysis/hizencare-pp-0UVIFW" target="_blank" rel="noopener noreferrer"><ExternalLink size={15} /> 발행 사이트 열기</a>
      </div>

      {msg && <div className={`rvmsg ${msg.e ? "err" : "ok"}`}>{msg.e ? <AlertTriangle size={14} /> : <Check size={14} />} {msg.t}</div>}

      {list.length === 0 ? (
        <div className="rvempty"><FileText size={30} color="#C2CCDD" /><div>아직 업로드된 검진 리포트가 없습니다.<br />동의 확인 후 발행된 리포트를 업로드해 주세요.</div></div>
      ) : (
        <div className="rvgrid">
          {list.map((r) => (
            <div className="rvitem" key={r.id}>
              <div className="rvthumb" onClick={() => open(r)} role="button" title="크게 보기">
                {isImg(r) ? <img src={r.dataUrl} alt={r.name} /> : <span className="rvpdf"><FileText size={30} color="#2F5BEA" /><em>PDF</em></span>}
              </div>
              <div className="rvmeta"><b title={r.name}>{r.name}</b><span>{r.date} · {(r.size / 1024).toFixed(0)}KB</span></div>
              <div className="rvact"><button onClick={() => open(r)}><ExternalLink size={13} /> 보기</button><button className="del" onClick={() => del(r.id)}><X size={13} /> 삭제</button></div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ====================== 스포츠 임베디드 보험 (Sports Embedded Insurance) ====================== */
/* "운동은 자유롭게, 사고 대비는 자동으로" — 스포츠 활동에 자동 결합되는 임베디드 보험 소개 */
function SinsCountUp({ to, dur, suffix }) {
  const [v, setV] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    let raf, start, started = false, io, fb, finalT;
    const el = ref.current;
    const run = () => {
      if (started) return; started = true;
      const step = (t) => { if (!start) start = t; const p = Math.min(1, (t - start) / (dur || 1200)); setV(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(step); };
      raf = requestAnimationFrame(step);
      finalT = setTimeout(() => setV(to), (dur || 1200) + 250); // rAF 미동작 시에도 최종값 보장
    };
    if (typeof IntersectionObserver !== "undefined" && el) {
      io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { run(); io.disconnect(); } }), { threshold: 0.3 });
      io.observe(el);
    }
    fb = setTimeout(run, 700); // 보장: IO 미동작 환경에서도 실행
    return () => { if (io) io.disconnect(); clearTimeout(fb); clearTimeout(finalT); if (raf) cancelAnimationFrame(raf); };
  }, [to, dur]);
  return <span ref={ref}>{v.toLocaleString("ko-KR")}{suffix || ""}</span>;
}
