function searchHealth(query, filter, list) {
  const s = (query || "").trim().toLowerCase().replace(/\s/g, ""); if (!s) return [];
  const norm = (t) => (t || "").toLowerCase().replace(/\s/g, "");
  return (list && list.length ? list : HEALTH_CONTENTS).map((c) => {
    const F = { "증상": c.symptoms.join(" "), "질병": c.title + " " + c.relatedDiseases.join(" "), "검사": c.tests.join(" ") + " " + c.treatment.join(" "), "생활관리": c.lifestyle.join(" ") + " " + c.prevention.join(" ") };

          <button className={`mic ${listening ? "on" : ""}`} onClick={() => listening ? (recogRef.current && recogRef.current.stop()) : startStt()} title={sttOK ? "음성으로 질문하기" : "이 브라우저는 음성입력 미지원"}>{listening ? <X size={18} /> : <Mic size={18} />}</button>
          <button className="go" onClick={() => run()}>{T.go}</button>
        </div>
        <div className="aidfilters">{FILTERS.map(([k, label], i) => <button key={k} className={filter === k ? "on" : ""} onClick={() => run(q, filter === k ? null : k)}>{T.filters[i]}</button>)}</div>
        {listening && <div className="aidlisten"><Mic size={13} /> {T.listen}</div>}
      </div>

      {!submitted && (<>
        {(typeof demoCurrentUser === "function" && demoCurrentUser()) && (<>
          <div className="aidrech">⭐ {demoCurrentUser().name}님 맞춤 질문 <span className="clickhint"><Info size={11} /> 건강상태 기반 자동 생성</span></div>
          <div className="aidfav">{memberQuestions(demoCurrentUser()).slice(0, 14).map((qq) => <button key={qq} onClick={() => run(qq)}>{qq}</button>)}</div>
        </>)}
        {FAVORITES.length > 0 && (
          <div className="aidfnews">
            <div className="fnh"><Bell size={14} /> {T.fav}</div>
            {FAVORITES.slice(0, 5).map((f, i) => <button className="fnr" key={f.id} onClick={() => run(f.title)}><span className="fnt">★ {f.title}</span><span className="fnm">{(lang === "en" ? FAV_NEWS_EN : FAV_NEWS_KO)[i % 4]}</span><ChevronRight size={15} /></button>)}
          </div>
        )}
        <div className="aidrech">{T.recQ}</div>
        <div className="aidrecq">{REC_Q.map(([disp, query]) => <button key={disp} onClick={() => run(query)}><HelpDot /> {disp}</button>)}</div>
        <div className="aidrech">{T.cats}</div>
        <div className="aidcats">{HC_CATS.map(([t, Ic, query]) => <button key={t} onClick={() => run(query)}><span className="ci"><Ic size={17} /></span>{t}</button>)}</div>
        <div className="aidrech">건강 지식 데이터하우스 <span style={{ fontSize: 11, color: "var(--muted)", fontWeight: 600 }}>· AI 주치의 온톨로지(영양·기기·식단·제도·검진·사례·대상군)</span></div>
        <div className="aidcatlist">{ontoCats.map((c) => <button key={c.key} className={browseCat === c.key ? "on" : ""} onClick={() => setBrowseCat(browseCat === c.key ? null : c.key)}>{c.name} <span>{c.count}</span></button>)}</div>
        {browseCat && (() => { const grp = ontoCats.find((g) => g.key === browseCat); if (!grp) return null; return (
          <div className="aidbrowse">
            <div className="bbh">{grp.name} <b>{grp.items.length}{lang === "en" ? "" : "건"}</b><span className="bbx" onClick={() => setBrowseCat(null)}>{T.close}</span></div>
            {grp.items.map((it, i) => <button className="brow" key={i} onClick={() => run(it.q)}><span className="bl"><span className="bt">{it.t}</span><span className="bs">{it.s}</span></span><span className="brisk" style={{ color: "#2563EB", background: "#EAF0FE" }}>AI 상담 ›</span></button>)}
          </div>
        ); })()}
      </>)}

      {/* 상담 결과 */}
      {submitted && (
        <div className="aidresult" ref={panelRef}>
          {caseData ? (
            <CaseCard data={caseData} onPlan={() => run("내 종합 케어플랜")} />
          ) : ontoTxt ? (
            <div className="adcard">
              <div className="adt2"><Sparkles size={16} color="#7C3AED" /> 사례기반 심층 상담 <span className="cplvl" style={{ color: "#7C3AED", background: "#F3EDFE", borderColor: "#DDD0F7" }}>의료법 준수 참고안내</span></div>
              <div className="aianswer" style={{ whiteSpace: "pre-wrap", lineHeight: 1.75, fontSize: 13.5, color: "#2a3550", marginTop: 6 }}>{ontoTxt}</div>
              <div className="adcta">
                <button className="cbtn pri" style={{ margin: 0 }} onClick={() => run("내 종합 케어플랜")}><HeartHandshake size={14} /> 내 케어플랜 보기</button>
                <button className="cbtn" style={{ margin: 0 }} onClick={() => nav("checkup")}><CalendarCheck size={14} /> 검진 예약</button>
              </div>
              <div className="aiddisc" style={{ marginTop: 10 }}><AlertTriangle size={14} /> 일반적 건강관리 경향에 대한 참고 안내이며, 효과를 보장하지 않습니다. 구체적 치료·약물은 의료진과 상담하세요.</div>
            </div>
          ) : personal ? (<>
            <div className="adcard adpersonal">
              <div className="adtop"><div><div className="adt">{personal.title}</div><div className="adcat">시연용 예시 데이터 기반 분석</div></div>
                <span className="adrisk" style={{ color: personal.grade[1], background: personal.grade[2] }}>암위험 {personal.grade[0]}</span></div>
              {personal.sections.map(([label, items], i) => (
                <div className="adsec" key={i}><div className="adsl"><Check size={14} color="#2563EB" /> {i + 1}. {label}</div><ul>{(items || []).map((x, j) => <li key={j}>{x}</li>)}</ul></div>
              ))}
              <div className="adcta">
                <button className="cbtn pri" style={{ margin: 0 }} onClick={() => openConsult("내 몸 맞춤 프리미엄보험")}><Sparkles size={14} /> 맞춤 보험 추천받기</button>
                <button className="cbtn" style={{ margin: 0 }} onClick={() => nav("wallet")}><Wallet size={14} /> 건강지갑 보기</button>
                <button className="cbtn" style={{ margin: 0 }} onClick={() => nav("demo")}><CircleUserRound size={14} /> 내 대시보드</button>
              </div>
              <div className="aiddisc" style={{ marginTop: 12 }}><AlertTriangle size={14} /> 본 내용은 시연용 예시 데이터 기반 분석이며, 실제 의학적 진단이나 보험 가입 심사를 대체하지 않습니다.</div>
            </div>
            <CarePlanCard member={demoCurrentUser()} />
            </>) : result ? (<>
            <div className="adcard">
              <div className="adtop">
                <div><div className="adt">{result.title}</div><div className="adcat">{result.category}{result.subCategory ? " · " + result.subCategory : ""}</div></div>
                <span className="adrisk" style={{ color: RISK[dispRisk][1], background: RISK[dispRisk][2] }}>{riskLabel(dispRisk)}</span>
              </div>
              <div className={`adsum ${readingKey === "summary" ? "reading" : ""}`}><b>{T.summary}</b><p>{result.summary}</p></div>
              {easy && <div className="adeasy"><Info size={14} /> 쉬운 설명: {answerText(result, true)}</div>}
              <Sec ic={Info} t={T.causes} items={result.causes} c="#F59E0B" k="causes" />
              <Sec ic={Activity} t={T.symptoms} items={result.symptoms} c="#EF4444" k="symptoms" />
              <Sec ic={Stethoscope} t={T.tests} items={result.tests} c="#2563EB" k="tests" />
              <Sec ic={Salad} t={T.lifestyle} items={result.lifestyle} c="#16A34A" k="lifestyle" />
              <Sec ic={Building2} t={T.whenDoctor} items={result.whenDoctor} c="#7C3AED" k="whenDoctor" />
              <Sec ic={AlertTriangle} t={T.emergency} items={result.emergency} c="#EF4444" k="emergency" />
              <Chips t={T.relDz} items={result.relatedDiseases} />
              <Chips t={T.relTest} items={result.relatedTests} />
              <div className="adchipline"><span className="adcl">{T.relDept}</span>{result.relatedDepartments.map((d, i) => <span className="addept" key={i}>{d}</span>)}</div>
              <div className="adacts">
                <button className={readingKey ? "on" : ""} onClick={() => readAloud(result)}><Volume2 size={14} /> 답변 듣기{readingKey ? " · 읽는 중" : ""}</button>
                <button onClick={() => speak(`위험도 분류는 ${RISK[dispRisk][0]} 입니다. ` + answerText(result, true))}><Volume2 size={14} /> 쉬운 설명으로 듣기</button>
                <button className={slow ? "on" : ""} onClick={() => setSlow((v) => !v)}>{slow ? "느리게 ✓" : "느리게 읽기"}</button>
                <button className={easy ? "on" : ""} onClick={() => setEasy((v) => !v)}>쉬운 설명 {easy ? "끄기" : "보기"}</button>
                <button onClick={() => shareGuardian(result)}><Users size={14} /> 보호자 공유</button>
                <button onClick={() => printConsult(result)}><FileText size={14} /> PDF·인쇄</button>
                <button className={isFav(result.id) ? "on" : ""} onClick={() => toggleFav(result)}>{isFav(result.id) ? "★ 즐겨찾기 해제" : "☆ 즐겨찾기"}</button>
                {speaking && <button onClick={stopSpeak}><X size={14} /> 멈춤</button>}
              </div>
            </div>

            {/* 관련 질환 비교표 */}
            {compareRows.length > 1 && (
              <div className="adcard adcompare">
                <div className="adt2"><Activity size={16} color="#2F5BEA" /> {lang === "en" ? "Compare related conditions" : "관련 질환 비교"}</div>
                <div className="acwrap"><table className="actbl">
                  <thead><tr><th>{lang === "en" ? "Condition" : "질환"}</th><th>{lang === "en" ? "Risk" : "위험도"}</th><th>{lang === "en" ? "Key test" : "주요 검사"}</th><th>{lang === "en" ? "Dept." : "진료과"}</th></tr></thead>
                  <tbody>{compareRows.map((c) => (
                    <tr key={c.id} className={c.id === result.id ? "cur" : ""} onClick={() => run(c.title)}>
                      <td className="cn">{c.title}{c.id === result.id && <span className="curtag">{lang === "en" ? "now" : "현재"}</span>}</td>
                      <td><span className="acrisk" style={{ color: RISK[c.risk][1], background: RISK[c.risk][2] }}>{riskLabel(c.risk)}</span></td>
                      <td>{c.tests[0] || "-"}</td>
                      <td>{c.relatedDepartments[0] || "-"}</td>
                    </tr>
                  ))}</tbody>
                </table></div>
                <div className="adinsnote">{lang === "en" ? "Tap a row to open that condition." : "※ 행을 누르면 해당 질환 상담으로 이동합니다."}</div>
              </div>
            )}

            {/* 멀티턴 follow-up — 증상 추가 → 재분류 */}
            {result.emergency.length > 0 && (
              <div className="adcard adfollow">
                <div className="adt2"><MessageSquare size={16} color="#EA580C" /> {lang === "en" ? "Add a symptom to re-check risk" : "증상을 더 알려주시면 위험도를 다시 분류해요"}</div>
                <div className="adfchips">{result.emergency.slice(0, 4).map((s, i) => <button key={i} onClick={() => run(`${result.title} ${s}`)}><Plus size={13} /> {s.replace(/\s*→.*$/, "")}</button>)}</div>
                <div className="adinsnote">{lang === "en" ? "If a chosen sign is an emergency, it switches to a 119 alert." : "선택한 증상이 응급 신호면 즉시 119 안내로 전환됩니다."}</div>
              </div>
            )}

            {/* 보험 보장 검토 */}
            <div className="adcard adins">
              <div className="adt2"><ShieldCheck size={16} color="#2F5BEA" /> {T.insTitle}</div>
              <div className="adinsg">{result.ins.map((tag) => { const m = INS_META[tag]; if (!m) return null; const Ic = m[0]; return (
                <div className="adinsc" key={tag}><div className="ah" style={{ color: m[1] }}><span style={{ background: m[2] }}><Ic size={16} /></span>{m[3]}</div><ul>{m[4].map((x, i) => <li key={i}>{x}</li>)}</ul></div>
              ); })}</div>
              <div className="adinsnote">※ 보장 가능 여부·보험금 지급은 보험사 인수·심사 결과에 따르며, 본 안내로 단정하지 않습니다.</div>
              <div className="adcta">
                <button className="cbtn pri" style={{ margin: 0 }} onClick={() => nav("insurance")}><Search size={14} /> 내 건강위험 기반 보험 보장 분석하기</button>
                <button className="cbtn" style={{ margin: 0 }} onClick={() => openConsult("내 몸 맞춤 프리미엄보험")}><Sparkles size={14} /> 내몸맞춤 프리미엄보험 추천받기</button>
                <button className="cbtn" style={{ margin: 0 }} onClick={() => nav("wallet")}><Wallet size={14} /> 건강지갑으로 보험료 부담 줄이기</button>
                <button className="cbtn" style={{ margin: 0 }} onClick={() => openConsult("건강·보험 종합 상담")}><MessageSquare size={14} /> 상담사와 연결하기</button>
              </div>
            </div>

            {/* 건강지갑 보험료 시뮬레이션 */}
            {grossPremium > 0 && (
              <div className="adcard adsim">
                <div className="adt2"><Wallet size={16} color="#16A34A" /> {lang === "en" ? "Health Wallet premium simulation" : "건강지갑 보험료 시뮬레이션"}</div>
                <div className="simrow"><span>{lang === "en" ? "Est. monthly premium" : "예상 월 보험료"}</span><b>{krw(grossPremium)}</b></div>
                {lifeDiscount > 0 && <div className="simrow disc"><span>{lang === "en" ? "Lifestyle-care discount" : "생활관리 절감"}</span><b>−{krw(lifeDiscount)}</b></div>}
                <div className="simrow disc"><span>{lang === "en" ? "Wallet earned this month" : "건강지갑 이번 달 적립 지원"}</span><b>−{krw(walletSupport)}</b></div>
                <div className="simrow net"><span>{lang === "en" ? "Your net premium" : "실 부담 보험료"}</span><b>{krw(netPremium)}</b></div>
                <div className="simbar"><span style={{ width: coverRate + "%" }} /></div>
                <div className="simnote">{lang === "en" ? `Health assets cover about ${coverRate}% of your premium. You hold ${wTotal.toLocaleString("ko-KR")} HTK.` : `건강지갑·생활관리로 보험료의 약 ${coverRate}%를 충당합니다. 누적 건강자산 ${wTotal.toLocaleString("ko-KR")} HTK 보유.`}</div>
                <div className="adcta">
                  <button className="cbtn pri" style={{ margin: 0 }} onClick={() => nav("wallet")}><Wallet size={14} /> {lang === "en" ? "Open Health Wallet" : "건강지갑에서 적립 늘리기"}</button>
                  <button className="cbtn" style={{ margin: 0 }} onClick={() => openConsult("내 몸 맞춤 프리미엄보험")}><Sparkles size={14} /> {lang === "en" ? "Get a tailored quote" : "맞춤 보험료 상담받기"}</button>
                </div>
                <div className="adinsnote">{lang === "en" ? "Demo estimate; actual premium/earning depends on insurer underwriting & terms." : "※ 예시 추정치입니다. 실제 보험료·적립·지원액은 보험사 인수·심사 및 약관에 따릅니다."}</div>
              </div>
            )}

            {/* 출처 */}
            <div className="adsource"><div className="ah"><BookOpen size={14} /> {T.source}</div><p>{citeText(result)}</p><p className="lic">라이선스: {HC_LIC}</p></div>

            <div className="adlinks">
              <div className="alh"><ChevronRight size={14} /> 상담 결과 바로 연결</div>
              <div className="alb">
                <button onClick={() => linkToSection("checkup", result.title)}><CalendarCheck size={14} /> 관련 검진 예약</button>
                <button onClick={() => linkToSection("hospital", result.title, result.relatedDepartments[0])}><Building2 size={14} /> {result.relatedDepartments[0] || "관련"} 병원 찾기</button>
                <button onClick={() => nav("manage")}><Activity size={14} /> 내 건강 리포트</button>
              </div>
            </div>

            {matches.length > 1 && (<>
              <div className="aidrech" style={{ marginTop: 16 }}>{T.related}</div>
              <div className="aidrel">{matches.slice(1, 5).map((c) => <button key={c.id} onClick={() => run(c.title)}><b>{c.title}</b><span>{c.summary}</span></button>)}</div>
            </>)}
          </>) : (
            <div className="aidnone"><Search size={26} color="#B8C2D6" /><div><b>{T.none}</b><p>{T.noneSub}</p></div></div>
          )}
          <div className="aidreset"><button onClick={() => { setSubmitted(false); setResult(null); setPersonal(null); setOntoTxt(null); setCaseData(null); setQ(""); setFilter(null); }}><ArrowLeft size={14} /> {T.reset}</button></div>
        </div>
      )}

      {/* 상담 기록(세션 로그) */}
      <div className="aidlog">
        <button className="aidlogtog" onClick={() => setShowLog((v) => !v)}><FileText size={14} /> 내 상담 기록 {AI_SESSIONS.length}건 {showLog ? "접기 ▲" : "보기 ▼"}</button>
        {showLog && (
          <div className="aidlogbody">
            {AI_SESSIONS.length === 0 ? <div className="aidlogempty">아직 상담 기록이 없습니다. 위에서 검색해 보세요.</div> :
              AI_SESSIONS.slice(-5).reverse().map((s) => { const ri = RISK.findIndex((r) => r[0] === s.risk_level); const ins = INS_REC_LOGS.find((x) => x.session_id === s.id); return (
                <div className="aidlogrow" key={s.id}>
                  <div className="ll"><span className="lq">“{s.question}”</span><span className="lrisk" style={{ color: RISK[ri < 0 ? 0 : ri][1], background: RISK[ri < 0 ? 0 : ri][2] }}>{s.risk_level}</span></div>
                  <div className="lm">권장: {s.recommended_action} · 참조: {s.referenced_content_ids.join(", ") || "-"}{ins && ins.recommended_coverages.length ? " · 보장: " + ins.recommended_coverages.join(", ") : ""}</div>
                </div>
              ); })}
            <div className="aidlognote">※ 예시용 메모리 기록입니다. 실서비스에서는 <b>ai_doctor_sessions</b>·<b>insurance_recommendation_logs</b> 테이블에 개인정보보호 기준으로 분리·암호화 저장됩니다.</div>
          </div>
        )}
      </div>

      {/* 법적 고지 */}
      <div className="aiddisc"><AlertTriangle size={14} /> 본 서비스는 건강정보 제공 및 상담 보조 서비스이며, 의사의 진단·처방·치료를 대체하지 않습니다. 증상이 지속되거나 악화되는 경우 반드시 의료기관을 방문하시기 바랍니다. 응급 증상(가슴통증·호흡곤란·의식저하·마비·심한 출혈 등) 시 즉시 119 또는 가까운 응급실을 이용하세요.</div>
    </div>
  );
}
function HelpDot() { return <span className="hdq">Q</span>; }

function KCard({ card, onBtn }) {

}

function BioTrendChart() {
  const years = ["2021.12", "2022.12", "2023.12", "2024.12"];
  const reg = [51.1, 52.1, 53.1, 54.1];
  const bio = [51.4, 51.9, 52.4, 52.5];
  const W = 540, H = 196, padX = 34, padTop = 16, padBot = 30, min = 50.5, max = 55;
  const x = (i) => padX + i * (W - padX * 2) / (years.length - 1);
  const y = (v) => padTop + (max - v) / (max - min) * (H - padTop - padBot);
  const path = (arr) => arr.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
      {[51, 52, 53, 54, 55].map((g) => (<g key={g}><line x1={padX} x2={W - padX} y1={y(g)} y2={y(g)} stroke="#EEF1F8" /><text x={padX - 8} y={y(g) + 3} textAnchor="end" fontSize="9" fill="#9AA6BC">{g}</text></g>))}
      <path d={path(reg)} fill="none" stroke="#94A3B8" strokeWidth="2" strokeDasharray="4 4" />
      <path d={path(bio)} fill="none" stroke="#2F5BEA" strokeWidth="2.5" strokeLinecap="round" />
      {reg.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r="3" fill="#94A3B8" />)}
      {bio.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r={i === bio.length - 1 ? 5 : 3.5} fill="#fff" stroke="#2F5BEA" strokeWidth="2.5" />)}
      {bio.map((v, i) => <text key={i} x={x(i)} y={y(v) - 9} textAnchor="middle" fontSize="10" fontWeight="700" fill="#1E40C8">{v}</text>)}
      {years.map((yr, i) => <text key={i} x={x(i)} y={H - 10} textAnchor="middle" fontSize="9.5" fill="#9AA6BC">{yr}</text>)}
    </svg>
  );
}

/* ====================== 병원/약국예약 (심평원 공공데이터 연동) ====================== */
let _hiraPromise = null;
function loadHira() {
  if (!_hiraPromise) {
    _hiraPromise = fetch("./src/data/hira.json").then((r) => {
      if (!r.ok) throw new Error("데이터 로드 실패 (" + r.status + ")");
      return r.json();
    });
  }
  return _hiraPromise;
}
function useHira() {
  const [state, setState] = useState({ loading: true, error: null, data: null });
  useEffect(() => {
    let on = true;
    loadHira().then((d) => on && setState({ loading: false, error: null, data: d }))
      .catch((e) => on && setState({ loading: false, error: e.message, data: null }));
    return () => { on = false; };
  }, []);
  return state;
}
const SIDO_ORDER = ["서울", "경기", "인천", "부산", "대구", "대전", "광주", "울산", "세종시", "강원", "충북", "충남", "전북", "전남", "경북", "경남", "제주"];
const TYPE_PRIORITY = ["상급종합", "종합병원", "병원", "요양병원", "한방병원", "치과병원", "의원", "한의원", "치과의원", "정신병원", "조산원", "보건의료원", "보건소", "보건지소", "보건진료소"];
const tpri = (t) => { const i = TYPE_PRIORITY.indexOf(t); return i < 0 ? 99 : i; };
const mapsHref = (q) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const MAP_CAP = 1000;
const escHtml = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 약국 운영정보(예시·추정): 심평원 기본데이터엔 운영시간이 없어 약국명 기반 결정적 해시로 생성.
function pharmOps(name, sgg) {
  let h = 0; const s = (name || "") + (sgg || "");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const night = h % 7 === 0;
  const holiday = h % 4 === 0;
  const open = ["08:30", "09:00", "09:30"][h % 3];
  const close = night ? "24:00" : ["18:00", "18:30", "19:00", "20:00"][(h >> 3) % 4];
  const sat = (h >> 5) % 3 === 0 ? "토 휴무" : "토 09:00~13:00";
  return { night, holiday, weekday: `${open}~${close}`, sat };
}

// 외부 링크는 실제 배포 도메인에서만 노출(미리보기 localhost는 외부 이동을 차단하므로 숨김).
const EXTERNAL_OK = typeof location !== "undefined" && !/^(localhost|127\.0\.0\.1)$/i.test(location.hostname);
const directionsHref = (lat, lng) => `https://www.openstreetmap.org/directions?to=${lat}%2C${lng}`;
const normUrl = (u) => { if (!u) return ""; const s = String(u).trim(); return /^https?:\/\//i.test(s) ? s : "http://" + s; };
// 심평원 등록 홈페이지 중 'http://'만 있거나 도메인이 없는 쓰레기값 제외.
const validHomepage = (u) => { if (!u) return false; const s = String(u).trim().replace(/^https?:\/\//i, ""); return /[.][a-z가-힣]{2,}/i.test(s); };
// 공식 홈페이지가 없는 병원도 정보를 참고할 수 있는 네이버 검색 링크(병원마다 생성).
const naverHref = (name, region) => `https://search.naver.com/search.naver?query=${encodeURIComponent((name + " " + (region || "")).trim())}`;
const popupLink = (lat, lng) => EXTERNAL_OK ? `<br><a href="${directionsHref(lat, lng)}" target="_blank" rel="noreferrer" style="color:#2563EB;font-weight:700">길찾기(새 창) ›</a>` : "";

// Leaflet(OpenStreetMap) 지도 — window.L (UMD)로 로드, 마커클러스터 있으면 사용.
function MapView({ points, accent, focus, height }) {
  const ref = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const valid = React.useMemo(() => (points || []).filter((p) => p.lat && p.lng).slice(0, MAP_CAP), [points]);
  useEffect(() => {
    const L = window.L;
    if (!L || !ref.current) return;
    if (!mapRef.current) {
      mapRef.current = L.map(ref.current, { scrollWheelZoom: false }).setView([36.5, 127.8], 7);
      mapRef.current.attributionControl.setPrefix(false);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(mapRef.current);
    }
    const map = mapRef.current;
    if (layerRef.current) { map.removeLayer(layerRef.current); layerRef.current = null; }
    const group = L.markerClusterGroup ? L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 }) : L.layerGroup();
    const bounds = [];
    valid.forEach((p) => {
      const m = L.marker([p.lat, p.lng]);
      m.bindPopup(`<div style="font-size:12.5px;line-height:1.5;min-width:150px"><b>${escHtml(p.name)}</b>${p.tag ? ` <span style="color:${accent || "#2563EB"};font-weight:700">· ${escHtml(p.tag)}</span>` : ""}<br>${escHtml(p.addr)}${p.tel ? `<br>☎ ${escHtml(p.tel)}` : ""}${popupLink(p.lat, p.lng)}</div>`);
      group.addLayer(m); bounds.push([p.lat, p.lng]);
    });
    group.addTo(map); layerRef.current = group;
    if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
    const t = setTimeout(() => map.invalidateSize(), 60);
    return () => clearTimeout(t);
  }, [valid, accent]);
  // 특정 위치로 포커스(카드의 '지도에서 보기' 클릭 시) — 외부 이동 없이 앱 내부 지도에서 처리.
  useEffect(() => {
    const L = window.L;
    if (!L || !mapRef.current || !focus || !focus.lat || !focus.lng) return;
    const map = mapRef.current;
    map.invalidateSize();
    map.setView([focus.lat, focus.lng], 16, { animate: true });
    L.popup({ offset: [0, -4] }).setLatLng([focus.lat, focus.lng])
      .setContent(`<div style="font-size:12.5px;line-height:1.5"><b>${escHtml(focus.name)}</b>${focus.addr ? `<br>${escHtml(focus.addr)}` : ""}${popupLink(focus.lat, focus.lng)}</div>`).openOn(map);
  }, [focus]);
  useEffect(() => () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } }, []);
  if (!window.L) return <div className="hload" style={{ marginTop: 0 }}>지도를 불러오지 못했습니다. (인터넷 연결·Leaflet 로드 확인)</div>;
  const noCoord = (points || []).length > 0 && valid.length === 0;
  return (
    <div>
      <div ref={ref} style={{ height: height || 360, borderRadius: 14, overflow: "hidden", border: "1px solid var(--border)" }} />
      <div style={{ fontSize: 11, color: "var(--soft)", marginTop: 6 }}>{noCoord ? "좌표 정보가 없어 위치를 표시할 수 없습니다." : "지도 © OpenStreetMap 기여자 · 좌표 출처: 심평원 공공데이터"}{points && points.length > MAP_CAP ? ` · 표시 ${MAP_CAP.toLocaleString()}/${points.length.toLocaleString()}곳(상위)` : ""}</div>
    </div>
  );
}

}

function HospitalRec({ data, onGo }) {
  const [region, setRegion] = useState(PT.sido);
  const [detail, setDetail] = useState(null);
  const [sel, setSel] = useState(null);
  const atHome = region === PT.sido;

  const RECO = [
    { dept: "내과", ic: Stethoscope, col: "#7C3AED", bg: "#F1ECFE", why: "췌장암 경고 · 간 54.4세 · 당뇨 위험 ↑ — 복부초음파·위/대장 내시경·혈당 관리" },
    { dept: "영상의학과", ic: Activity, col: "#2563EB", bg: "#E8F1FE", why: "췌장·간 정밀영상 — 복부 초음파·CT 추적관찰" },
    { dept: "가정의학과", ic: HeartPulse, col: "#F59E0B", bg: "#FEF3E2", why: "만성질환·생활습관 통합관리 — 금연·절주·체중·대사" },
  ];
  const recoIdx = React.useMemo(() => RECO.map((r) => data.dept.indexOf(r.dept)).filter((i) => i >= 0), [data]);
  const recoSet = React.useMemo(() => new Set(recoIdx), [recoIdx]);

  const { partners, byGu, regionCount, distribution } = React.useMemo(() => {
    const sidoIdx = data.sido.indexOf(region);
    const matched = [];
    const dist = {};
    for (const h of data.hospitals) {
      let score = 0; for (const di of recoIdx) if (h[7].indexOf(di) >= 0) score++;
      if (score === 0) continue;
      dist[data.sido[h[2]]] = (dist[data.sido[h[2]]] || 0) + 1;
      if (h[2] !== sidoIdx) continue;
      matched.push({ h, score, partner: isPartner(h[0]) });
    }
    matched.sort((a, b) => (b.partner - a.partner) || (b.score - a.score) || (tpri(data.type[a.h[1]]) - tpri(data.type[b.h[1]])) || a.h[0].localeCompare(b.h[0], "ko"));
    const partners = matched.filter((m) => m.partner);
    const general = matched.filter((m) => !m.partner);
    const guMap = {};
    for (const m of general) (guMap[m.h[3]] || (guMap[m.h[3]] = [])).push(m);
    let byGu = Object.keys(guMap).map((gu) => ({ gu, items: guMap[gu], home: region === PT.sido && gu === PT.sigungu })).sort((a, b) => b.items.length - a.items.length);
    // 회원 거주 동네(은평구)를 맨 앞으로
    if (region === PT.sido) {
      const hi = byGu.findIndex((g) => g.home);
      if (hi > 0) { const home = byGu.splice(hi, 1)[0]; byGu.unshift(home); }
    }
    return { partners, byGu, regionCount: matched.length, distribution: dist };
  }, [data, region, recoIdx]);

  const sidoChips = React.useMemo(() => [...data.sido].sort((a, b) => SIDO_ORDER.indexOf(a) - SIDO_ORDER.indexOf(b)), [data]);
  const onBook = (h) => setSel(h);
  const onDetail = (h) => setDetail(h);

  return (<>
    <div className="airec">
      <div className="at"><Sparkles size={16} color="#7C3AED" /> 조성래님 맞춤 병원 추천</div>
      <div className="ap">프롬에이지 Premium 리포트(생체나이 52.5세 · <b>췌장암 경고</b> · 간 54.4세 · 당뇨 위험 ↑)를 분석해, 진료가 필요한 과목을 모두 갖춘 병원을 거주 지역에서 찾아드려요.</div>
    </div>
    <div className="card">
      <div className="rct"><Stethoscope size={18} color="#7C3AED" /> 건강상태 기반 권장 진료과</div>
      {RECO.map((r, i) => (
        <div className="adv" key={i}><span className="ic" style={{ background: r.bg }}><r.ic size={18} color={r.col} /></span>
          <div style={{ flex: 1 }}><b>{r.dept}</b><p>{r.why}</p></div>
          <button onClick={() => onGo({ sido: region, dept: r.dept })} style={{ alignSelf: "center", border: "1px solid var(--border)", background: "#fff", color: "var(--blue)", borderRadius: 9, padding: "7px 11px", fontWeight: 700, fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" }}>{r.dept} ›</button></div>
      ))}

let _homecarePromise = null;

function loadHomecare() {
  if (!_homecarePromise) {
    _homecarePromise = fetch("./src/data/homecare.json").then((r) => { if (!r.ok) throw new Error("데이터 로드 실패 (" + r.status + ")"); return r.json(); });
  }
  return _homecarePromise;
}
function useHomecare() {
  const [state, setState] = useState({ loading: true, error: null, data: null });
  useEffect(() => { let on = true; loadHomecare().then((d) => on && setState({ loading: false, error: null, data: d })).catch((e) => on && setState({ loading: false, error: e.message, data: null })); return () => { on = false; }; }, []);
  return state;
}

function HomecareDirectory({ data }) {
  const [sido, setSido] = useState(PT.sido);
  const [sgg, setSgg] = useState(PT.sigungu);
  const [svc, setSvc] = useState("전체");
  const [q, setQ] = useState("");
  const [shown, setShown] = useState(20);
  const [sel, setSel] = useState(null);
  const [detail, setDetail] = useState(null);
  const [mapOpen, setMapOpen] = useState(false);
  const [focus, setFocus] = useState(null);
  const mapAnchor = useRef(null);
  const reset = () => setShown(20);
  const showOnMap = (p) => { setMapOpen(true); setFocus({ lat: p[7], lng: p[6], name: p[0], addr: p[3], n: Date.now() }); setTimeout(() => mapAnchor.current && mapAnchor.current.scrollIntoView({ behavior: "smooth", block: "start" }), 90); };

  const { sggBySido, countBySido } = React.useMemo(() => {
    const m = {}, c = {};
    for (const p of data.providers) { const s = data.sido[p[1]]; c[s] = (c[s] || 0) + 1; (m[s] || (m[s] = new Set())).add(p[2]); }
    return { sggBySido: m, countBySido: c };
  }, [data]);
  const sidoChips = React.useMemo(() => ["전체", ...[...data.sido].sort((a, b) => SIDO_ORDER.indexOf(a) - SIDO_ORDER.indexOf(b))], [data]);
  const sggOptions = React.useMemo(() => sido === "전체" ? [] : [...(sggBySido[sido] || [])].sort((a, b) => a.localeCompare(b, "ko")), [sido, sggBySido]);

  const list = React.useMemo(() => {
    const sidoIdx = sido === "전체" ? -1 : data.sido.indexOf(sido);
    const svcIdx = svc === "전체" ? -1 : data.svc.indexOf(svc);
    const qq = q.trim();
    return data.providers.filter((p) =>
      (sidoIdx < 0 || p[1] === sidoIdx) &&
      (sgg === "전체" || p[2] === sgg) &&
      (svcIdx < 0 || p[5].indexOf(svcIdx) >= 0) &&
      (!qq || p[0].indexOf(qq) >= 0 || p[3].indexOf(qq) >= 0));
  }, [data, sido, sgg, svc, q]);
  const view = list.slice(0, shown);

  return (
    <>
      <SpecialPartner data={data} />
      <div className="card" style={{ marginBottom: 14 }}>
        <div className="rct"><HeartHandshake size={18} color="#E11D8F" /> 재가급여 6종 안내</div>
        <div className="canc6">{["방문요양", "방문목욕", "방문간호", "주야간보호", "단기보호", "복지용구"].map((s) => { const M = svcMeta(s); return (<div className="cc6" key={s} title={M.d}><span className="ic" style={{ background: M.bg }}><Art name={M.art} size={24} /></span>{s}</div>); })}</div>
        <div className="chnote" style={{ marginTop: 10 }}>※ 장기요양 <b>등급(1~5등급·인지지원)</b> 판정자는 재가급여를 이용할 수 있으며, 본인부담 15%(감경 대상 6~9%)로 이용합니다. 등급이 없으면 공단에 등급 신청 후 이용 가능합니다.</div>
      </div>
      <GovPartnership mode="homecare" />
      <div className="benefit">
        <span><Art name="search" size={16} /> 전국 재가기관 {data.meta.count.toLocaleString()}곳</span>
        <span><Art name="pin" size={16} /> 우리 동네 방문요양 찾기</span>
        <span><Art name="visit" size={16} /> 급여종류별 검색</span>
        <span><Art name="chat" size={16} /> 상담 신청</span>
      </div>
      <MapCard anchorRef={mapAnchor} open={mapOpen} onToggle={() => setMapOpen((v) => !v)} focus={focus} title={`재가기관 위치 지도 (${(sido === "전체" ? "전국" : sido) + (sgg !== "전체" ? " " + sgg : "")} ${list.length.toLocaleString()}곳)`} accent="#E11D8F" points={list.map((p) => ({ name: p[0], addr: p[3], tel: p[4], tag: "재가", lat: p[7], lng: p[6] }))} />
      <div className="bklbl" style={{ margin: "0 0 8px" }}><CircleUserRound size={13} style={{ verticalAlign: "-2px" }} /> 회원 거주지 <b style={{ color: "#2563EB" }}>{PT.addr}</b> 기준 · 지역 선택</div>
      <div className="regions">{sidoChips.map((r) => <div key={r} className={`fsel ${sido === r ? "on" : ""}`} onClick={() => { setSido(r); setSgg("전체"); reset(); }}>{r === PT.sido && <Home size={11} style={{ verticalAlign: "-1px", marginRight: 3 }} />}{r}{r !== "전체" && countBySido[r] ? <span style={{ color: "var(--soft)", fontWeight: 600, marginLeft: 4 }}>{countBySido[r].toLocaleString()}</span> : ""}</div>)}</div>
      <div className="bklbl" style={{ margin: "2px 0 8px" }}>급여종류</div>
      <div className="regions">
        <div className={`fsel ${svc === "전체" ? "on" : ""}`} onClick={() => { setSvc("전체"); reset(); }}>전체</div>
        {data.svc.map((s) => { const M = svcMeta(s); return <div key={s} className={`fsel ${svc === s ? "on" : ""}`} onClick={() => { setSvc(s); reset(); }}><span style={{ display: "inline-flex", verticalAlign: "-3px", marginRight: 3 }}><Art name={M.art} size={14} /></span>{s}</div>; })}
      </div>
      <div className="hfilt" style={{ gridTemplateColumns: "1fr 1fr" }}>
        <select value={sgg} onChange={(e) => { setSgg(e.target.value); reset(); }} disabled={sido === "전체"}>
          <option value="전체">{sido === "전체" ? "시·도 먼저 선택" : "시·군·구 전체"}</option>
          {sggOptions.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        <div className="fsearch" style={{ margin: 0 }}><Search size={15} /><input value={q} onChange={(e) => { setQ(e.target.value); reset(); }} placeholder="기관명·주소 검색" /></div>
      </div>
      <div className="chcount">{sido === "전체" ? "전국" : sido}{sgg !== "전체" ? " " + sgg : ""}{svc !== "전체" ? " · " + svc : ""} 재가기관 <b style={{ color: "var(--blue)" }}>{list.length.toLocaleString()}</b>곳</div>
      {view.map((p, i) => (
        <div className="center" key={i}>
          <div className="cimg" style={{ background: "linear-gradient(150deg,#FCE7F3,#F3E8FF)" }}><Art name="visit" size={46} /></div>
          <div className="cmain" style={{ cursor: "pointer" }} onClick={() => setDetail(p)} title="기관 상세 보기">
            <div className="cname">{p[0]}<span className="cbadge" style={{ color: "#9D174D", background: "#FCE7F3" }}>재가</span></div>
            <div className="cmeta"><span style={{ fontWeight: 800, color: "#2563EB" }}>{data.sido[p[1]]} {p[2]}</span> · <MapPin size={12} />{p[3]}</div>
            <div className="hdept">{p[5].map((si) => { const s = data.svc[si]; const M = svcMeta(s); return <span key={si} style={{ background: M.bg, color: M.col }}>{s}</span>; })}</div>
          </div>
          <div className="cright">
            <div className="obtns"><button onClick={() => setDetail(p)}>상세</button><button className="book" onClick={() => setSel(p)}>상담신청</button></div>
            <button className="book" style={{ background: "#fff", color: "#2563EB", border: "1px solid var(--border)", display: "inline-flex", alignItems: "center", gap: 5 }} disabled={!(p[6] && p[7])} onClick={() => showOnMap(p)}><MapPin size={13} /> 지도</button>
          </div>
        </div>
      ))}
      {view.length === 0 && <div className="hload" style={{ marginTop: 8 }}>조건에 맞는 재가기관이 없습니다. 지역·급여종류를 조정해 보세요.</div>}
      {shown < list.length && <button className="cbtn" onClick={() => setShown((x) => x + 20)}>더 보기 ({(list.length - shown).toLocaleString()}곳 더)</button>}
      <div className="chnote">※ <b>현재 표시되는 재가기관은 예시 데이터(시연용)</b>입니다. 실제 전국 데이터는 국민건강보험공단 ‘장기요양기관 현황’(공공데이터포털) 파일 입수 시 동일 화면에 교체 반영됩니다. 본인부담·급여 한도는 등급·소득에 따라 다릅니다.</div>
      {sel && <HomecareBookingModal data={data} p={sel} onClose={() => setSel(null)} />}
      {detail && <HomecareDetailModal data={data} p={detail} onClose={() => setDetail(null)} onApply={(x) => { setDetail(null); setSel(x); }} />}
    </>
  );
}

function HomecareBookingModal({ data, p, onClose }) {
  const svcs = (p[5] || []).map((si) => data.svc[si]);
  const [pick, setPick] = useState(svcs[0] || "방문요양");
  const [done, setDone] = useState(false);
  const W = ["일", "월", "화", "수", "목", "금", "토"];
  const days = Array.from({ length: 8 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() + i + 2); return d; });
  const [date, setDate] = useState(null);
  return (
    <div className="bkov" onClick={onClose}>
      <div className="bk" onClick={(e) => e.stopPropagation()}>
        <div className="bkh"><div className="bt">{done ? "상담 신청 완료" : "재가/돌봄서비스 상담 신청"}</div><button style={{ background: "none", border: "none", cursor: "pointer" }} onClick={onClose}><X size={20} color="#8A97AE" /></button></div>
        <div className="bkb">
          {!done ? (<>
            <div style={{ background: "#F7F9FC", border: "1px solid var(--border)", borderRadius: 12, padding: "12px 14px" }}>
              <div style={{ fontWeight: 800, fontSize: 14 }}>{p[0]} <span className="cbadge" style={{ color: "#9D174D", background: "#FCE7F3" }}>재가</span></div>
              <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 3 }}><MapPin size={11} style={{ verticalAlign: "-1px" }} /> {data.sido[p[1]]} {p[2]} · {p[3]}</div>
              <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 4 }}>신청자: <b style={{ color: "var(--text)" }}>{PT.name}</b> · {PT.sexAge}</div>
            </div>
            <div className="bklbl">희망 급여종류</div>
            <div className="ctags">{svcs.map((s) => <span key={s} onClick={() => setPick(s)} style={{ cursor: "pointer", background: pick === s ? "#EAF0FE" : undefined, borderColor: pick === s ? "#BFD0FF" : undefined, color: pick === s ? "#2563EB" : undefined, fontWeight: pick === s ? 800 : 600 }}>{s}</span>)}</div>
            <div className="bklbl">상담 희망일</div>
            <div className="cal">{days.map((d, i) => { const k = `${d.getMonth() + 1}/${d.getDate()}`; return (<div key={i} className={`calc ${date === k ? "on" : ""}`} onClick={() => setDate(k)}><div className="d">{d.getDate()}</div><div className="w">{W[d.getDay()]}</div></div>); })}</div>

              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 16, textAlign: "left" }}>
                <div className="resitem" style={{ margin: 0 }}><span className="ic" style={{ background: "#E7F8EE" }}><ShieldCheck size={18} color="#16A34A" /></span><div><b style={{ fontSize: 13 }}>장기요양 등급 확인</b><div style={{ fontSize: 11.5, color: "var(--muted)" }}>등급 보유 여부를 확인해 본인부담·이용 가능 급여를 안내합니다.</div></div></div>
                <div className="resitem" style={{ margin: 0 }}><span className="ic"><MessageSquare size={18} color="#7C3AED" /></span><div><b style={{ fontSize: 13 }}>담당자 연결</b><div style={{ fontSize: 11.5, color: "var(--muted)" }}>기관 담당자가 연락처로 상담을 진행합니다.</div></div></div>
              </div>
              <button className="cbtn pri" style={{ marginTop: 16 }} onClick={onClose}>확인</button>
            </div>
          )}

    </div>
  );
}

/* ── 브랜드 취급 약국 찾기 (파일럿) ──
   심평원 공공데이터엔 약국별 취급 품목이 없어, 시·군·구별로 지역 규모의 30%(최대 50곳)를
   (브랜드+약국명) 결정적 해시 순위로 선정 → 새로고침해도 결과가 안정적. 실데이터는 유통사·약국 재고 API 연동 시 대체. */
function pnHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h >>> 0;
}
function BrandPharmacyModal({ brand, label, onClose }) {
  const { loading, error, data } = useHira();
  const [sido, setSido] = useState("전체");
  const [sgg, setSgg] = useState("전체");
  const [q, setQ] = useState("");
  const [shown, setShown] = useState(12);
  const reset = () => setShown(12);
  // 시·군·구별 취급 약국 선정: 지역 약국 수의 30%(최소 1, 최대 50곳)를 해시 순위로 결정적 선택
  const carry = React.useMemo(() => {
    const set = new Set();
    if (!data) return set;
    const byDist = {};
    for (let i = 0; i < data.pharmacies.length; i++) { const p = data.pharmacies[i]; const k = p[1] + "|" + p[2]; (byDist[k] || (byDist[k] = [])).push(i); }
    for (const k in byDist) {
      const idxs = byDist[k];
      const n = Math.min(50, Math.max(1, Math.round(idxs.length * 0.3)));
      if (idxs.length <= n) { for (const i of idxs) set.add(i); continue; }
      const ranked = idxs.map((i) => [i, pnHash(brand + "|" + data.pharmacies[i][0])]).sort((a, b) => a[1] - b[1]);
      for (let j = 0; j < n; j++) set.add(ranked[j][0]);
    }
    return set;
  }, [data, brand]);
  const { sggBySido, countBySido, total } = React.useMemo(() => {
    const m = {}, c = {};
    if (data) for (const i of carry) { const p = data.pharmacies[i]; const s = data.sido[p[1]]; c[s] = (c[s] || 0) + 1; (m[s] || (m[s] = new Set())).add(p[2]); }
    return { sggBySido: m, countBySido: c, total: carry.size };
  }, [data, carry]);
  const sidoChips = React.useMemo(() => data ? ["전체", ...[...data.sido].sort((a, b) => SIDO_ORDER.indexOf(a) - SIDO_ORDER.indexOf(b))] : ["전체"], [data]);
  const sggOptions = React.useMemo(() => (data && sido !== "전체") ? [...(sggBySido[sido] || [])].sort((a, b) => a.localeCompare(b, "ko")) : [], [data, sido, sggBySido]);
  const list = React.useMemo(() => {
    if (!data) return [];
    const sidoIdx = sido === "전체" ? -1 : data.sido.indexOf(sido);
    const qq = q.trim();
    return data.pharmacies.filter((p, i) => carry.has(i) && (sidoIdx < 0 || p[1] === sidoIdx) && (sgg === "전체" || p[2] === sgg) && (!qq || p[0].indexOf(qq) >= 0 || p[3].indexOf(qq) >= 0));
  }, [data, carry, sido, sgg, q]);
  const view = list.slice(0, shown);
  return createPortal(

/* ── 보험사 로고: 로컬 공식 로고 → 로고 API → 파비콘 → 브랜드 컬러 폴백 ──
   data/logos/<slug>.(svg|png) 에 공식 로고 파일을 넣으면 그 로고가 1순위로 표시됩니다. */
function InsLogo({ n, c, domain, ab, slug }) {
  const exts = ["svg", "png", "jpg", "jpeg", "webp"];
  const SRCS = [
    ...(slug ? exts.map((e) => `./data/logos/${slug}.${e}`) : []),
    domain && `https://logo.clearbit.com/${domain}`,
    domain && `https://www.google.com/s2/favicons?domain=${domain}&sz=64`,
  ].filter(Boolean);
  const [i, setI] = useState(0);
  if (i >= SRCS.length) return <span className="lg" style={{ background: c }}>{ab}</span>;
  const isFav = SRCS[i].indexOf("s2/favicons") >= 0;
  return <img className={isFav ? "lgfav" : "lgimg"} src={SRCS[i]} alt={`${n} 로고`} loading="lazy" onError={() => setI((x) => x + 1)} />;
}

const FAM_REL = ["배우자", "자녀", "부모", "조부모", "형제"];
function famGroupOf(age, rel) {
  const a = Number(age) || 0;
  if (rel === "자녀" && a < 19) return "아동";
  if (rel === "부모" || rel === "조부모") return a && a < 65 ? "성인" : "노인";
  if (a > 0 && a < 19) return "아동";
  if (a >= 65) return "노인";
  return "성인";
}
function famGroupKey(g) { return g === "아동" ? "아동" : g === "노인" ? "노인" : g === "여성" ? "여성" : "만성질환"; }
function famFocus(g) { return (typeof GROUP_KB === "undefined") ? null : (GROUP_KB[famGroupKey(g)] || null); }
function famEarn(g) { return g === "아동" ? 400 : g === "노인" ? 650 : 520; }
function famCostEst(g) { return g === "아동" ? 60 : g === "노인" ? 420 : 180; }
function famGroupColor(g) { return g === "아동" ? "#F59E0B" : g === "노인" ? "#7C3AED" : "#2563EB"; }
function famTasks(g) {
  if (g === "아동") return ["예방접종(NIP) 일정 확인", "영유아·학생 건강검진", "시력·구강 검진", "스마트폰·당류 생활관리"];
  if (g === "노인") return ["노인 건강검진 예약", "복약 관리(다제약물)", "낙상 위험 점검", "인지선별검사", "폐렴구균·대상포진 접종"];
  if (g === "여성") return ["여성암 검진(유방·자궁경부)", "골밀도·갑상선 점검", "철분·칼슘 관리"];
  return ["국가 일반건강검진", "운동·식이 생활관리", "스트레스·수면 관리"];
}

const FAM_SPEND_OPTS = [{ item: "아동 예방접종비", amount: 300 }, { item: "부모님 검진비", amount: 1200 }, { item: "가족 복약·영양비", amount: 200 }];
function lsLoad(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function lsSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function familyLoad(email, surname) {
  const v = lsLoad("hifin_family_" + (email || "default"), null);
  if (v) return v;
  const s = surname || "가";
  return [{ id: "f1", name: s + "경희", relation: "배우자", age: 53 }, { id: "f2", name: s + "하준", relation: "자녀", age: 9 }, { id: "f3", name: s + "순자", relation: "부모", age: 76 }];
}
function familySave(email, list) { lsSave("hifin_family_" + (email || "default"), list); }
function famDemoList() { return (typeof demoMembers !== "undefined" && Array.isArray(demoMembers)) ? demoMembers : []; }
function famLinkedReport(linkEmail) {
  if (!linkEmail || typeof demoMembers === "undefined" || typeof demoReport !== "function") return null;
  const src = demoMembers.find((x) => x.email === linkEmail); if (!src) return null;
  const R = demoReport(src);
  return { bio: R.bio, diff: R.diff, cancerTotal: R.cancerTotal, tags: [...(src.highRiskCancerTypes || []), ...(src.highRiskDiseases || [])].slice(0, 3) };
}

    const rows = family.map((x) => { const g = famGroupOf(x.age, x.relation); const tks = famTasks(g); const dn = Object.values(taskMap[x.id] || {}).filter(Boolean).length; const f = famFocus(g); const cons = consentOf(x.id); return `<tr><td>${x.name} (${x.relation})</td><td>${x.age}세 · ${g}</td><td>${tks.length ? Math.round(dn / tks.length * 100) : 0}% (${dn}/${tks.length})</td><td>${cons ? "공유중" : "대기"}</td><td>${cons && f ? (f.screening || []).slice(0, 2).join(", ") : "-"}</td></tr>`; }).join("");

    const w = window.open("", "_blank", "width=760,height=900"); if (!w) { if (typeof toast === "function") toast("팝업이 차단되었습니다. 허용 후 다시 시도하세요."); return; } w.document.write(html); w.document.close(); setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 350);
  };

  return (
    <div className="famcare">
      <div className="famhead">
        <span className="famico"><Users size={18} color="#16A34A" /></span>
        <div style={{ flex: 1 }}><div className="famt">온가족 케어플랜</div><div className="famsub">가족 경제단위 · 공유지갑 · 보호자 관리 · DID · 계정연동</div></div>
        <button className="famrep" onClick={printFamilyReport}><FileText size={13} /> 가족 리포트</button>
      </div>

      <div className="famdash">
        <div className="fdh"><ClipboardList size={14} color="#2563EB" /> 세대주 대시보드 · 가족 통합 관리
          <button className={`fdauto ${autoAlert ? "on" : ""}`} onClick={toggleAuto}><Bell size={12} /> 자동 알림 {autoAlert ? "ON" : "OFF"}</button></div>
        <div className="fdgrid">
          <div className="fdc"><b>{openCare}</b><span>미완료 케어</span></div>
          <div className="fdc"><b>{noConsentN}</b><span>동의 필요</span></div>
          <div className="fdc"><b>{focusN}</b><span>집중관리(노·아)</span></div>
          <div className="fdc"><b>{linkedN}</b><span>데이터 연동</span></div>
        </div>
        {topAlerts.length > 0 ? (<div className="fdalerts">{topAlerts.map((a, i) => (
          <div className="fdalert" key={i}><span className="fdad" style={{ background: a.col }} /><div className="fdax"><b>{a.name}</b> {a.text}</div><button className="fdsend" onClick={() => sendAlert(a)} disabled={!autoAlert}><Bell size={12} /> 알림</button></div>
        ))}</div>) : (<div className="fdok"><Check size={14} color="#16A34A" /> 가족 케어가 모두 정상입니다.</div>)}
      </div>

      <div className="famwallet">
        <div className="fwl"><Coins size={14} /> 가족 공유 건강금융지갑</div>
        <div className="fwtot">{sharedAvail.toLocaleString()} <small>HTK</small></div>
        <div className="fwsub">≈ {(sharedAvail * 10).toLocaleString()}원 상당 · 가족 {headCount}명 통합 잔액</div>
        <div className="fwbreak"><span><b>{base.toLocaleString()}</b>세대주</span><span><b>+{totalEarn.toLocaleString()}</b>가족 적립</span><span><b>-{spentSum.toLocaleString()}</b>가족 사용</span></div>
        <div className="fwnote">가족 구성원의 건강활동·보호자 관리 적립이 하나의 지갑으로 모여, <b>아동 예방접종·검진비, 부모님 의료비·장기요양 본인부담</b>을 함께 결제합니다.</div>
        <button className="cbtn pri" style={{ margin: "10px 0 0", maxWidth: 260 }} onClick={() => go("wallet")}><Wallet size={14} /> 가족지갑 사용처 보기</button>
      </div>

      <div className="famstat">
        <div className="fst"><span className="fsv">{headCount}명</span><span className="fsl">가족 경제단위</span></div>
        <div className="fst"><span className="fsv">{kids}·{elders}</span><span className="fsl">아동·노인</span></div>
        <div className="fst"><span className="fsv">{totalEarn.toLocaleString()}</span><span className="fsl">건강활동 적립</span></div>
        <div className="fst"><span className="fsv">약 {costSum.toLocaleString()}만</span><span className="fsl">연 의료비 추정</span></div>
      </div>

      <div className="famrank">
        <div className="frh"><Sparkles size={14} color="#F59E0B" /> 가족 건강 랭킹 <span>· 보호자 케어 진행률</span></div>
        <div className="frlist">{ranking.map((x, i) => (
          <div className="frrow" key={x.id}><span className="frmedal">{["🥇", "🥈", "🥉"][i] || (i + 1)}</span><span className="frn">{x.name} <small>{x.g}</small></span><div className="frbar"><i style={{ width: x.pct + "%", background: famGroupColor(x.g) }} /></div><b className="frp">{x.pct}%</b></div>
        ))}</div>
        <div className="frh" style={{ marginTop: 13 }}><Coins size={14} color="#16A34A" /> 가족 건강 미션 <span>· 달성 시 가족지갑 적립</span></div>
        <div className="fmislist">{missions.map((ms, i) => { const done = ms.cur >= ms.max; const pc = Math.min(100, Math.round(ms.cur / ms.max * 100)); return (
          <div className={`fmis ${done ? "done" : ""}`} key={i}><div className="fmistop"><span>{done ? <Check size={13} color="#16A34A" /> : <span className="fmisb" />} {ms.t}</span><b>+{ms.reward}</b></div><div className="fmisbar"><i style={{ width: pc + "%" }} /></div><span className="fmisc">{ms.cur.toLocaleString()}/{ms.max.toLocaleString()}{done ? " · 달성!" : ""}</span></div>
        ); })}</div>
      </div>

      <div className="famlistlbl"><HeartHandshake size={14} color="#16A34A" /> 가족 구성원 맞춤 케어 <span>· 클릭하면 동의·연동·SOS·체크리스트가 펼쳐져요</span></div>
      <div className="famlist">
        {family.map((x) => (
          <FamilyMemberRow key={x.id} m={x} expanded={expanded === x.id} onToggle={() => setExpanded(expanded === x.id ? null : x.id)} onRemove={() => removeMember(x.id)}
            tasks={famTasks(famGroupOf(x.age, x.relation))} taskState={taskMap[x.id] || {}} onTask={(i) => toggleTask(x.id, i)}
            consent={consentOf(x.id)} onConsent={() => toggleConsent(x.id)} memberList={memberList} linkedEmail={linkMap[x.id] || ""} onLink={(le) => setLink(x.id, le)}
            sosActive={sosId === x.id} onSOS={() => setSosId(sosId === x.id ? null : x.id)} guardian={m.name} />
        ))}
      </div>

      {addOpen ? (
        <div className="famadd">
          <div className="faih"><Plus size={14} color="#2563EB" /> 가족 구성원 추가</div>
          <div className="faiin"><input placeholder="이름" value={fName} onChange={(e) => setFName(e.target.value)} /><select value={fRel} onChange={(e) => setFRel(e.target.value)}>{FAM_REL.map((r) => <option key={r} value={r}>{r}</option>)}</select><input placeholder="나이" type="number" value={fAge} onChange={(e) => setFAge(e.target.value)} style={{ maxWidth: 90 }} /><button className="csfgo" onClick={addMember}><Check size={13} /> 추가</button></div>
        </div>
      ) : (<button className="famaddbtn" onClick={() => setAddOpen(true)}><Plus size={15} /> 가족 구성원 추가</button>)}

      <div className="famspend">
        <div className="fsh"><Wallet size={14} color="#16A34A" /> 가족지갑 공동 결제 <span>· 구성원 의료비를 가족 적립으로 결제</span></div>
        <div className="fsopts">{FAM_SPEND_OPTS.map((o, i) => (<button key={i} className="fsopt" onClick={() => addSpendItem(o)} disabled={sharedAvail < o.amount}><Coins size={13} /> {o.item} <b>-{o.amount.toLocaleString()}</b></button>))}</div>
        {spend.length > 0 && (<div className="fslist">{spend.slice().reverse().map((s) => (<div className="fsrow" key={s.id}><span className="fsi">{s.item}</span><span className="fsa">-{s.amount.toLocaleString()} HTK</span><button onClick={() => removeSpend(s.id)} aria-label="취소"><X size={12} /></button></div>))}</div>)}
      </div>

      <div className="famdisc"><ShieldCheck size={13} /> 가족 구성원 정보·데이터 공유는 본인/보호자 DID 동의 하에 관리되며, 결제·적립·연동 수치는 예시입니다. 응급 SOS는 예시이며 실제 응급 시 119에 연락하세요.</div>
    </div>
  );
}

      <div className="skel-note"><Info size={15} /> 1단계 골격 — 전역 레이아웃·디자인이 적용된 빈 화면입니다. 모듈 콘텐츠는 2단계에서 구현됩니다.</div>
      <div className="mods">{(data?.mods || []).map(([Ic, t, d], i) => (
        <div className="mod" key={i}><div className="mh"><span className="mi" style={{ background: typeof Ic === "string" ? "#F4F6FC" : `${color}1A` }}>{typeof Ic === "string" ? <Art name={Ic} size={24} /> : <Ic size={20} color={color} />}</span><div className="mt">{t}</div></div>
          <div className="md">{d}</div><div className="sk" style={{ width: "100%" }} /><div className="sk" style={{ width: "85%" }} /><div className="sk" style={{ width: "60%" }} /><span className="pl"><Lock size={11} /> 구현 예정</span></div>))}</div>
      <div className="perso"><span className="ic"><Sparkles size={20} color="#2DD4BF" /></span><div><b>초개인화 원칙</b><p>이 섹션의 모든 기능은 회원님의 건강지갑 데이터에 연결되어 개인 맞춤으로 동작하도록 설계됩니다.</p></div></div>
    </div>
  );
}

/* ====================== 온톨로지 운영시스템 (팔란티어 Foundry 스타일) ======================
   1,000명 파일럿 코호트(pilotCohort)를 객체(Object)·관계(Link)·액션(Action) 온톨로지로 운영.
   개요(코호트 집계) · 객체 탐색기 · 온톨로지 관계 · 액션(세그먼트→보험/나눔/케어). */

const ontWon = (n) => n >= 100000000 ? (n / 100000000).toFixed(2) + "억원" : n >= 10000 ? Math.round(n / 10000).toLocaleString() + "만원" : Math.round(n).toLocaleString() + "원";
const ONT_DEPT_COLORS = ["#22D3EE", "#6366F1", "#F472B6", "#34D399", "#FBBF24", "#F87171", "#A78BFA", "#38BDF8", "#4ADE80", "#FB923C", "#2DD4BF", "#E879F9", "#60A5FA", "#FACC15", "#F43F5E", "#818CF8", "#10B981"];

function OntBar({ label, value, max, color, sub }) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return (
    <div className="ontbar">
      <div className="ontbar-l"><span className="ontbar-lbl">{label}</span><span className="ontbar-val">{value.toLocaleString()}{sub || ""}</span></div>
      <div className="ontbar-track"><i style={{ width: Math.max(2, pct) + "%", background: color || "#22D3EE" }} /></div>
    </div>
  );
}

/* ── 온톨로지 스키마(객체·관계) 다이어그램 ── */
function OntGraph({ agg }) {
  // 허브-스포크 배치: 회원(중심) 둘레에 6각형으로 헬스 객체, 하단에 소비→매출→성장 루프(재무·마케팅)
  const nodes = [
    { id: "member", t: "회원", n: agg.n, x: 260, y: 195, c: "#22D3EE" },
    { id: "disease", t: "질병", n: Object.keys(agg.byDisease).length, x: 260, y: 55, c: "#F472B6" },
    { id: "checkup", t: "건강검진", n: 13, x: 395, y: 128, c: "#34D399" },
    { id: "coverage", t: "보험담보", n: 0, x: 125, y: 128, c: "#A78BFA" },
    { id: "region", t: "지역", n: 17, x: 395, y: 262, c: "#38BDF8" },
    { id: "dept", t: "진료과목", n: Object.keys(agg.byDept).length, x: 125, y: 262, c: "#6366F1" },
    { id: "cost", t: "예상의료비", n: 0, x: 260, y: 335, c: "#FBBF24" },
    { id: "finance", t: "재무회계", n: 0, x: 165, y: 425, c: "#F59E0B" },
    { id: "marketing", t: "마케팅", n: 0, x: 355, y: 425, c: "#EC4899" },
  ];
  const N = Object.fromEntries(nodes.map((x) => [x.id, x]));
  const links = [
    ["member", "disease", "진단"], ["member", "checkup", "수검"], ["member", "dept", "진료"], ["member", "region", "거주"], ["member", "cost", "예상"],
    ["disease", "checkup", "지표"], ["disease", "coverage", "보장"],
    ["cost", "finance", "매출"], ["finance", "marketing", "분석"], ["marketing", "member", "타겟"],
  ];
  const loop = new Set(["매출", "분석", "타겟"]);
  return (
    <div className="ontgraph">
      <svg viewBox="0 0 520 480" style={{ width: "100%", height: "auto", display: "block" }}>
        {links.map(([a, b, lbl], i) => { const A = N[a], B = N[b], big = loop.has(lbl); return (<g key={i}><line x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={big ? "#3E4E6E" : "#2B3B57"} strokeWidth={big ? "1.8" : "1.4"} strokeDasharray={big ? "5 4" : "none"} /><text x={(A.x + B.x) / 2} y={(A.y + B.y) / 2 - 4} fill={big ? "#9AA9C6" : "#7C8BA8"} fontSize="9.5" fontWeight={big ? "700" : "400"} textAnchor="middle">{lbl}</text></g>); })}
        {nodes.map((nd) => (<g key={nd.id}>
          <circle cx={nd.x} cy={nd.y} r="28" fill="#0F1B33" stroke={nd.c} strokeWidth="2" />
          <text x={nd.x} y={nd.n > 0 ? nd.y - 3 : nd.y + 4} fill="#EAF2FF" fontSize="10.5" fontWeight="800" textAnchor="middle">{nd.t}</text>
          {nd.n > 0 && <text x={nd.x} y={nd.y + 11} fill={nd.c} fontSize="9" fontWeight="700" textAnchor="middle">{nd.n.toLocaleString()}</text>}
        </g>))}
      </svg>
      <div className="ontgraph-note">Object Types <b>9</b> · Links <b>10</b> · Objects <b>{agg.n.toLocaleString()}+</b> — 회원을 중심으로 진료과목·질병·검진·의료비·보험담보·지역이 연결되고, <b style={{ color: "#F59E0B" }}>예상의료비→재무회계</b>(매출) <b style={{ color: "#EC4899" }}>→마케팅→회원</b>(타겟)의 <b>소비→매출→성장 루프</b>로 순환합니다.</div>
    </div>
  );
}

/* ── 코호트 개요 ── */
const KCD_LABELS = { A: "감염성·기생충 (A·B)", C: "신생물(암) (C·D48)", D: "혈액·조혈 (D)", E: "내분비·대사 (E)", F: "정신·행동 (F)", G: "신경계 (G)", H: "눈·귀 (H)", I: "순환기 (I)", J: "호흡기 (J)", K: "소화기 (K)", L: "피부 (L)", M: "근골격 (M)", N: "비뇨생식 (N)", O: "임신·출산 (O)", P: "주산기 (P)", Q: "선천기형 (Q)", R: "증상·징후 (R)", S: "손상·중독 (S)", Z: "건강상태 (Z)", 기타: "기타" };
const KCD_ORDER = ["A", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M", "N", "O", "P", "Q", "R", "S", "Z", "기타"];
function OntOverview({ agg, onSeg }) {
  const audit = typeof pilotAudit === "function" ? pilotAudit() : null;
  const kcd = KCD_ORDER.filter((k) => agg.byKcd && agg.byKcd[k]).map((k) => [k, agg.byKcd[k]]);
  const kcdMax = kcd.length ? Math.max(...kcd.map((x) => x[1])) : 1;
  const deptTop = Object.entries(agg.byDept).sort((a, b) => b[1] - a[1]);
  const dzTop = Object.entries(agg.byDisease).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const markTop = Object.entries(agg.markAbn).sort((a, b) => b[1] - a[1]);
  const deptMax = deptTop[0] ? deptTop[0][1] : 1, dzMax = dzTop[0] ? dzTop[0][1] : 1, markMax = markTop[0] ? markTop[0][1] : 1;
  const ageMax = Math.max(...Object.values(agg.ageBands));
  const riskTot = agg.n;
  const male = Object.entries(agg.bySidoSex).filter(([k]) => k.endsWith("남")).reduce((s, [, v]) => s + v, 0);
  return (<>
    <div className="ontkpis">
      {[["총 회원(객체)", agg.n.toLocaleString() + "명", "#22D3EE"], ["유병 회원", agg.dzMembers.toLocaleString() + "명", "#F472B6"], ["평균 예상의료비", ontWon(agg.avgCost), "#FBBF24"], ["총 예상의료비", ontWon(agg.totalCost), "#F87171"], ["치료비 사각지대", agg.needyN.toLocaleString() + "명", "#E11D48"], ["보장 공백 회원", agg.gapN.toLocaleString() + "명", "#A78BFA"]].map(([k, v, c], i) => (
        <div className="ontkpi" key={i}><div className="ontkpi-v" style={{ color: c }}>{v}</div><div className="ontkpi-k">{k}</div></div>
      ))}
    </div>

    {audit && (
      <div className={`ontaudit ${audit.ok ? "ok" : "bad"}`}>
        <div className="ontaudit-l"><span className="ontaudit-ic">{audit.ok ? <Check size={18} /> : <AlertTriangle size={18} />}</span>
          <div><b>데이터 정합성 검증 {audit.ok ? "통과" : "위반 발견"}</b><span>{audit.n.toLocaleString()}명 · {audit.households.toLocaleString()}가구 · 아동(0~19) {agg.childN.toLocaleString()}명 · 성별/연령/가족 규칙 자동 스캔</span></div></div>
        <div className="ontaudit-checks">
          <div className={audit.sex ? "v" : "p"}>{audit.sex ? <X size={12} /> : <Check size={12} />} 성별 정합 <em>{audit.sex ? audit.sex + "건" : "0"}</em></div>
          <div className={audit.age ? "v" : "p"}>{audit.age ? <X size={12} /> : <Check size={12} />} 연령 정합 <em>{audit.age ? audit.age + "건" : "0"}</em></div>
          <div className={audit.fam ? "v" : "p"}>{audit.fam ? <X size={12} /> : <Check size={12} />} 가족 정합 <em>{audit.fam ? audit.fam + "건" : "0"}</em></div>
        </div>
      </div>
    )}
    <div className="ontfamstat">
      {[["가구 수", agg.households.toLocaleString(), "#F59E0B"], ["평균 가구원", agg.avgHouseholdSize + "명", "#22D3EE"], ["가구주", (agg.byRel["가구주"] || 0).toLocaleString(), "#6366F1"], ["배우자", (agg.byRel["배우자"] || 0).toLocaleString(), "#F472B6"], ["자녀", (agg.byRel["자녀"] || 0).toLocaleString(), "#34D399"], ["부모", ((agg.byRel["부"] || 0) + (agg.byRel["모"] || 0)).toLocaleString(), "#A78BFA"]].map(([k, v, c], i) => (
        <div className="ontfamcell" key={i}><b style={{ color: c }}>{v}</b><span>{k}</span></div>
      ))}
    </div>

    <div className="ontpanel" style={{ marginTop: 12 }}>
      <div className="ontph"><Banknote size={15} color="#F59E0B" /> 예상 연간 의료비 구성 <span>· 총 {ontWon(agg.totalCost)}</span></div>
      {(() => { const tot = (agg.sumCovered + agg.sumUncovered + agg.sumWellness) || 1; const seg = [["급여 본인부담", agg.sumCovered, "#22D3EE"], ["비급여", agg.sumUncovered, "#F472B6"], ["기타 건강관리", agg.sumWellness, "#34D399"]]; return (<>
        <div className="ontcostbar big">{seg.map(([t, v, c]) => <i key={t} style={{ width: (v / tot * 100) + "%", background: c }} title={t + " " + ontWon(v)} />)}</div>
        <div className="ontcostgrid">{seg.map(([t, v, c]) => <div className="ontcostcell" key={t}><span className="dot" style={{ background: c }} /><div><b>{ontWon(v)}</b><span>{t} · {Math.round(v / tot * 100)}%</span></div></div>)}</div>
      </>); })()}
    </div>

    <div className="ontpanel" style={{ marginTop: 12 }}>
      <div className="ontph"><Network size={15} color="#22D3EE" /> 질병분류(KCD) 대분류 분포 <span>· {kcd.length}개 장 · 질병유형 {agg.dzTypes}종</span></div>
      <div className="ontkcd">{kcd.map(([k, v], i) => <OntBar key={k} label={KCD_LABELS[k] || k} value={v} max={kcdMax} sub="명" color={ONT_DEPT_COLORS[i % ONT_DEPT_COLORS.length]} />)}</div>
    </div>

    <div className="ontgrid2">
      <div className="ontpanel">
        <div className="ontph"><Stethoscope size={15} color="#6366F1" /> 진료과목별 회원 분포 <span>· {deptTop.length}과</span></div>
        {deptTop.map(([k, v], i) => <OntBar key={k} label={_deptL(k)} value={v} max={deptMax} sub="명" color={ONT_DEPT_COLORS[i % ONT_DEPT_COLORS.length]} />)}
      </div>
      <div className="ontpanel">
        <div className="ontph"><HeartPulse size={15} color="#F472B6" /> 질병 진단 분포 <span>· 상위 10</span></div>
        {dzTop.map(([k, v]) => <OntBar key={k} label={k} value={v} max={dzMax} sub="명" color="#F472B6" />)}
      </div>
    </div>

    <div className="ontgrid2">
      <div className="ontpanel">
        <div className="ontph"><Users size={15} color="#38BDF8" /> 연령대 분포 <span>· 남 {male.toLocaleString()} / 여 {(agg.n - male).toLocaleString()}</span></div>
        {Object.entries(agg.ageBands).map(([k, v]) => <OntBar key={k} label={k} value={v} max={ageMax} sub="명" color="#38BDF8" />)}
      </div>
      <div className="ontpanel">
        <div className="ontph"><AlertTriangle size={15} color="#F59E0B" /> 위험등급 분포</div>
        <div className="ontrisk">{[1, 2, 3, 4, 5].map((r) => { const v = agg.byRisk[r] || 0; return (<div className="ontrisk-seg" key={r} style={{ flex: Math.max(0.4, v), background: RISK_COLORS[r] }} title={`${RISK_LABELS[r]} ${v}명`}><b>{v}</b><span>{RISK_LABELS[r]}</span></div>); })}</div>
        <div className="ontph" style={{ marginTop: 14 }}><Activity size={15} color="#34D399" /> 건강검진 지표 이상(위험↑) 회원</div>
        {markTop.map(([k, v]) => <OntBar key={k} label={k} value={v} max={markMax} sub="명" color="#34D399" />)}
      </div>
    </div>

    <div className="ontsegcta">
      <div><b>온톨로지 액션</b><span>세그먼트를 선택해 보험·나눔·케어 액션을 실행하세요.</span></div>
      <button onClick={() => onSeg("needy")}><HeartHandshake size={14} /> 치료비 사각지대 {agg.needyN}명 →</button>
    </div>
  </>);
}
function _deptL(k) { if (typeof DEPT_CATS !== "undefined") { const d = DEPT_CATS.find((x) => x.key === k); if (d) return d.label; } return k; }

/* ── 질병 관리 가이드 데이터(disease_care.json) 로더 ── */
let _dzcarePromise = null, _DZCARE = null;
function loadDzCare() { if (!_dzcarePromise) _dzcarePromise = fetch("./data/disease_care.json").then((r) => (r.ok ? r.json() : null)).then((j) => { _DZCARE = (j && j.diseases) || {}; return _DZCARE; }).catch(() => { _DZCARE = {}; return _DZCARE; }); return _dzcarePromise; }
function useDzCare() { const [mp, setMp] = useState(_DZCARE); useEffect(() => { if (!_DZCARE) loadDzCare().then(setMp); else setMp(_DZCARE); }, []); return mp || {}; }

/* 질병 1개 관리 가이드 카드(접이식) */
function DzCareCard({ name, data }) {
  const [open, setOpen] = useState(false);
  const rec = data.supplements_recommended || [], avo = data.supplements_avoid || [], dev = data.devices || [], life = data.lifestyle || [], diet = data.diet || {};
  return (
    <div className={`dzcare ${open ? "on" : ""}`}>
      <button className="dzcare-h" onClick={() => setOpen((v) => !v)}>
        <b>{name}</b>
        <span className="dzcare-tags">{data.dept && typeof _deptL === "function" && <i className="dzt dept">{_deptL(data.dept)}</i>}<i className="dzt rec">영양 {rec.length}</i>{avo.length > 0 && <i className="dzt avo">금기 {avo.length}</i>}<i className="dzt dev">기기 {dev.length}</i></span>
        <ChevronRight size={15} className="dzcare-arr" />
      </button>
      {open && (
        <div className="dzcare-b">
          {rec.length > 0 && <div className="dzcare-sec"><div className="dzcare-t rec"><Pill size={12} /> 맞춤 영양소·영양제</div>{rec.map((s, i) => <div className="dzcare-row" key={i}><b>{s.name}</b><p>{s.reason}</p><em>{s.source}</em></div>)}</div>}
          {avo.length > 0 && <div className="dzcare-sec"><div className="dzcare-t avo"><AlertTriangle size={12} /> 복용 주의·금기 영양소</div>{avo.map((s, i) => <div className="dzcare-row avo" key={i}><b>{s.name}</b><p>{s.reason}</p><em>{s.source}</em></div>)}</div>}
          {dev.length > 0 && <div className="dzcare-sec"><div className="dzcare-t dev"><MonitorSmartphone size={12} /> 홈케어 의료기기</div>{dev.map((s, i) => <div className="dzcare-row" key={i}><b>{s.name}</b><p>{s.use}</p></div>)}</div>}
          {(diet.principle || (diet.recommend || []).length) && <div className="dzcare-sec"><div className="dzcare-t diet"><Salad size={12} /> 건강 식단</div><div className="dzcare-row"><p>{diet.principle}</p>{(diet.recommend || []).length > 0 && <div className="dzcare-chips">권장 {diet.recommend.map((x, i) => <span key={i}>{x}</span>)}</div>}{(diet.avoid || []).length > 0 && <div className="dzcare-chips avo">주의 {diet.avoid.map((x, i) => <span key={i}>{x}</span>)}</div>}</div></div>}
          {life.length > 0 && <div className="dzcare-sec"><div className="dzcare-t life"><Activity size={12} /> 생활습관</div><ul className="dzcare-life">{life.map((s, i) => <li key={i}>{s.tip}{s.source ? <em> · {s.source}</em> : null}</li>)}</ul></div>}
          {(data.sources || []).length > 0 && <div className="dzcare-src">출처: {data.sources.join(" · ")}</div>}
        </div>
      )}
    </div>
  );
}

  return (
    <div className="ontov" onClick={onClose}>

        <div className="ontmh">
          <div><span className="ontmid">{m.id}</span><div className="ontmname">{m.name} <span>· {m.sex} {m.age}세 · {m.sido}</span></div></div>

        <div className="ontmbody">

            <div className="ontmsec"><div className="ontmsh"><Banknote size={13} color="#F59E0B" /> 예상 연간 의료비 구성 <span>{ontWon(m.estCost)}</span></div>
              <div className="ontcostbar">{seg.map(([t, v, c]) => <i key={t} style={{ width: (v / tot * 100) + "%", background: c }} title={t + " " + ontWon(v)} />)}</div>
              <div className="ontcostrows">{seg.map(([t, v, c]) => <div className="ontcostrow" key={t}><span className="dot" style={{ background: c }} /><span className="ct">{t}</span><b>{ontWon(v)}</b><em>{Math.round(v / tot * 100)}%</em></div>)}</div>
            </div>
          ); })()}

          <div className="ontmsec"><div className="ontmsh"><HeartPulse size={13} color="#F472B6" /> 진단 질병 <span>{m.dzCount}</span></div>
            {m.diseases.length ? <div className="ontchips">{m.diseases.map((d) => <span key={d} className="ontchip dz">{d}</span>)}</div> : <div className="ontempty">진단된 질병 없음 (건강 양호)</div>}

            </div>
          ); })()}

          {typeof consultGet === "function" && (() => { const ev = consultGet(m); const A = typeof analyzeConsults === "function" ? analyzeConsults(m) : null; return (

              ))}</div> : <div className="ontempty">상담 기록 없음</div>}
              {A && A.stats.recoCount > 0 && <div className="ontcns-sum"><Sparkles size={11} color="#34D399" /> 상담 기반 분석 → 추가검진 <b>{A.reco.checkup.length}</b> · 진료과 <b>{A.reco.dept.length}</b> · 영양 <b>{A.reco.nutrition.length}</b> · 기기 <b>{A.reco.device.length}</b> · 식단 <b>{A.reco.diet.length}</b></div>}
            </div>
          ); })()}

          {m.childHealth ? (
            <div className="ontmsec"><div className="ontmsh"><Activity size={13} color="#34D399" /> 아동·청소년 건강검진 <span>{m.checkupType}</span></div>
              <div className="ontmarks">{Object.entries(m.childHealth).map(([k, v]) => <div className="ontmark" key={k}><span>{k}</span><b style={{ color: /^정상|^양호/.test(v) ? "#34D399" : /필요|성장지연|소아비만|근시 \(/.test(v) ? "#EF4444" : "#F59E0B" }}>{v}</b></div>)}</div>
            </div>

            <div className="ontmsec"><div className="ontmsh"><Activity size={13} color="#34D399" /> 건강검진 이상 지표 <span>{marks.length}</span></div>

            </div>
          )}

          <div className="ontmsec"><div className="ontmsh"><ShieldCheck size={13} color="#A78BFA" /> 필요 보장 · 공백</div>
            <div className="ontchips">{m.coverages.map((c) => <span key={c} className={`ontchip ${m.gap.includes(c) ? "gap" : "held"}`}>{c}{m.gap.includes(c) ? " · 공백" : ""}</span>)}</div>
          </div>

          <div className="ontmsec"><div className="ontmsh"><HeartHandshake size={13} color="#F59E0B" /> 가족 (가구 {m.hid}) <span>{fam.length}명</span></div>
            <div className="ontfam">{fam.map((f) => (
              <div className={`ontfam-r ${f.id === m.id ? "self" : ""}`} key={f.id}>
                <span className="ontfam-rel">{f.rel}</span>
                <b>{f.name}</b><span className="ontfam-sa">{f.sex} {f.age}세</span>
                <span className="ontfam-dz">{f.diseases.length ? f.diseases[0] + (f.diseases.length > 1 ? " 외 " + (f.diseases.length - 1) : "") : "건강"}</span>
                <span className="ontfam-risk" style={{ color: f.riskColor }}>{f.riskLabel}</span>
              </div>
            ))}</div>
          </div>

          <div className="ontmsec ontflags">
            {m.needy && <span className="ontflag needy"><HeartHandshake size={12} /> 치료비 사각지대(나눔 대상)</span>}
            {m.hasGap && <span className="ontflag gap"><ShieldCheck size={12} /> 보장 공백 {m.gap.length}건</span>}
            {m.smoker && <span className="ontflag warn">흡연</span>}
            {m.drinker && <span className="ontflag warn">음주</span>}
            <span className="ontflag ok">운동 주 {m.exercise}회</span>
            <span className="ontflag ok">소득 {m.income}</span>
          </div>

          <div className="ontmacts">
            <button className="pri ontmacts-main" onClick={() => { onClose(); onGo && onGo("ai"); }}><Bot size={16} /> AI 케어플랜</button>
            {m.needy && <button className="give" onClick={() => { if (typeof toast === "function") toast(`${m.name}님 · 치료비 나눔 대상 등록(파일럿)`); }}><HeartHandshake size={14} /> 나눔 매칭</button>}
          </div>
          <button className="ontmsub" onClick={() => { onClose(); onGo && onGo("insurance"); }}><ShieldCheck size={12} /> 보장 설계</button>
        </div>
      </div>
    </div>
  );
}
function _markL(key, gi) { if (typeof CHECKUP_ONTOLOGY !== "undefined") { const o = CHECKUP_ONTOLOGY.find((x) => x.key === key); if (o) return o.grades[gi][0]; } return ["정상", "주의", "위험", "고위험"][gi]; }

/* ── 질병 케어 라이브러리 (회원 무관, 192개 질병 전체 열람) ── */
function DzCareLibrary() {
  const care = useDzCare();
  const [q, setQ] = useState("");
  const [dept, setDept] = useState("전체");
  const entries = React.useMemo(() => Object.keys(care).map((name) => ({ name, data: care[name] })), [care]);
  const depts = React.useMemo(() => { const s = new Set(entries.map((e) => e.data.dept).filter(Boolean)); return ["전체", ...[...s].sort((a, b) => _deptL(a).localeCompare(_deptL(b), "ko"))]; }, [entries]);
  const qq = q.trim();
  const filtered = React.useMemo(() => entries.filter((e) => {
    if (dept !== "전체" && e.data.dept !== dept) return false;
    if (!qq) return true;
    if (e.name.indexOf(qq) >= 0) return true;
    if (_deptL(e.data.dept || "").indexOf(qq) >= 0) return true;
    const hit = (arr, k) => (arr || []).some((x) => (x[k] || "").indexOf(qq) >= 0);
    return hit(e.data.supplements_recommended, "name") || hit(e.data.supplements_avoid, "name") || hit(e.data.devices, "name");
  }).sort((a, b) => a.name.localeCompare(b.name, "ko")), [entries, dept, qq]);
  const CAP = 60;
  return (
    <div className="dzlib">
      <div className="ontstore-def" style={{ background: "linear-gradient(120deg,#0C2A20,#0F1B33)", borderColor: "#1F5137" }}><span className="ontstore-ic" style={{ background: "#0E241C" }}><Pill size={15} color="#34D399" /></span><div><b>질병 케어 라이브러리 · {entries.length || 197}개 질병</b><p>192개 질병별 <b>맞춤 영양소·복용 금기 영양소·홈케어 의료기기·건강식단·생활습관</b>을 전세계 권위기관 근거로 정리한 지식 스토리지입니다. 진료과·질병·영양소로 검색하세요.</p></div></div>
      <div className="ontfilters" style={{ gridTemplateColumns: "220px 1fr" }}>
        <select value={dept} onChange={(e) => setDept(e.target.value)}>{depts.map((d) => <option key={d} value={d}>{d === "전체" ? "진료과목 전체" : _deptL(d)}</option>)}</select>
        <div className="ontsearch"><Search size={14} /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="질병·영양소·기기 검색 (예: 오메가3, 혈당계, 당뇨)" /></div>
      </div>
      <div className="ontcount">검색 결과 <b>{filtered.length}</b>개 <span>/ 전체 {entries.length}개 질병</span></div>
      {!entries.length ? <div className="ontempty" style={{ margin: "14px 0" }}>케어 데이터를 불러오는 중…</div> :
        <div className="dzcare-list">{filtered.slice(0, CAP).map((e) => <DzCareCard key={e.name} name={e.name} data={e.data} />)}</div>}
      {filtered.length > CAP && <div className="ontcount" style={{ marginTop: 8 }}>상위 {CAP}개 표시 · 검색·진료과로 좁혀보세요</div>}
      <div className="chnote" style={{ marginTop: 10 }}>전세계 권위기관(NIH ODS·NCCIH·Mayo·NHS·WHO·Cochrane·질환별 학회·국가건강정보포털·식약처) 근거. ※ 교육용 정보이며 진단·처방이 아님. 복용 금기·상호작용은 개인 복용약에 따라 다르니 의사·약사와 상담하세요.</div>
    </div>
  );
}

/* ── 객체 탐색기 (회원 코호트 필터·테이블) ── */
function OntExplorer({ cohort, onGo, seg }) {
  const [smode, setSmode] = useState("members");
  const [dept, setDept] = useState("전체");
  const [band, setBand] = useState("전체");
  const [sex, setSex] = useState("전체");
  const [risk, setRisk] = useState("전체");
  const [flag, setFlag] = useState(seg || "전체");
  const [q, setQ] = useState("");
  const [shown, setShown] = useState(30);
  const [sel, setSel] = useState(null);
  useEffect(() => { if (seg) { setFlag(seg); setShown(30); } }, [seg]);
  const depts = React.useMemo(() => ["전체", ...[...new Set(cohort.map((m) => m.deptKey))].sort((a, b) => _deptL(a).localeCompare(_deptL(b), "ko"))], [cohort]);
  const list = React.useMemo(() => {
    const qq = q.trim();
    return cohort.filter((m) => {
      if (dept !== "전체" && m.deptKey !== dept) return false;
      if (sex !== "전체" && m.sex !== sex) return false;
      if (risk !== "전체" && String(m.risk) !== risk) return false;
      if (band !== "전체") { const b = m.age < 20 ? "0~19" : m.age < 30 ? "20대" : m.age < 40 ? "30대" : m.age < 50 ? "40대" : m.age < 60 ? "50대" : m.age < 70 ? "60대" : "70대+"; if (b !== band) return false; }
      if (flag === "needy" && !m.needy) return false;
      if (flag === "gap" && !m.hasGap) return false;
      if (flag === "high" && m.risk < 4) return false;
      if (flag === "cancer" && !m.cancer) return false;
      if (qq && m.name.indexOf(qq) < 0 && m.id.indexOf(qq.toUpperCase()) < 0 && !m.diseases.some((d) => d.indexOf(qq) >= 0)) return false;
      return true;
    });
  }, [cohort, dept, sex, risk, band, flag, q]);
  const view = list.slice(0, shown);
  const reset = () => setShown(30);
  const FLAGS = [["전체", "전체"], ["high", "고위험군"], ["gap", "보장공백"], ["needy", "치료비 사각지대"], ["cancer", "암 진단"]];
  return (<>
    <div className="ontstore-tabs">
      <button className={smode === "members" ? "on" : ""} onClick={() => setSmode("members")}><Users size={14} /> 회원 객체 <span>{cohort.length.toLocaleString()}</span></button>
      <button className={smode === "library" ? "on" : ""} onClick={() => setSmode("library")}><Pill size={14} /> 질병 케어 라이브러리</button>
    </div>
    {smode === "library" && <DzCareLibrary />}
    {smode === "members" && (<>
    <div className="ontstore-def"><span className="ontstore-ic"><Search size={15} color="#22D3EE" /></span><div><b>데이터 하우스 · 객체 탐색기</b><p>{cohort.length.toLocaleString()}명의 회원 객체가 보관된 회원 데이터 하우스입니다. 각 회원 객체에는 <b>상담 기록이 시계열로 첨부</b>되어 있어, 객체를 열면 상담 이력 → 5대 실행 안내까지 이어집니다.</p></div></div>
    <div className="ontfilters">
      <select value={dept} onChange={(e) => { setDept(e.target.value); reset(); }}>{depts.map((d) => <option key={d} value={d}>{d === "전체" ? "진료과목 전체" : _deptL(d)}</option>)}</select>
      <select value={band} onChange={(e) => { setBand(e.target.value); reset(); }}>{["전체", "0~19", "20대", "30대", "40대", "50대", "60대", "70대+"].map((b) => <option key={b} value={b}>{b === "전체" ? "연령대 전체" : b}</option>)}</select>
      <select value={sex} onChange={(e) => { setSex(e.target.value); reset(); }}>{["전체", "남", "여"].map((s) => <option key={s} value={s}>{s === "전체" ? "성별 전체" : s}</option>)}</select>
      <select value={risk} onChange={(e) => { setRisk(e.target.value); reset(); }}><option value="전체">위험등급 전체</option>{[1, 2, 3, 4, 5].map((r) => <option key={r} value={String(r)}>{RISK_LABELS[r]}</option>)}</select>
    </div>
    <div className="ontflagbar">{FLAGS.map(([k, l]) => <button key={k} className={flag === k ? "on" : ""} onClick={() => { setFlag(k); reset(); }}>{l}</button>)}
      <div className="ontsearch"><Search size={14} /><input value={q} onChange={(e) => { setQ(e.target.value); reset(); }} placeholder="이름·ID·질병 검색" /></div>
    </div>
    <div className="ontcount">필터 결과 <b>{list.length.toLocaleString()}</b>명 <span>/ 전체 {cohort.length.toLocaleString()}명</span></div>
    <div className="onttbl-wrap">
      <table className="onttbl">
        <thead><tr><th>ID</th><th>이름</th><th>성/나이</th><th>지역</th><th>진료과목</th><th>질병</th><th>검진이상</th><th>상담</th><th>위험</th><th>예상의료비</th></tr></thead>
        <tbody>{view.map((m) => { const cn = typeof consultGet === "function" ? consultGet(m).length : 0; return (
          <tr key={m.id} onClick={() => setSel(m)} title="객체 상세">
            <td className="mono">{m.id}</td><td><b>{m.name}</b>{m.needy && <span className="tdot needy" title="치료비 사각지대" />}{m.hasGap && <span className="tdot gap" title="보장공백" />}</td>
            <td>{m.sex} {m.age}</td><td>{m.sido}</td><td>{m.deptLabel}</td>
            <td>{m.dzCount ? <span className="tbadge dz">{m.dzCount}</span> : <span className="tmut">-</span>}</td>
            <td>{m.abnormalCount ? <span className="tbadge ab">{m.abnormalCount}</span> : <span className="tmut">-</span>}</td>
            <td>{cn ? <span className="tbadge cn"><MessageSquare size={9} style={{ verticalAlign: "-1px" }} /> {cn}</span> : <span className="tmut">-</span>}</td>
            <td><span className="tbadge" style={{ background: m.riskColor + "22", color: m.riskColor }}>{m.riskLabel}</span></td>
            <td className="mono" style={{ color: "#F59E0B" }}>{ontWon(m.estCost)}</td>
          </tr>
        ); })}</tbody>
      </table>
    </div>
    {view.length === 0 && <div className="ontempty" style={{ margin: "14px 0" }}>조건에 맞는 회원이 없습니다.</div>}
    {shown < list.length && <button className="cbtn" onClick={() => setShown((x) => x + 30)}>더 보기 ({(list.length - shown).toLocaleString()}명 더)</button>}
    {sel && <OntMemberModal m={sel} onClose={() => setSel(null)} onGo={onGo} />}
    </>)}
  </>);
}

/* ── 액션 (세그먼트 → 보험/나눔/케어) ── */

  ];
  return (<>
    <div className="ontactnote"><Sparkles size={14} color="#22D3EE" /> 온톨로지가 코호트를 실시간 세그먼트로 묶어, 각 군에 맞는 <b>보험·나눔·케어 액션</b>을 실행합니다. <span>(파일럿 시연)</span></div>

      <div className="ontactcard" key={c.k} style={{ borderTopColor: c.c }}>
