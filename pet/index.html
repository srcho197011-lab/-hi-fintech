/* ============================ HOOKS ============================ */
function useCountUp(target, dur=1100){
  const [v,setV]=useState(0);
  useEffect(()=>{
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){ setV(target); return; }
    let raf, start;
    const step=(t)=>{ if(!start)start=t; const p=Math.min((t-start)/dur,1);
      setV(Math.round(target*(1-Math.pow(1-p,3)))); if(p<1) raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf);
  },[target]);
  return v;
}

function Gauge({score}){
  const v=useCountUp(score);
  const R=58, C=Math.PI*R; // semicircle length
  const off=C*(1-v/100);
  return (
    <div style={{position:"relative",width:160,height:96,margin:"0 auto"}}>
      <svg viewBox="0 0 160 90" width="160" height="90">
        <path d="M16 84 A64 64 0 0 1 144 84" fill="none" stroke="#F1E7DA" strokeWidth="14" strokeLinecap="round"/>
        <path d="M16 84 A64 64 0 0 1 144 84" fill="none" stroke="url(#gg)" strokeWidth="14"
          strokeLinecap="round" strokeDasharray={C} strokeDashoffset={off}
          style={{transition:"stroke-dashoffset .3s"}}/>
        <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stopColor="#F4843C"/><stop offset="1" stopColor="#FFB547"/></linearGradient></defs>
      </svg>
      <div style={{position:"absolute",bottom:2,left:0,right:0,textAlign:"center"}}>
        <div style={{fontSize:40,fontWeight:900,lineHeight:1,color:"var(--text)"}} className="num">{v}</div>
        <div style={{fontSize:12,color:"var(--muted)",fontWeight:700}}>/100</div>
      </div>
    </div>
  );
}

function MetricBar({m,delay}){
  const [w,setW]=useState(0);
  useEffect(()=>{ const t=setTimeout(()=>setW(m.value),delay); return ()=>clearTimeout(t); },[]);
  const Icon=m.icon;
  return (
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <Icon size={16} color={m.color}/>
      <span style={{fontSize:13.5,fontWeight:600,width:62,flexShrink:0,color:"var(--sub)"}}>{m.label}</span>
      <div style={{flex:1,height:8,background:"#F1E7DA",borderRadius:999,overflow:"hidden"}}>

          background:m.color==="var(--green)"?"linear-gradient(90deg,#5BBF8A,#4FB286)":"linear-gradient(90deg,#F4843C,#FFB547)",
          transition:"width 1s cubic-bezier(.2,.7,.2,1)"}}/>
      </div>
      <span className="num" style={{fontSize:13.5,fontWeight:800,width:26,textAlign:"right"}}>{m.value}</span>
    </div>
  );
}

function shopParseCsv(t){ const rows=t.trim().split(/\r?\n/); const head=rows[0].split(",").map(h=>h.trim()); return rows.slice(1).filter(Boolean).map(line=>{ const c=line.split(","); const o={}; head.forEach((h,i)=>o[h]=(c[i]||"").trim()); return o; }); }
function shopCsvToProduct(o){ const n=v=>v===""?null:Number(v); const b=v=>v==="true"||v==="1"; return { id:"x"+Math.abs((Math.sin((o.product_name||"").length+(o.price||0))*1e9)|0), emoji:"🛍️", name:o.product_name, cat:o.category, origin:o.origin||"국내", pet:o.target_pet||"공용", presc:o.prescription_type||"일반식", health:o.health_function?o.health_function.split(/[;|]/).map(s=>s.trim()).filter(Boolean):[], brand:o.brand||"", price:n(o.price)||0, sale:n(o.sale_price), token:n(o.token_reward)||0, ai:b(o.recommended_by_ai), ins:b(o.insurance_linked), stock:0, ing:"" }; }

  const del=(id)=>setProducts(ps=>ps.filter(p=>p.id!==id));
  const onCsv=async(file)=>{ const t=await file.text(); const rows=shopParseCsv(t); const e=[]; rows.forEach((r,i)=>{ if(!r.product_name)e.push(`${i+2}행: product_name 누락`); if(!r.category)e.push(`${i+2}행: category 누락`); if(isNaN(Number(r.price)))e.push(`${i+2}행: price 숫자 아님`); }); setPrev(rows); setErrs(e); };
  const saveCsv=()=>{ setProducts(ps=>[...prev.map(shopCsvToProduct),...ps]); setPrev(null); setErrs([]); alert("CSV 업로드 완료"); };
  return (<>

function ShopSection(){
  const nav=React.useContext(NavCtx);
  const [tab,setTab]=useState("ai");

  const [orders,setOrders]=useState(()=>SLS.get("hipet_app_orders",[]));
  const [products,setProducts]=useState(()=>{ if(SLS.get("hipet_app_pver",0)!==1){SLS.set("hipet_app_pver",1);SLS.set("hipet_app_products",PRODUCTS);return PRODUCTS;} const s=SLS.get("hipet_app_products",null); return s&&s.length?s:PRODUCTS; });
  const [detail,setDetail]=useState(null);
  useEffect(()=>SLS.set("hipet_app_cart",cart),[cart]);

  useEffect(()=>SLS.set("hipet_app_products",products),[products]);
  const add=(p,qty=1)=>setCart(c=>{ const i=c.findIndex(x=>x.p.id===p.id); if(i>=0){ const n=[...c]; n[i]={...n[i],qty:n[i].qty+qty}; return n; } return [...c,{p,qty}]; });
  const buy=(p)=>{ add(p); setDetail(null); setTab("cart"); };
  const addOrder=(o)=>setOrders(os=>[o,...os]);
  const count=cart.reduce((s,x)=>s+x.qty,0);
  const tabs=[["ai","AI 추천",Sparkles],["사료","사료",Bone],["간식","간식",Pill],["용품","용품",ShoppingBag],["cart","장바구니",ShoppingCart],["orders","주문내역",Receipt],["admin","관리자",Settings]];
  return (
    <div className="hsec">

      <div className="chtabs">{tabs.map(([k,t,Ic])=><button key={k} className={`chtab ${tab===k?"on":""}`} onClick={()=>setTab(k)}><Ic size={15}/> {t}{k==="cart"&&count>0&&<span className="tabbadge">{count}</span>}</button>)}</div>
      {tab==="ai" && <ShopAI products={products} onAdd={add} onOpen={setDetail}/>}
      {(tab==="사료"||tab==="간식"||tab==="용품") && <ShopCatalog cat={tab} products={products} onAdd={add} onOpen={setDetail}/>}

      {tab==="admin" && <ShopAdmin products={products} setProducts={setProducts}/>}

  { tier:"골드", daily:"10만원", surgery:"100만원", annual:"100만원", guardian:"건강검진 + 일반상해", color:"#F2A30A", soft:"#FFF3DC" },

  { tier:"VIP", daily:"30만원", surgery:"300만원", annual:"3,000만원", guardian:"일반상해", color:"#EF5350", soft:"#FDE7E7" },

const TIER_MIN = { "기본회원":0, "골드":100000, "프리미엄":200000, "VIP":300000 };
function calculateTier(avg){ if(avg>=300000) return "VIP"; if(avg>=200000) return "프리미엄"; if(avg>=100000) return "골드"; return "기본회원"; }

function coachReply(text){
  const raw=text||""; const t=raw.replace(/\s/g,"");
  // 1) 응급 감지
  if(COACH_URGENT.some(k=>t.includes(k))){
    return { urgent:true, a:"⚠️ 응급 상황일 수 있어요. 지체 없이 가까운 24시·응급 동물병원에 연락하거나 방문하세요. 이물·중독(초콜릿·포도·양파 등)이 의심되면 먹은 것과 시간을 메모해 가시면 진료에 도움이 됩니다.", chips:["24시·응급 병원 찾기","보호자 거주지 병원"] };
  }
  // 2) 매칭되는 토픽 모두 수집 (증상 조합)
  const hits=COACH_QA.filter(q=>q.m.some(k=>t.includes(k)));
  if(hits.length===0){
    return { a:"마루의 건강검진·예방접종·체중·보험 정보를 바탕으로 답해드려요. 슬개골/치아/체중/혈액수치/예방접종/보험/소화기/기침/눈/피부 등에 대해 물어보세요. 정확한 진단·처방은 동물병원 수의사 상담을 권고드립니다.", chips:["건강점수 어때?","슬개골 괜찮아?","입냄새가 나요","설사를 해요"] };
  }
  if(hits.length===1){
    const q=hits[0];
    return { a:q.a, fu:q.fu, chips:q.chips };
  }
  // 여러 토픽 동시 언급 → 조합 답변
  const top=hits.slice(0,3);
  const a="여러 가지가 함께 궁금하시군요. 항목별로 정리해 드릴게요.\n\n"+top.map(q=>"• ["+q.k+"] "+q.a).join("\n\n");
  const chips=[...new Set(top.flatMap(q=>q.chips))].slice(0,4);
  return { a, fu:"가장 걱정되는 증상부터 더 자세히 살펴볼까요?", chips };
}

/* 카톡형 상담 (AI 주치의 / 전문 수의사 공용) */
function ChatBox({who,icon:Ic,greeting,startChips,placeholder,replyFn,height}){
  const [msgs,setMsgs]=useState([{r:"ai",t:greeting}]);
  const [input,setInput]=useState("");
  const [chips,setChips]=useState(startChips);
  const logRef=useRef(null);
  useEffect(()=>{ if(logRef.current) logRef.current.scrollTop=logRef.current.scrollHeight; },[msgs]);
  const ask=(text)=>{ if(!text||!text.trim())return; const r=replyFn(text);
    setMsgs(m=>{ const n=[...m,{r:"me",t:text},{r:"ai",t:r.a,urgent:r.urgent}]; if(r.fu) n.push({r:"ai",t:r.fu,fu:true}); return n; });
    setInput(""); if(r.chips)setChips(r.chips); };
  return (
    <div className="chatwrap">
      <div className="chatlog" ref={logRef} style={height?{height}:undefined}>
        {msgs.map((m,i)=><div key={i} className={`cbub ${m.r==="me"?"me":"ai"}${m.urgent?" urgent":""}${m.fu?" fu":""}`}>{m.r==="ai"&&!m.fu&&<div className="av"><Ic size={14}/> {who}</div>}{m.fu&&<MessageCircle size={13} style={{verticalAlign:"-2px",marginRight:4}}/>}{m.t}</div>)}
      </div>
      <div className="chips">{chips.map((c,i)=><button key={i} className="chip" onClick={()=>ask(c)}>{c}</button>)}</div>
      <div className="chatbar"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")ask(input);}} placeholder={placeholder}/><button onClick={()=>ask(input)}><Send size={18}/></button></div>
    </div>
  );
}

function WeightSpark({data,target}){
  const ws=data.map(d=>d.w); const min=Math.min(...ws,target)-0.2, max=Math.max(...ws,target)+0.2;
  const W=300,Hh=110,pad=22;
  const X=(i)=>pad+i*(W-2*pad)/(data.length-1);
  const Y=(w)=>Hh-pad-((w-min)/(max-min))*(Hh-2*pad);
  const path=data.map((d,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(d.w).toFixed(1)).join(" ");
  const ty=Y(target);
  return (
    <svg viewBox={`0 0 ${W} ${Hh}`} width="100%" height={Hh} style={{overflow:"visible"}}>
      <line x1={pad} y1={ty} x2={W-pad} y2={ty} stroke="#4FB286" strokeWidth="1.2" strokeDasharray="4 4"/>
      <text x={W-pad} y={ty-5} fontSize="9" fill="#4FB286" textAnchor="end" fontWeight="700">목표 {target}kg</text>
      <path d={path} fill="none" stroke="var(--orange)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {data.map((d,i)=>(<g key={i}>
        <circle cx={X(i)} cy={Y(d.w)} r="3.5" fill="#fff" stroke="var(--orange)" strokeWidth="2"/>
        <text x={X(i)} y={Y(d.w)-9} fontSize="9.5" fill="var(--sub)" textAnchor="middle" fontWeight="700" className="num">{d.w}</text>
        <text x={X(i)} y={Hh-5} fontSize="9.5" fill="var(--muted)" textAnchor="middle">{d.m}</text>
      </g>))}
    </svg>
  );
}

const PARTNER_KEYS = ["대학교 동물병원","대학동물병원","동물대학병원","VIP동물의료센터","이리온","해마루","청담우리","스카이동물메디컬","서울동물메디컬","고려동물","윈동물","아이엠디티","IMDT","헬프동물","24시","응급"];

function fmtTel(t){ if(!t) return ""; t=(""+t).replace(/[^0-9]/g,"");
  if(t.startsWith("02")){ if(t.length===10) return t.replace(/(02)(\d{4})(\d{4})/,"$1-$2-$3"); if(t.length===9) return t.replace(/(02)(\d{3})(\d{4})/,"$1-$2-$3"); }
  if(t.length===11) return t.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3");
  if(t.length===10) return t.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3");
  return t; }

let _petHospPromise=null;
function usePetHospitals(){
  const [s,setS]=useState({loading:true,error:null,data:null});
  useEffect(()=>{
    if(!_petHospPromise) _petHospPromise=fetch("./data/pet_hospitals.json").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
    let alive=true;
    _petHospPromise.then(d=>alive&&setS({loading:false,error:null,data:d})).catch(e=>alive&&setS({loading:false,error:String(e.message||e),data:null}));
    return ()=>{alive=false;};
  },[]);
  return s;
}

let _leafletPromise=null;
function ensureLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(_leafletPromise) return _leafletPromise;
  _leafletPromise=new Promise((res,rej)=>{
    const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const s=document.createElement("script"); s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload=()=>res(window.L); s.onerror=()=>rej(new Error("leaflet")); document.body.appendChild(s);
  });
  return _leafletPromise;
}

function MapView({points,height=260}){
  const ref=useRef(null), mapRef=useRef(null);
  const [err,setErr]=useState(false);
  useEffect(()=>{
    let dead=false;
    ensureLeaflet().then(L=>{
      if(dead||!ref.current) return;
      const pts=points.filter(p=>p.lat&&p.lng).slice(0,200);
      if(!mapRef.current){
        mapRef.current=L.map(ref.current,{scrollWheelZoom:false});
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(mapRef.current);
        mapRef.current._grp=L.layerGroup().addTo(mapRef.current);
      }
      const map=mapRef.current; map._grp.clearLayers();
      const icon=L.divIcon({className:"",html:'<div style="width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#F4843C;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>',iconSize:[16,16],iconAnchor:[8,16]});
      if(pts.length===0){ map.setView([36.4,127.8],7); }
      else{
        const b=[];
        pts.forEach(p=>{ const m=L.marker([p.lat,p.lng],{icon}).addTo(map._grp);
          m.bindPopup(`<b>${p.name}</b><br>${p.addr||""}${p.tel?"<br>☎ "+fmtTel(p.tel):""}`); b.push([p.lat,p.lng]); });
        if(b.length===1) map.setView(b[0],15); else map.fitBounds(b,{padding:[28,28]});
      }
      setTimeout(()=>map.invalidateSize(),120);
    }).catch(()=>setErr(true));
    return ()=>{dead=true;};
  },[points]);
  useEffect(()=>()=>{ if(mapRef.current){ mapRef.current.remove(); mapRef.current=null; } },[]);
  if(err) return <div className="hload">지도를 불러오지 못했습니다. (네트워크 차단 환경일 수 있습니다)</div>;
  return <div ref={ref} style={{height,borderRadius:14,overflow:"hidden",border:"1px solid var(--border)"}}/>;
}

        {h[4] ? <a className="hlink" href={`tel:${h[4]}`}><Phone size={13}/> {fmtTel(h[4])}</a> : <span className="noinfo">전화정보 없음</span>}
        <div className="obtns"><button onClick={()=>onDetail(h)}>상세</button><button className="book" onClick={()=>onBook(h)}>예약</button></div>

}

function HospitalDirectory({data,preset}){
  const [sido,setSido]=useState(preset.sido||"전체");
  const [sgg,setSgg]=useState(preset.sgg||"전체");
  const [emer,setEmer]=useState(false);
  const [q,setQ]=useState("");
  const [shown,setShown]=useState(20);
  const [sel,setSel]=useState(null);
  const [detail,setDetail]=useState(null);
  useEffect(()=>{ setSido(preset.sido||"전체"); setSgg(preset.sgg||"전체"); setShown(20); },[preset]);
  const {sggBySido,countBySido}=React.useMemo(()=>{ const m={},c={}; for(const h of data.hospitals){ const s=data.sido[h[1]]; c[s]=(c[s]||0)+1; (m[s]||(m[s]=new Set())).add(h[2]); } return {sggBySido:m,countBySido:c}; },[data]);
  const sidoChips=React.useMemo(()=>["전체",...[...data.sido].sort((a,b)=>SIDO_ORDER.indexOf(a)-SIDO_ORDER.indexOf(b))],[data]);
  const sggOptions=React.useMemo(()=>sido==="전체"?[]:[...(sggBySido[sido]||[])].sort((a,b)=>a.localeCompare(b,"ko")),[sido,sggBySido]);
  const list=React.useMemo(()=>{
    const si=sido==="전체"?-1:data.sido.indexOf(sido); const qq=q.trim();
    return data.hospitals.filter(h=>(si<0||h[1]===si)&&(sgg==="전체"||h[2]===sgg)&&(!emer||isEmergency(h[0]))&&(!qq||h[0].indexOf(qq)>=0||h[3].indexOf(qq)>=0));
  },[data,sido,sgg,emer,q]);
  const view=list.slice(0,shown); const reset=()=>setShown(20);
  return (<>
    <div className="benefit">
      <span><Building2 size={15}/> 전국 동물병원 {data.meta.hospitals.toLocaleString()}곳</span>
      <span><Siren size={15}/> 24시·응급 동물병원</span>
      <span><CalendarCheck size={15}/> 실시간 예약</span>
      <span><Award size={15}/> NFT 예약증 발행</span>
    </div>
    <MapCard title={`동물병원 위치 지도 (${(sido==="전체"?"전국":sido)+(sgg!=="전체"?" "+sgg:"")} ${list.length.toLocaleString()}곳)`} points={list.map(h=>({name:h[0],addr:h[3],tel:h[4],lng:h[5],lat:h[6]}))}/>
    <div className="bklbl">지역(시·도) 선택</div>
    <div className="regions">{sidoChips.map(r=><button key={r} className={`fsel ${sido===r?"on":""}`} onClick={()=>{setSido(r);setSgg("전체");reset();}}>{r==="서울특별시"&&<Home size={11} style={{verticalAlign:"-1px",marginRight:3}}/>}{r}{r!=="전체"&&countBySido[r]?<span className="cnt">{countBySido[r].toLocaleString()}</span>:""}</button>)}</div>
    <div className="hfilt">
      <select value={sgg} onChange={e=>{setSgg(e.target.value);reset();}} disabled={sido==="전체"}>
        <option value="전체">{sido==="전체"?"시·도 먼저 선택":"시·군·구 전체"}</option>
        {sggOptions.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
      <button className={`fsel big ${emer?"on":""}`} onClick={()=>{setEmer(v=>!v);reset();}}><Siren size={13} style={{verticalAlign:"-2px"}}/> 24시·응급만</button>
    </div>
    <div className="filterbar">
      <div className="fsearch"><Search size={15}/><input value={q} onChange={e=>{setQ(e.target.value);reset();}} placeholder="병원명·주소 검색"/></div>
    </div>
    <div className="chcount">{sido==="전체"?"전국":sido}{sgg!=="전체"?" "+sgg:""}{emer?" · 24시·응급":""} <b style={{color:"var(--orange-deep)"}}>{list.length.toLocaleString()}</b>곳</div>
    {view.map((h,i)=><HospRow key={i} data={data} h={h} onDetail={setDetail} onBook={setSel}/>)}
    {view.length===0 && <div className="hload">조건에 맞는 동물병원이 없습니다. 필터를 조정해 보세요.</div>}
    {shown<list.length && <button className="cbtn" onClick={()=>setShown(x=>x+20)}>더 보기 ({(list.length-shown).toLocaleString()}곳 더)</button>}
    <div className="chnote">※ 동물병원 목록·주소·전화·좌표는 지방행정인허가데이터(LOCALDATA) ‘동물병원’ 공공데이터({data.meta.asof} · 공공누리 제1유형) 기반으로, 영업 중 {data.meta.hospitals.toLocaleString()}곳을 수록했습니다(좌표 {data.meta.withCoord.toLocaleString()}곳). <b>24시·응급 표시는 상호명 기준 추정</b>이며, 실시간 진료시간·예약 슬롯은 제휴 동물병원 API 연동 시 반영됩니다. 의료기관 정보 제공은 이용자의 합리적 선택을 돕기 위한 것입니다.</div>
    {sel && <HospitalBookingModal data={data} h={sel} onClose={()=>setSel(null)}/>}
    {detail && <HospitalDetailModal data={data} h={detail} onClose={()=>setDetail(null)} onBook={x=>{setDetail(null);setSel(x);}}/>}
  </>);
}

function HospitalRec({data,onGo}){
  const {onto,dz}=usePetOntology();
  const [region,setRegion]=useState(PET_LOC.sido);
  const [detail,setDetail]=useState(null), [sel,setSel]=useState(null);
  const atHome=region===PET_LOC.sido;
  const {emergency,byGu,regionCount,distribution}=React.useMemo(()=>{
    const si=data.sido.indexOf(region); const dist={}; const inR=[];
    for(const h of data.hospitals){ dist[data.sido[h[1]]]=(dist[data.sido[h[1]]]||0)+1; if(h[1]===si) inR.push(h); }
    const emergency=inR.filter(h=>isEmergency(h[0])).slice(0,6);
    const guMap={}; for(const h of inR)(guMap[h[2]]||(guMap[h[2]]=[])).push(h);
    let byGu=Object.keys(guMap).map(gu=>({gu,items:guMap[gu],home:atHome&&gu.indexOf(PET_LOC.sigungu)>=0})).sort((a,b)=>b.items.length-a.items.length);
    if(atHome){ const hi=byGu.findIndex(g=>g.home); if(hi>0){ const home=byGu.splice(hi,1)[0]; byGu.unshift(home); } }
    return {emergency,byGu,regionCount:inR.length,distribution:dist};
  },[data,region]);
  const sidoChips=React.useMemo(()=>[...data.sido].sort((a,b)=>SIDO_ORDER.indexOf(a)-SIDO_ORDER.indexOf(b)),[data]);
  const iconOf=(sys)=> !sys?Stethoscope : sys.indexOf("정형")>=0?Bone : sys.indexOf("치과")>=0?Smile : sys.indexOf("심혈관")>=0?HeartPulse : sys.indexOf("근골격")>=0?Bone : Activity;
  const risks=computeMaruRisks(onto,dz).slice(0,3);
  const RECO=[
    {t:"정기 건강검진",ic:Stethoscope,why:"건강점수 92 유지 — 연 1~2회 정기검진 권장",pct:null},
    ...risks.map(r=>{ const care=CARE_OF[r.name]||"수의사 진료"; const parts=care.split(" · ");
      return {t:parts[0], ic:iconOf(r.system), why:`${r.name.replace(/\(.*\)/,"").trim()} 예측 위험 ${r.pct}% — ${parts[1]||"정기 점검 권장"}`, pct:r.pct}; }),
  ];
  return (<>
    <div className="airec">
      <div className="at"><Sparkles size={16} color="var(--orange)"/> AI 맞춤 동물병원 추천</div>
      <div className="ap">마루의 <b>품종(말티즈)·연령(4세)</b>을 10만 마리 빅데이터로 분석해 호발질환 위험을 산출하고, <b>필요한 진료과</b>가 가능한 동물병원을 거주 지역에서 찾아드려요. <span className="sub2">※ 진단이 아닌 건강관리 참고 정보</span></div>
    </div>
    <div className="card">
      <div className="rct"><Stethoscope size={18} color="var(--orange)"/> 마루에게 권장되는 진료 <span className="sub">· AI 위험 분석 연동</span></div>
      {RECO.map((r,i)=>{ const c=r.pct==null?"var(--orange)":r.pct>=60?"#EF5B5B":r.pct>=35?"#E8913A":"#4FB286"; return (
        <div className="adv" key={i}><span className="ic"><r.ic size={18} color={c}/></span>
          <div style={{flex:1}}><b>{r.t}</b>{r.pct!=null&&<span className="cbadge" style={{marginLeft:6,color:c,background:"var(--cream)"}}>위험 {r.pct}%</span>}<p>{r.why}</p></div></div>
      );})}
      <div className="chnote" style={{marginTop:4}}>※ 권장 진료는 마루의 AI 위험 예측·건강점수 기반 예시입니다. 정확한 진단·처방은 동물병원 수의사 상담을 권고합니다.</div>
    </div>
    <div className="bklbl spread"><span><User size={13} style={{verticalAlign:"-2px"}}/> 보호자 거주지 <b style={{color:"var(--orange-deep)"}}>{PET_LOC.addr}</b></span>{!atHome&&<button className="fsel" onClick={()=>setRegion(PET_LOC.sido)}>내 거주지로</button>}<span style={{marginLeft:"auto",color:"var(--muted)"}}>{region} <b style={{color:"var(--orange-deep)"}}>{regionCount.toLocaleString()}</b>곳</span></div>
    <div className="regions">{sidoChips.map(r=><button key={r} className={`fsel ${region===r?"on":""}`} onClick={()=>setRegion(r)}>{r===PET_LOC.sido&&<Home size={11} style={{verticalAlign:"-1px",marginRight:3}}/>}{r}{distribution[r]?<span className="cnt">{distribution[r].toLocaleString()}</span>:""}</button>)}</div>
    {emergency.length>0 && <div className="card emer">
      <div className="rct"><Siren size={18} color="#EF5B5B"/> 24시·응급 동물병원 <span className="sub">· {region} {emergency.length}곳</span></div>
      <div className="benefit" style={{marginBottom:10}}><span><Siren size={15}/> 야간·응급 진료</span><span><ShieldCheck size={15}/> 무상 임베디드 펫보험 자동 적용</span><span><Award size={15}/> NFT 예약증</span></div>
      {emergency.map((h,i)=><HospRow key={i} data={data} h={h} onDetail={setDetail} onBook={setSel}/>)}
    </div>}
    <div className="bklbl"><MapPin size={14} color="var(--orange)" style={{verticalAlign:"-2px"}}/> {region} 지역별 추천 동물병원 {atHome&&<span className="sub">· 내 동네({PET_LOC.sigungu}) 우선</span>}</div>
    {byGu.length===0 && <div className="hload">{region}에서 병원을 찾지 못했습니다. 다른 지역을 선택해 보세요.</div>}
    {byGu.slice(0,6).map(({gu,items,home})=><div className={`card ${home?"home":""}`} key={gu}>
      <div className="rct"><MapPin size={16} color={home?"var(--orange-deep)":"var(--orange)"}/> {gu} <span className="sub">· {items.length}곳</span>{home&&<span className="cbadge org"><Home size={10}/> 내 동네</span>}</div>
      {items.slice(0,3).map((h,i)=><HospRow key={i} data={data} h={h} onDetail={setDetail} onBook={setSel}/>)}
      {items.length>3 && <button className="cbtn" onClick={()=>onGo({sido:region,sgg:gu})}>{gu} 추천 병원 더 보기 ({items.length-3}곳 더) ›</button>}
    </div>)}
    <div className="chnote">※ <b>24시·응급·제휴 표시는 상호명 기준 데모 예시</b>이며, 실제 제휴·우대 혜택은 제휴 동물병원 DB 연동 시 반영됩니다. 목록은 LOCALDATA 공공데이터({data.meta.asof}) 기반입니다.</div>
    {sel && <HospitalBookingModal data={data} h={sel} onClose={()=>setSel(null)}/>}
    {detail && <HospitalDetailModal data={data} h={detail} onClose={()=>setDetail(null)} onBook={x=>{setDetail(null);setSel(x);}}/>}
  </>);
}

                <div className="resitem"><span className="ic pu"><Award size={18} color="#8A63D2"/></span><div><b>NFT 예약증 발행</b><div className="sub2">지갑에 SBT 예약증이 발행되고 알림이 발송됩니다.</div></div></div>
                <div className="resitem"><span className="ic or"><FileSignature size={18} color="var(--orange)"/></span><div><b>무상 임베디드 펫보험 자동 적용</b><div className="sub2">치료 발생 시 예상 본인부담금이 자동 계산됩니다. (예시)</div></div></div>

let _petOntoP=null;
function usePetOntology(){
  const [s,setS]=useState({loading:true,error:null,onto:null,dz:null});
  useEffect(()=>{
    if(!_petOntoP) _petOntoP=Promise.all([
      fetch("./data/pet_ontology.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}),
      fetch("./data/pet_diseases.json").then(r=>r.ok?r.json():{diseases:[]}),
    ]);
    let alive=true;
    _petOntoP.then(([onto,dz])=>alive&&setS({loading:false,error:null,onto,dz})).catch(e=>alive&&setS({loading:false,error:String(e.message||e),onto:null,dz:null}));
    return ()=>{alive=false;};
  },[]);
  return s;
}

    <div className="ontowrap">
      <div className="ontocanvas">

            <g key={i}>
              <line x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke="#E7D8C6" strokeWidth="1.6"/>

function DiseaseKB({dz}){
  const list=dz&&dz.diseases||[];
  const [sp,setSp]=useState("전체"),[sys,setSys]=useState("전체"),[q,setQ]=useState("");
  const systems=React.useMemo(()=>["전체",...new Set(list.map(d=>d.system))],[list]);
  const spLabel={dog:"강아지",cat:"고양이",both:"공용"};
  const view=list.filter(d=>(sp==="전체"||d.species===sp||(sp!=="both"&&d.species==="both"))&&(sys==="전체"||d.system===sys)&&(!q.trim()||d.name.includes(q)||(d.sx||"").includes(q)));
  return (<>
    <div className="regions">{[["전체","전체"],["dog","강아지"],["cat","고양이"]].map(([k,l])=><button key={k} className={`fsel ${sp===k?"on":""}`} onClick={()=>setSp(k)}>{l}</button>)}</div>
    <div className="regions">{systems.map(s=><button key={s} className={`fsel ${sys===s?"on":""}`} onClick={()=>setSys(s)}>{s==="전체"?"계통 전체":s}</button>)}</div>
    <div className="filterbar"><div className="fsearch"><Search size={15}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="질병명·증상 검색"/></div></div>
    <div className="chcount">질병 <b style={{color:"var(--orange-deep)"}}>{view.length}</b>종 <span className="sub2">(전체 {list.length}종 지식베이스)</span></div>
    <div className="dzgrid">{view.map((d,i)=>{ const c=d.risk==="높음"?"#EF5B5B":d.risk==="중간"?"#E8913A":"#4FB286"; return (
      <div className="dzc" key={i}>
        <div className="dzh"><span className="dzsp">{spLabel[d.species]}</span><span className="dzsys">{d.system}</span><span className="dzrisk" style={{color:c,background:c+"22"}}>{d.risk}</span></div>

      </div>

  </>);
}

function computeSourcing(it,p){
  const base=it.fob*p.fx;
  const ship=base*p.ship, duty=base*p.duty, quar=base*p.quar, ops=base*p.ops;
  const vat=(base+ship+duty)*p.vat;
  const landed=base+ship+duty+quar+ops+vat;
  const hasKr=it.kr>0;
  const price=hasKr ? Math.round(it.kr*(1-p.disc)/100)*100      // 국내가 대비 인하
                    : Math.round(it.usd*p.fx/100)*100;          // 미유통=미국 소매가 환산으로 판매
  const marginW=price-landed, marginPct=price>0?marginW/price:0;
  const insReserve=marginW>0?marginW*p.ins:0, profit=marginW>0?marginW*(1-p.ins):marginW;
  const saveW=hasKr?it.kr-price:0;
  return {landed,price,marginW,marginPct,insReserve,profit,saveW,hasKr};
}

  const dzmap=Object.fromEntries(((dz&&dz.diseases)||[]).map(d=>[d.name,d]));
  return (bd?bd.top:[]).map(t=>{ const d=dzmap[t.name]||{}; const cost=DISEASE_COST[t.name]||null; const cov=covOf(d.system); return {
    name:t.name, pct:t.pct, system:d.system||"", risk:d.risk||(t.pct>=60?"중간":"낮음"), sx:d.sx||"",
    cost, cov, self: cost?Math.round(cost*(1-cov/100)):null, care:CARE_OF[t.name]||"수의사 상담", product:PRODUCT_OF[t.name]||"" }; });
}

    {risks.map((r,i)=>(
      <div className="estc" key={i}>
        <div><div className="en">{r.name} <span className="cbadge" style={{color:r.pct>=60?"#D33":"#C98A12",background:r.pct>=60?"#FDE4E4":"#FFF1D6"}}>{r.pct}%</span></div>

          <button className="linkmini" onClick={()=>nav&&nav(r.system.indexOf("치과")>=0||r.system.indexOf("정형")>=0?"병원/예약":"제품 쇼핑")}>바로가기 ›</button></div>

  box-shadow:0 5px 14px rgba(244,132,60,.32)}

.airec .ap{font-size:13px;color:var(--sub);margin-top:7px;line-height:1.6}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}

.card.home{border:1.5px solid #FBD3AC;background:linear-gradient(180deg,#FFF8F1,#fff)}
.rct{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;margin-bottom:10px}
.rct .sub{font-size:12px;color:var(--muted);font-weight:600}
.adv{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.adv:last-of-type{border-bottom:none}
.adv .ic{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;background:var(--orange-soft)}

.bkov{position:fixed;inset:0;background:rgba(58,44,34,.5);display:grid;place-items:center;z-index:100;padding:18px}
.bk{background:#fff;border-radius:20px;width:min(460px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}

.bkh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.bkh .bt{font-size:16px;font-weight:900;display:flex;align-items:center;flex-wrap:wrap;line-height:1.3}
.xbtn{color:var(--muted);display:grid;place-items:center}
.dbody,.bkb{padding:16px 18px;overflow-y:auto}
.dsec{margin-bottom:16px}
.dh{font-size:13px;font-weight:800;color:var(--orange-deep);margin-bottom:8px}
.feat{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.feat b{font-size:13.5px}
.sub2{font-size:11.5px;color:var(--muted);line-height:1.5}
.bkfoot{padding:14px 18px;border-top:1px solid var(--border)}
.bkinfo{background:var(--cream);border:1px solid var(--border);border-radius:13px;padding:13px 15px;margin-bottom:6px}
.bkinfo .n{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.bkinfo .m{font-size:12px;color:var(--sub);margin-top:5px}
.bkinfo .t{font-size:12px;color:var(--orange-deep);font-weight:700;margin-top:4px}
.petpick{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);border-radius:13px;padding:11px 14px}
.petpick .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,#FFE7D3,#FFF1D6)}
.petpick b{font-size:14px}
.cal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.calc{padding:9px 0;border-radius:11px;border:1px solid var(--border);background:#fff;cursor:pointer;text-align:center;transition:all .14s}
.calc.on{background:linear-gradient(135deg,var(--orange),var(--amber));border-color:transparent;color:#fff}
.calc .d{font-size:15px;font-weight:800}
.calc .w{font-size:10.5px;color:var(--muted);margin-top:2px}
.calc.on .w{color:#fff;opacity:.85}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.slot{padding:10px 0;border-radius:11px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;
  font-weight:700;color:var(--sub);text-align:center;transition:all .14s}
.slot.on{background:linear-gradient(135deg,var(--orange),var(--amber));border-color:transparent;color:#fff}
.bkconfirm{text-align:center;padding:8px 0}
.bkconfirm .okic{width:60px;height:60px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;margin:0 auto 12px}
.bkconfirm .ttl{font-size:17px;font-weight:900}
.reslist{display:flex;flex-direction:column;gap:9px;margin-top:16px;text-align:left}
.resitem{display:flex;gap:11px;align-items:flex-start;background:var(--cream);border:1px solid var(--border);border-radius:13px;padding:12px 14px}
.resitem .ic{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;background:#fff}
.resitem .ic.gr{background:var(--green-soft)}
.resitem .ic.pu{background:#F2E9FF}
.resitem .ic.or{background:var(--orange-soft)}
.resitem b{font-size:13px}
.leaflet-popup-content{font-family:Pretendard,sans-serif;font-size:12.5px;line-height:1.5}

/* ===== 건강관리 ===== */
.hmtop{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.sumbox{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:14px;
  background:linear-gradient(135deg,#FFF6EC,#FFEFDB);border:1px solid #F8E4C3}
.sumbox b{font-size:13.5px;color:var(--orange-deep)}
.sumbox p{margin:4px 0 4px;font-size:13px;color:var(--sub);line-height:1.6}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:8px}
.statc{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}

.dtable{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--border);font-size:13px}
.drow:last-child{border-bottom:none}

.drow.img{grid-template-columns:1.1fr 2fr auto}
.drow .dimg{font-size:12.5px;color:var(--sub);line-height:1.5}
.riskgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.riskc .ric{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center}

.riskc .rd{display:flex;align-items:center;gap:8px;margin-top:3px}
.riskc .dots{display:inline-flex;gap:4px}
.riskc .dots span{width:7px;height:7px;border-radius:50%}
.riskc .rwhy{margin:11px 0 0;font-size:12.5px;color:var(--sub);line-height:1.6}
.vrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.vrow:last-child{border-bottom:none}
.vic{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:grid;place-items:center}
.vrow .vn{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vrow .vm{font-size:12px;color:var(--muted);margin-top:3px}
.vrow .vnext{text-align:right;flex-shrink:0}
.hm2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:0}
.hm2 .card{margin-bottom:12px}
.mbars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:130px;padding-top:6px}

.mbar .bl{font-size:10.5px;color:var(--muted)}
/* ===== 보험 자동 펫실손 지원 ===== */
.orgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.orc{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.orh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.orn{font-size:13px;font-weight:800;color:var(--text)}

.orx{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px dashed var(--border);cursor:pointer}
.orx:last-of-type{border-bottom:none}

.ontofoot{width:100%;margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--cream);border:1px solid #FBD3AC;border-radius:12px;padding:10px 12px;cursor:pointer;font-size:12px;color:var(--sub);font-weight:600;text-align:left}

.opav{width:34px;height:34px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5B6B86,#41506B)}
.opro{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.opnav{width:100%;display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:13px;font-size:14px;font-weight:700;cursor:pointer;color:#41506B;background:#EEF2F8;border:1px solid #DDE5F0;transition:all .15s}

.opnav .opbadge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(120,80,40,.12);color:#7A5A2A}

.oplogout{width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:11px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);background:none;border:1px dashed var(--border)}

.adminf{display:flex;flex-direction:column;gap:5px}

.adminf input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;font-size:14px;background:var(--cream)}
.adminf input:focus{outline:none;border-color:var(--orange)}
.aerr{margin-top:10px;font-size:12.5px;font-weight:700;color:#D33;background:#FDE4E4;padding:8px 11px;border-radius:10px}
.adhint{margin-top:12px;text-align:center;font-size:12px;color:var(--muted)}
.adhint b{color:var(--orange-deep)}
/* 글로벌 소싱 콘솔 */
.srcprob{display:flex;gap:10px;background:#FFF3E8;border:1px solid #FBDABB;border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:13px;color:var(--sub);line-height:1.65}
.srcprob b{color:var(--text)}
.skpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.skpi>div{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow-sm)}
.skpi .kl{font-size:12px;color:var(--muted);font-weight:700}
.skpi .kv{font-size:24px;font-weight:900;margin-top:4px}
.skpi .kv .ku{font-size:14px;color:var(--muted)}
.skpi .kx{font-size:11px;color:var(--muted);margin-top:3px}
.qcard,.simcard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 4px}
.qc{background:var(--cream);border:1px solid var(--border);border-radius:13px;padding:12px 14px}
.qh{font-size:13px;font-weight:800;margin-bottom:5px}
.qb{font-size:12.5px;color:var(--sub);line-height:1.6}
.qb b{color:var(--text)}
.simgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;margin:14px 0}
.simrow{display:flex;flex-direction:column;gap:5px}
.simlab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;color:var(--sub)}
.simlab b{font-size:14px;color:var(--orange-deep)}
.simrow input[type=range]{width:100%;accent-color:var(--orange);cursor:pointer}
.simhint{font-size:11px;color:var(--muted)}
.srctbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.srctbl{display:grid;grid-template-columns:minmax(220px,2.2fr) .9fr 1fr 1.1fr 1fr .9fr 1fr;min-width:860px;background:#fff}
.srctbl .sh{font-size:12px;font-weight:800;color:#45607D;background:#EDF2F8;padding:11px 13px;border-bottom:1px solid var(--border)}
.srctbl .sh.r,.srctbl .sc.r{text-align:right}

.srctbl .sc.r{align-items:flex-end}
.sbn{font-size:13px;font-weight:800;color:var(--text)}
.scnt{font-size:11px;color:var(--muted);font-weight:600}
.spn{font-size:12px;color:var(--sub);font-weight:600}
.sgap{font-size:11px;color:var(--muted)}
.srisk{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);font-weight:600;margin-top:2px}
.rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.kstrike{color:var(--muted);text-decoration:line-through}
.ssave{font-size:11px;color:#3C9E72;font-weight:700}
.ssub{font-size:11px;color:var(--muted)}
.srcnote{background:#F5F1EC;border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.srn{font-size:12.5px;color:var(--sub);line-height:1.55;display:flex;gap:8px;align-items:flex-start}
.srn b{color:var(--text)}
@media(max-width:900px){ .skpi{grid-template-columns:1fr 1fr} .qgrid,.simgrid{grid-template-columns:1fr} }
.gradecard{background:#fff;border:1.5px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.gc-top{display:flex;align-items:center;gap:14px}
.gc-badge{flex-shrink:0;color:#fff;font-weight:900;font-size:15px;letter-spacing:.5px;padding:8px 16px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.gc-title{font-size:16px;font-weight:800}
.gc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.gc-stats>div{background:var(--cream);border:1px solid var(--border);border-radius:13px;padding:12px 14px}
.gc-stats .gl{font-size:11.5px;color:var(--muted);font-weight:700}
.gc-stats .gv{font-size:19px;font-weight:900;margin-top:3px}
.gc-prog{margin-top:14px}
.gc-track{height:9px;background:#F1E7DA;border-radius:999px;overflow:hidden}
.gc-fill{height:100%;border-radius:999px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.ins-intro{font-size:13.5px;color:var(--sub);line-height:1.7;margin:0 0 14px}
.instbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:16px;margin-bottom:14px}
.instbl{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr 1fr;min-width:680px}
.instbl .ic{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13.5px}
.instbl .ic.val{border-left:1px solid var(--border)}

.instbl .subrow{background:var(--cream);font-weight:800;color:var(--orange-deep);font-size:12.5px}
.instbl .rlbl{font-weight:800;color:var(--text)}
.nowtag{font-size:9.5px;font-weight:800;background:rgba(255,255,255,.3);padding:1px 6px;border-radius:999px}
.ins-cards{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ins-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff}
.ins-card .ich{color:#fff;font-weight:800;font-size:14px;padding:10px 12px;display:flex;align-items:center;gap:6px}
.ins-card .icb{padding:10px 12px}

.ib-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--sub);line-height:1.6}
.ib-ico{width:24px;height:24px;border-radius:8px;background:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:var(--shadow-sm)}

.ins-cta .cbtn{margin-top:0}
@media(max-width:760px){ .gc-stats{grid-template-columns:1fr} .instbl-wrap{display:none} .ins-cards{display:grid} .ins-cta{flex-direction:column} }
/* ===== 보험 (기존) ===== */
.covrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.covrow:last-of-type{border-bottom:none}

.covrow .cr{width:42px;text-align:right;font-weight:800;font-size:13px;color:var(--orange-deep)}
.estc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:9px}

.walhero .wl{font-size:13px;opacity:.92;font-weight:600}
.walhero .wv{font-size:38px;font-weight:900;letter-spacing:-1.2px;margin-top:2px}
.walhero .wsub{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px}
.walhero .wsub>div{font-size:12px;opacity:.95}
.walhero .wsub b{display:block;font-size:16px;font-weight:900;margin-top:3px}
/* ===== 유기동물 지원 기부 ===== */
.donatecard{background:linear-gradient(135deg,#FFF3EE,#FFE9E2);border:1.5px solid #FBD3C6;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.donatetop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.donateic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#FF7A6B,#EF5B5B);box-shadow:0 4px 10px rgba(239,91,91,.35);flex-shrink:0}
.donatecard .dttl{font-size:16px;font-weight:900;color:#D6453C}
.donatecard .dsub{font-size:12.5px;color:var(--sub);margin-top:1px}
.donaterow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.donaterow .dcell{background:#fff;border:1px solid #FBDDD4;border-radius:13px;padding:11px 13px}
.donaterow .dcl{font-size:11.5px;color:var(--muted);font-weight:700}
.donaterow .dcv{font-size:18px;font-weight:900;margin-top:3px}
.donatep{font-size:12.5px;color:var(--sub);line-height:1.6;margin:13px 0 10px}
.donatepartners{display:flex;flex-wrap:wrap;gap:7px}
.donatepartners span{font-size:11px;font-weight:700;color:#D6453C;background:#fff;border:1px solid #FBD3C6;border-radius:999px;padding:3px 10px}
@media(max-width:680px){ .donaterow{grid-template-columns:1fr} }
/* ===== 펫 온톨로지 ===== */
.otlegend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.otl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sub);background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 11px}
.otl i{width:18px;height:18px;border-radius:6px;display:grid;place-items:center}
.ontowrap{display:grid;grid-template-columns:1fr 260px;gap:14px;margin-bottom:12px}
.ontocanvas{background:linear-gradient(160deg,#fff,#FFF8F1);border:1px solid var(--border);border-radius:18px;padding:8px;overflow:hidden}
.ontopanel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;height:fit-content}
.ontopanel .opt{display:inline-block;color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
.ontopanel .opn{font-size:18px;font-weight:900;margin:8px 0 12px}
.opprops>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.opprops span{color:var(--muted);font-weight:600}.opprops b{text-align:right}
.opacts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.opacts button{font-size:12.5px;font-weight:700;color:var(--orange-deep);background:var(--orange-soft);border-radius:10px;padding:9px;cursor:pointer}
.opacts button:hover{background:#FFD7B8}
.obar{display:flex;align-items:center;gap:10px;padding:6px 0}
.obl{width:130px;flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obt{flex:1;height:9px;background:#F1E7DA;border-radius:999px;overflow:hidden}
.obf{height:100%;border-radius:999px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.obv{width:64px;text-align:right;font-size:12.5px;font-weight:800}
.bdgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.bdc{background:var(--cream);border:1px solid var(--border);border-radius:13px;padding:12px}
.bdh{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.bdh span{font-size:11px;color:var(--muted);font-weight:600}
.bdr{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:var(--sub)}
.bdr b{color:var(--orange-deep)}
.dzgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dzc{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px}
.dzh{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.dzh span{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px}
.dzsp{color:var(--orange-deep);background:var(--orange-soft)}
.dzsys{color:var(--sub);background:var(--cream);border:1px solid var(--border)}
.dzrisk{margin-left:auto}
.dzn{font-size:14.5px;font-weight:800}
.dzsx{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.dzbreeds{font-size:11px;color:var(--muted);margin-top:7px;border-top:1px dashed var(--border);padding-top:6px}
@media(max-width:900px){ .ontowrap{grid-template-columns:1fr} .bdgrid{grid-template-columns:repeat(2,1fr)} .dzgrid{grid-template-columns:repeat(2,1fr)} }
@media(max-width:680px){ .bdgrid,.dzgrid{grid-template-columns:1fr} .obl{width:96px} }
/* ===== 리워드 센터 ===== */
.mrow{display:flex;align-items:center;gap:12px;padding:13px 0}
.mr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mr-track{height:7px;background:#F1E7DA;border-radius:999px;overflow:hidden;margin-top:6px}
.mr-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#F4843C,#FFB547);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.goarrow{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:var(--cream);display:grid;place-items:center}
.goarrow:hover{background:var(--orange-soft)}
.erow{display:flex;align-items:center;gap:12px;padding:10px 0}
.erow .en2{font-size:13.5px;font-weight:700}
.erow .amt2{flex-shrink:0;font-size:13px;font-weight:900;color:var(--green);background:var(--green-soft);padding:4px 10px;border-radius:999px}
.linkmini{font-size:12px;font-weight:700;color:var(--orange-deep)}
.linkmini:hover{text-decoration:underline}
/* ===== 우리아이주치의 — 경고바 / 전문 수의사 ===== */
.warnbar{display:flex;gap:9px;align-items:flex-start;background:#FFF6E9;border:1px solid #F6E2BC;border-radius:14px;
  padding:12px 15px;margin-bottom:14px;font-size:12.5px;color:var(--sub);line-height:1.6}
.vetc{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:16px;
  padding:14px 16px;margin-bottom:10px;flex-wrap:wrap;transition:box-shadow .18s,transform .18s}
.vetc:hover{box-shadow:0 8px 22px rgba(196,128,72,.13);transform:translateY(-2px)}
.vetav{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--orange),var(--amber));box-shadow:0 4px 10px rgba(244,132,60,.35)}
.vetav.lg{align-self:flex-start}
.vetmain{flex:1;min-width:0}
.vetn{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.vettag{font-size:11.5px;font-weight:800;color:var(--orange-deep);background:var(--orange-soft);padding:2px 8px;border-radius:999px}
.vetsub,.vetsub2{font-size:12px;color:var(--muted);margin-top:3px}
.vettags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.vettags span{font-size:11px;font-weight:700;color:var(--sub);background:var(--cream);border:1px solid var(--border);border-radius:7px;padding:2px 7px}
.vettags .gr{color:var(--orange-deep);background:var(--orange-soft);border-color:transparent}
.vettags .gr.hp{color:#7C3AED;background:#F1ECFE}
.vettags .rm{color:#3C9E72;background:var(--green-soft);border-color:transparent}
.vettags .sd{color:#C98A12;background:#FFF1D6;border-color:transparent}
.vetbtns{display:flex;gap:6px;margin-top:2px}
.vetbook{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--orange-deep);background:var(--orange-soft);border-radius:999px;padding:7px 12px;flex-shrink:0;cursor:pointer}
.vetbook:hover{background:#FFD7B8}
.rewhint{display:flex;align-items:flex-start;gap:8px;background:linear-gradient(135deg,#FFF6EC,#FFEFDB);border:1px solid #F8E4C3;border-radius:12px;padding:11px 13px;margin:10px 0;font-size:12.5px;color:var(--sub);line-height:1.55}
.vetright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.vetrate{font-size:12.5px;font-weight:800;color:#E8913A}
.vetrate span{color:var(--muted);font-weight:600;font-size:11px}
.vetprice{font-size:12px;color:var(--sub);font-weight:700}
.vetbk{width:min(480px,100%);padding:0;overflow:hidden}
.vethd{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#FFF6EC,#FFEFDB)}
.vethd .vetav{width:38px;height:38px;border-radius:11px}
.vetbk .chatwrap{border:none;border-radius:0;height:auto}
@media(max-width:680px){ .vetright{flex-direction:row;align-items:center;width:100%;justify-content:space-between;border-top:1px solid var(--border);padding-top:10px;margin-top:2px} }
/* ===== AI 상담 ===== */
.chatwrap{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;height:540px;box-shadow:var(--shadow-sm)}
.chatlog{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,#FFFDFB,#FFF7EF)}
.cbub{max-width:80%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.cbub.ai{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:5px;color:var(--text)}
.cbub.me{align-self:flex-end;background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;border-bottom-right-radius:5px}
.cbub .av{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--orange-deep);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:11px 14px;border-top:1px solid var(--border);background:#fff}
.chip{font-size:12px;font-weight:700;color:var(--orange-deep);background:var(--orange-soft);border-radius:999px;padding:7px 12px;cursor:pointer;border:none;transition:background .14s}
.chip:hover{background:#FFD7B8}
.chatbar{display:flex;gap:9px;padding:12px 14px;border-top:1px solid var(--border);background:#fff;align-items:center}
.chatbar input{flex:1;border:1px solid var(--border);border-radius:999px;padding:11px 16px;font-family:inherit;font-size:14px;outline:none}
.chatbar input:focus{border-color:var(--orange)}
.chatbar button{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;display:grid;place-items:center;flex-shrink:0}
.cbub.urgent{background:#FDE4E4;border-color:#F6B8B8;color:#B3261E;font-weight:600}
.cbub.fu{align-self:flex-start;background:var(--cream);border:1px dashed var(--border);color:var(--sub);font-size:12.5px;font-style:italic;padding:8px 12px}
/* ===== 갤러리 ===== */
.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:10px}
.gthumb{padding:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;aspect-ratio:16/11;cursor:pointer;transition:transform .15s,box-shadow .15s}
.gthumb:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(196,128,72,.16)}
.gthumb img{width:100%;height:100%;object-fit:cover;display:block}
.lbwrap{position:relative;max-width:92vw;max-height:88vh}
.lbwrap img{max-width:92vw;max-height:88vh;border-radius:14px;display:block;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.lbx{position:absolute;top:-14px;right:-14px;background:#fff;border-radius:50%;width:36px;height:36px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
@media(max-width:860px){.gallery{grid-template-columns:repeat(3,1fr)}}
/* ===== NFT ===== */
.nftgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.nftc{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;transition:transform .18s,box-shadow .18s}
.nftc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(196,128,72,.14)}
.nftc .shield{position:relative;width:64px;height:70px;margin:0 auto 10px}
.nftc .nt{font-size:13.5px;font-weight:800;line-height:1.3}
.nftc .nd{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.nftc .ndt{font-size:11px;color:var(--orange-deep);font-weight:700;margin-top:7px}
/* ===== 제품 쇼핑 ===== */
.malllink{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;border-radius:14px;padding:13px 16px;margin-bottom:12px;font-weight:800;font-size:14px;box-shadow:0 5px 14px rgba(244,132,60,.3)}
.malllink b{font-weight:600;opacity:.95;font-size:12.5px}
.malllink:hover{filter:brightness(1.05)}
.tabbadge{margin-left:5px;background:#EF5B5B;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;min-width:16px;display:inline-block;text-align:center}
.chtab.on .tabbadge{background:#fff;color:var(--orange-deep)}
.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.prod{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.prod:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(196,128,72,.16)}
.pimg{position:relative;aspect-ratio:1/1;display:grid;place-items:center;font-size:46px;background:linear-gradient(150deg,#FFF6EC,#FFE9D6);overflow:hidden}
.pemoji{z-index:0}
.pphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.pbadge{z-index:2}
.pbadge{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pb{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;color:#fff}
.pb.pur{background:#8A63D2}.pb.org{background:var(--orange)}.pb.grn{background:var(--green)}
.pbody{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1}
.pbrand{font-size:11px;color:var(--muted);font-weight:700}
.pname{font-size:13.5px;font-weight:800;line-height:1.35;margin-top:2px;min-height:36px}
.ptags{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0}
.ptags span{font-size:10.5px;font-weight:700;color:var(--orange-deep);background:var(--orange-soft);border-radius:6px;padding:2px 6px}
.ptags span.og{color:var(--sub);background:var(--cream)}
.pbot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto}
.pprice{font-size:15px;font-weight:900}
.pprice s{font-size:11px;color:var(--muted);font-weight:600;margin-right:4px}
.pprice span{font-size:11px;font-weight:700;margin-left:1px}
.ptok{display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--orange-deep);font-weight:700;margin-top:2px}
.addbtn{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;display:grid;place-items:center;flex-shrink:0}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.qty button{width:30px;height:30px;font-size:16px;font-weight:800;color:var(--orange-deep);background:var(--cream)}
.qty span{width:34px;text-align:center;font-weight:800;font-size:13px}
.rmbtn{display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:700}
.payrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--sub)}
.payrow.tgrow{border-top:1px solid var(--border)}
.payrow.tot{border-top:1px solid var(--border);font-size:15px;font-weight:900;color:var(--text)}
.payrow.tot .num{color:var(--orange-deep)}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.ainp{border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13px;outline:none}
.ainp:focus{border-color:var(--orange)}
.ack{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--sub)}
.atbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.atbl th{text-align:left;color:var(--muted);font-size:11.5px;font-weight:700;padding:8px;background:var(--cream)}
.atbl td{padding:8px;border-top:1px solid var(--border)}
@media(max-width:680px){ .agrid{grid-template-columns:repeat(2,1fr)} }
/* ===== 마이페이지 토글/설정 ===== */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0}
.setrow .sn{font-size:14px;font-weight:700}
.tgl{width:46px;height:26px;border-radius:999px;background:#E2D5C4;position:relative;transition:background .18s;flex-shrink:0}
.tgl.on{background:var(--green)}
.tgl .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on .knob{left:23px}
.linkrow{width:100%;display:flex;align-items:center;justify-content:space-between;padding:15px 16px;font-size:14px;font-weight:700;background:#fff}
.linkrow:hover{background:var(--cream)}
@media(max-width:1100px){.shopgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){
  .statgrid{grid-template-columns:repeat(3,1fr)}
  .riskgrid,.hm2{grid-template-columns:1fr}
  .nftgrid{grid-template-columns:repeat(2,1fr)}
  .shopgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:680px){
  .cright{flex-basis:100%;width:100%;flex-direction:row;align-items:center;justify-content:space-between;
    border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
  .cright .hlink{font-size:13px}
  .cmain{flex:1 1 0}
  .cal{grid-template-columns:repeat(4,1fr)}
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .nftgrid{grid-template-columns:1fr}
  .walhero .wv{font-size:30px}
  .drow{grid-template-columns:1.4fr 1fr auto;font-size:12px}
  .drow .dref{display:none}
  .drow.dhdr span:nth-child(3){display:none}
}
`;
document.head.appendChild(css);

createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
