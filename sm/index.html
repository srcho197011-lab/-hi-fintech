/* ============================ HOOKS ============================ */
function useCountUp(target, dur=1100){
  const [v,setV]=useState(0);
  useEffect(()=>{
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){ setV(target); return; }
    let raf, start;
    const step=(t)=>{ if(!start)start=t; const p=Math.min((t-start)/dur,1);
      setV(Math.round(target*(1-Math.pow(1-p,3)))); if(p<1) raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf);
  },[target]);
  return v;
}

/* ============================ SHARED UI ============================ */
function Card({children,style,className}){
  const [hover,setHover]=useState(false);
  return (
    <div className={className}
      onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{background:"var(--white)",border:"1px solid var(--border)",borderRadius:20,
        padding:20,boxShadow:hover?"0 12px 30px rgba(20,58,99,.15)":"var(--shadow-sm)",
        transform:hover?"translateY(-3px)":"none",transition:"all .22s ease",...style}}>
      {children}
    </div>
  );
}
function CardHead({icon:Icon,title,action,onAction,fg="var(--navy)",bg="var(--navy-soft)"}){
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{width:34,height:34,borderRadius:11,background:bg,color:fg,
          display:"grid",placeItems:"center",flexShrink:0}}><Icon size={19}/></span>
        <h3 style={{margin:0,fontSize:18,fontWeight:800,color:"var(--text)"}}>{title}</h3>
      </div>
      {action && <button onClick={onAction} style={{display:"flex",alignItems:"center",gap:2,color:"var(--cyan-deep)",
        fontSize:13,fontWeight:700}}>{action}<ChevronRight size={15}/></button>}
    </div>
  );
}
function Btn({children,icon:Icon,variant="solid",small,onClick}){
  const base={display:"flex",alignItems:"center",justifyContent:"center",gap:6,
    fontWeight:700,borderRadius:999,transition:"all .18s",
    padding:small?"7px 14px":"10px 16px",fontSize:small?13:14};
  const styles=variant==="solid"
    ? {...base,background:"linear-gradient(135deg,var(--navy),var(--cyan))",color:"#fff",boxShadow:"0 4px 12px rgba(20,58,99,.32)"}
    : {...base,background:"var(--navy-soft)",color:"var(--navy)"};
  return <button onClick={onClick} style={styles}>{Icon&&<Icon size={small?15:16}/>}{children}</button>;
}
const LV = { "낮음":{c:"var(--green)",b:"var(--green-soft)"}, "양호":{c:"var(--green)",b:"var(--green-soft)"}, "정상":{c:"var(--green)",b:"var(--green-soft)"},
  "중간":{c:"var(--amber)",b:"var(--amber-soft)"}, "주의":{c:"var(--amber)",b:"var(--amber-soft)"},
  "높음":{c:"var(--danger)",b:"var(--danger-soft)"}, "위험":{c:"var(--danger)",b:"var(--danger-soft)"} };
function Pill({level}){ const s=LV[level]||LV["중간"]; return (
  <span style={{fontSize:12,fontWeight:800,color:s.c,background:s.b,padding:"3px 10px",borderRadius:999}}>{level}</span>); }
function Dots({n,color="var(--amber)"}){ return (
  <span style={{display:"inline-flex",gap:3}}>{[1,2,3].map(i=>(
    <span key={i} style={{width:8,height:8,borderRadius:"50%",background:i<=n?color:"var(--border)"}}/>))}</span>); }

function Gauge2({score}){
  const v=useCountUp(score);
  const C=Math.PI*64;
  const off=C*(1-v/100);
  return (
    <div style={{position:"relative",width:160,height:96,margin:"0 auto"}}>
      <svg viewBox="0 0 160 90" width="160" height="90">
        <path d="M16 84 A64 64 0 0 1 144 84" fill="none" stroke="#E7EDF4" strokeWidth="14" strokeLinecap="round"/>
        <path d="M16 84 A64 64 0 0 1 144 84" fill="none" stroke="url(#sg)" strokeWidth="14"
          strokeLinecap="round" strokeDasharray={C} strokeDashoffset={off} style={{transition:"stroke-dashoffset .3s"}}/>
        <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stopColor="#123A63"/><stop offset="1" stopColor="#1FA97A"/></linearGradient></defs>
      </svg>
      <div style={{position:"absolute",bottom:2,left:0,right:0,textAlign:"center"}}>
        <div style={{fontSize:40,fontWeight:900,lineHeight:1,color:"var(--text)"}} className="num">{v}</div>
        <div style={{fontSize:12,color:"var(--muted)",fontWeight:700}}>/100</div>
      </div>
    </div>
  );
}

/* ===== 데이터센터 화재보험료 파라메트릭 산정 모델 (개략 추정 · 데모/조정 가능) ===== */
const DCP = {
  infraUnit: 4000000,        // 건물·전기·공조 재조달 단가 (원/㎡)
  itUnit: 10000000000,       // IT동산 재조달 단가 (원/MW) = 100억/MW
  baseRate: 0.00045,         // 기본 화재요율 (TSI 대비 연, 내화+자동소화 기준)
  struct: { "내화(1급)":1.0, "준내화(2급)":1.35, "일반(3급)":1.9 },
  deduct: { "1천만":0, "5천만":0.08, "1억":0.15 },
  safety: (s)=> s>=90?{g:"A",d:0.30} : s>=80?{g:"B",d:0.15} : s>=70?{g:"C",d:0.06} : {g:"D",d:0},
  biAdd: 0.25,   // 기업휴지(BI) 특약 가산
  liAdd: 0.05,   // 배상책임 특약 가산
};
const eok=(n)=>{ n=Math.round(n);
  if(n>=100000000) return (n/100000000).toFixed(n>=1000000000?0:1).replace(/\.0$/,"")+"억원";
  if(n>=10000) return Math.round(n/10000).toLocaleString()+"만원";
  return "₩"+n.toLocaleString(); };
/* 산정기 입력 컨트롤 (모듈 스코프 — 리렌더 시 리마운트로 슬라이더 드래그 끊김 방지) */
function EstSeg({opts,val,set}){

          border:val===o?"none":"1px solid var(--border)",background:val===o?"var(--navy)":"#fff",color:val===o?"#fff":"var(--sub)"}}>{o}</button>))}
    </div>);
}
function EstRng({label,unit,val,set,min,max,step}){
  return (
    <div style={{marginBottom:15}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>

    </div>);
}
function EstTgl({on,set,label}){

}
function PremiumEstimator(){
  const [area,setArea]=useState(24000);
  const [mw,setMw]=useState(12);
  const [struct,setStruct]=useState("내화(1급)");
  const [score,setScore]=useState(94);
  const [deduct,setDeduct]=useState("5천만");
  const [bi,setBi]=useState(true);
  const [li,setLi]=useState(true);
  const infra=area*DCP.infraUnit, it=mw*DCP.itUnit, tsi=infra+it;
  const sf=DCP.struct[struct], sg=DCP.safety(score), dd=DCP.deduct[deduct];
  const addon=1+(bi?DCP.biAdd:0)+(li?DCP.liAdd:0);
  const fireBase=tsi*DCP.baseRate*sf;
  const premiumNoDisc=Math.round(fireBase*(1-dd)*addon);
  const premium=Math.round(fireBase*(1-sg.d)*(1-dd)*addon);
  const saved=premiumNoDisc-premium;
  const effRate=premium/tsi*100;
  const itPct=Math.round(it/tsi*100);
  const gc=LV[sg.g==="A"||sg.g==="B"?"양호":sg.g==="C"?"주의":"위험"];
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>

          <CardHead icon={Settings} title="시설 조건 입력" fg="var(--navy)" bg="var(--navy-soft)"/>

          <div style={{marginBottom:15}}><div style={{fontSize:12.5,fontWeight:700,color:"var(--sub)",marginBottom:7}}>건물 구조</div>

        </Card>
        {/* 결과 */}
        <Card style={{background:"linear-gradient(155deg,#0B2545,#123A63 60%,#0E7490)",color:"#fff",border:"none"}}>
          <div style={{fontSize:12.5,color:"#BFD5EA",fontWeight:700}}>연 화재보험료 (개략 추정)</div>
          <div style={{fontSize:38,fontWeight:900,letterSpacing:-1,margin:"2px 0"}}>{eok(premium)}<span style={{fontSize:16,color:"#BFE6F1",fontWeight:700}}> /년</span></div>

        </div>
      </Card>
    </div>

}

/* ============================ CERT SECTION ============================ */

      <div className="grid-3">
        {CERTS.map((c,i)=>{ const Icon=c.ic; return (
          <Card key={i}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
              <span style={{width:48,height:48,borderRadius:15,background:"linear-gradient(135deg,#8A63D2,#B79AE6)",color:"#fff",display:"grid",placeItems:"center"}}><Icon size={24}/></span>
              {c.sbt
                ? <span style={{fontSize:11,fontWeight:800,color:"#8A63D2",background:"#F2ECFB",padding:"4px 10px",borderRadius:999}}>SBT · 양도불가</span>
                : <span style={{fontSize:11,fontWeight:800,color:"var(--cyan-deep)",background:"var(--cyan-soft)",padding:"4px 10px",borderRadius:999}}>증서</span>}
            </div>
            <div style={{fontSize:15,fontWeight:800,marginBottom:5}}>{c.t}</div>
            <div style={{fontSize:12.5,color:"var(--sub)",lineHeight:1.5,marginBottom:10}}>{c.desc}</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:12,color:"var(--muted)",borderTop:"1px dashed var(--border)",paddingTop:10}}>
              <span className="num">{c.date}</span>
              <button onClick={()=>toast("무결성 해시 검증(데모)")} style={{fontSize:12,fontWeight:700,color:"#8A63D2",display:"flex",alignItems:"center",gap:3}}><BadgeCheck size={14}/>검증</button>
            </div>
          </Card>);})}
      </div>
      <Card style={{marginTop:18}}>
        <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
          <FileSignature size={22} color="#8A63D2" style={{flexShrink:0,marginTop:2}}/>
          <div style={{fontSize:13,color:"var(--sub)",lineHeight:1.7}}>
            안전 증빙은 다른 섹션의 결과물(점검 리포트·관제 기록·예지정비·훈련 이수·보험 증서)을 모아 <b>변조 불가능한 무결성 해시</b>로 보관합니다.
            중대재해처벌법 대응 시 기업의 안전관리 이행 증빙 자료로 활용할 수 있습니다. <span style={{color:"var(--muted)"}}>(발급·해시는 데모입니다.)</span>
          </div>
        </div>
      </Card>
    </div>
  );
}

/* ============================ ADMIN / MYPAGE ============================ */
function AdminSection(){
  const [tg,setTg]=useState({ alert:true, share:true, predict:true, auto:false });
  const Toggle=({on,onClick})=>(
    <button onClick={onClick} style={{width:46,height:26,borderRadius:999,background:on?"var(--green)":"var(--border)",position:"relative",transition:"all .18s"}}>
      <span style={{position:"absolute",top:3,left:on?23:3,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"all .18s",boxShadow:"0 1px 3px rgba(0,0,0,.2)"}}/></button>);
  const rows=[
    ["alert","이상 감지 실시간 알림","센서·AI 관제 이상 시 즉시 통지"],
    ["share","안전데이터 제공 동의(DID)","온톨로지 연동·보험 인수 데이터 제공"],
    ["predict","AI 위험예측 사용","예지정비·핫스팟 예측 활성"],
    ["auto","보험 자동 청구 트리거","이벤트 발생 시 청구 자동 개시"],
  ];
  return (
    <div style={{display:"flex",flexDirection:"column",flex:1}}>
      <SecHead icon={Settings} title="관리자" desc="자산·설비 계정 정보와 안전관리 정책을 설정합니다" fg="var(--navy)" bg="var(--navy-soft)"/>
      <div className="grid-2-r">
        <Card>
          <CardHead icon={User} title="자산·계정" fg="var(--navy)" bg="var(--navy-soft)"/>
          <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:"11px 14px",fontSize:13.5}}>
            <span style={{color:"var(--muted)",fontWeight:600}}>자산명</span><b>{ASSET.name}</b>
            <span style={{color:"var(--muted)",fontWeight:600}}>유형</span><b>{ASSET.type}</b>
            <span style={{color:"var(--muted)",fontWeight:600}}>규모</span><b>{ASSET.scale}</b>
            <span style={{color:"var(--muted)",fontWeight:600}}>지역</span><b>{ASSET.region}</b>
            <span style={{color:"var(--muted)",fontWeight:600}}>자산 ID</span><b className="num">{ASSET.id}</b>
            <span style={{color:"var(--muted)",fontWeight:600}}>운영 관리사</span><b>하이젠케어㈜</b>
          </div>
          <div style={{marginTop:16}}><Btn small variant="soft" onClick={()=>toast("프로필 편집은 데모입니다")}><Settings size={15}/>계정 편집</Btn></div>
        </Card>
        <Card>
          <CardHead icon={Settings} title="안전관리 정책" fg="var(--cyan-deep)" bg="var(--cyan-soft)"/>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {rows.map(([k,t,d],i)=>(
              <div key={k} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 4px",borderBottom:i<rows.length-1?"1px dashed var(--border)":"none"}}>
                <div style={{flex:1}}><div style={{fontSize:13.5,fontWeight:700}}>{t}</div><div style={{fontSize:12,color:"var(--muted)"}}>{d}</div></div>
                <Toggle on={tg[k]} onClick={()=>setTg(s=>({...s,[k]:!s[k]}))}/>
              </div>))}
          </div>
        </Card>
      </div>
      <Card style={{marginTop:18}}>
        <CardHead icon={Phone} title="도입·제휴 문의" fg="var(--green)" bg="var(--green-soft)"/>
        <div style={{fontSize:13,color:"var(--sub)",lineHeight:1.7,marginBottom:12}}>
          데이터센터·금융/기업전산실·재생에너지(ESS)·아파트·EV충전 등 안전관리 도입 및 참여사 제휴 문의를 받습니다.
        </div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <Btn onClick={()=>toast("도입 문의 접수(데모)")}><Send size={16}/>도입 문의</Btn>
          <Btn variant="soft" onClick={()=>toast("제휴 제안 접수(데모)")}><Users size={16}/>참여사 제휴</Btn>
        </div>
      </Card>
    </div>
  );
}

/* ============================ APP ============================ */
function App(){
  const [active,setActive]=useState("홈");
  const [open,setOpen]=useState(false);
  const [toastMsg,setToastMsg]=useState(null);
  useEffect(()=>{ window.__smToast=(m)=>{ setToastMsg(m); clearTimeout(window.__smToastT); window.__smToastT=setTimeout(()=>setToastMsg(null),2600); }; return ()=>{ window.__smToast=null; }; },[]);
  return (
    <NavCtx.Provider value={setActive}>
    {toastMsg && <div className="toast">{toastMsg}</div>}
    <div style={{display:"flex",minHeight:"100vh"}}>
      <Sidebar active={active} setActive={setActive} open={open} onClose={()=>setOpen(false)}/>
      <main style={{flex:1,minWidth:0,padding:"24px 28px 8px",display:"flex",flexDirection:"column"}}>
        <TopBar onMenu={()=>setOpen(true)}/>
        <QuickBar nav={setActive}/>
        {active==="안전 온톨로지" ? <OntologySection/>
        : active==="실시간 관제" ? <MonitorSection/>
        : active==="AI 위험예측" ? <PredictSection/>
        : active==="대상 솔루션" ? <SegmentSection/>
        : active==="화재특종보험" ? <InsuranceSection/>
        : active==="안전지갑" ? <RewardSection/>
        : active==="참여사 생태계" ? <PartnerSection/>
        : active==="안전 증빙" ? <CertSection/>
        : active==="관리자" ? <AdminSection/>
        : (
          <div style={{display:"flex",flexDirection:"column",gap:18}}>
            <div className="grid-3">
              <AssetProfileCard/>
              <SafetySummaryCard/>
              <WalletCard/>
            </div>
            <div className="grid-3">
              <AiPredictCard/>
              <ScheduleCard/>
              <ActivityCard/>
            </div>
            <div className="grid-4">
              <RiskCard/>
              <SmartPolicyCard/>
              <TokenCard/>
              <CertCard/>
            </div>
          </div>
        )}
        <footer style={{textAlign:"center",fontSize:11.5,color:"var(--muted)",padding:"16px 0 20px",lineHeight:1.6}}>
          🛡️ Hi-Safety · AI-SM 통합 안전관리 임베디드 보험 플랫폼 — 시연용 목업<br/>
          본 화면의 모든 안전·설비·보험·수익 수치는 플랫폼 소개용 예시(목업)이며, 실제 안전 진단이나 구체적 보험료·보험금 지급을 보장하지 않습니다.
        </footer>
      </main>
    </div>
    </NavCtx.Provider>
  );
}

/* ===== 토스트 / 알림 드롭다운 ===== */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:200;
  background:rgba(11,37,69,.95);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastin .25s ease}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.notidrop{position:absolute;top:50px;right:0;z-index:61;width:290px;background:#fff;border:1px solid var(--border);
  border-radius:16px;box-shadow:0 14px 34px rgba(20,58,99,.2);padding:8px;overflow:hidden}
.notihd{font-size:13px;font-weight:800;padding:8px 10px 6px;display:flex;align-items:center;gap:6px}
.notihd span{background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px}
.notiitem{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:10px;border-radius:11px;background:none;cursor:pointer}
.notiitem:hover{background:var(--navy-soft)}
.notidot{width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-top:5px;flex-shrink:0}
.notit{font-size:13px;font-weight:700}
.notid{font-size:11.5px;color:var(--muted);margin-top:2px}
.notiall{width:100%;text-align:center;padding:9px;font-size:12.5px;font-weight:700;color:var(--cyan-deep);background:var(--navy-soft);border-radius:11px;margin-top:4px;cursor:pointer}
/* ===== 상단 빠른메뉴 (입체 타일) ===== */
.qtop{display:flex;gap:10px;background:linear-gradient(135deg,#FFFFFF,#F2F7FC);border:1px solid var(--border);
  border-radius:20px;padding:15px 16px;margin-bottom:20px;box-shadow:var(--shadow-sm);overflow-x:auto}
.qitem{flex:1;min-width:76px;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;cursor:pointer}
.qico{position:relative;width:56px;height:56px;border-radius:17px;display:grid;place-items:center;
  background:linear-gradient(160deg,#FFFFFF 0%,#EAF2FA 100%);
  box-shadow:0 7px 14px rgba(20,58,99,.15), inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -4px 7px rgba(20,58,99,.08);
  transition:transform .16s ease, box-shadow .16s ease}
.qico svg{filter:drop-shadow(0 2px 2px rgba(20,58,99,.18))}
.qitem:hover .qico{transform:translateY(-4px);box-shadow:0 14px 22px rgba(20,58,99,.24), inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -4px 7px rgba(20,58,99,.08)}
.qitem:active .qico{transform:translateY(-1px)}
.qlabel{font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
.qitem:hover .qlabel{color:var(--navy)}
.qbadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
input[type=range]{height:6px;border-radius:999px;background:var(--border)}
/* ===== 손해보험사 로고 그리드 ===== */
.insurergrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}

.insurercard:hover{border-color:var(--cyan);box-shadow:0 10px 22px rgba(20,58,99,.14);transform:translateY(-3px)}
.insurerlogo{width:100%;height:44px;display:grid;place-items:center}
